<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 866" width="960" height="866" role="img" aria-labelledby="europe-results-movers-12pm-t europe-results-movers-12pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="europe-results-movers-12pm-t">Results day in Europe: B&amp;M, Burberry and Siemens up, Telefónica down</title><desc id="europe-results-movers-12pm-d">Bar chart of share-price moves on Thursday morning 12 November 2026, as reported by dpa-AFX/RTTNews at 10:48 CET: B&amp;M European Value Retail up 17 percent, Burberry up 8 percent, Siemens up 4.6 percent, Munich Re up 1.7 percent, Zurich Insurance up 1.3 percent, BHP down 1.2 percent, BAE Systems down 1.3 percent and Telefónica down 2.3 percent. These are morning snapshot moves, not closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="europe-results-movers-12pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="866" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · EUROPE</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Results day in Europe: B&amp;M, Burberry and Siemens up, Telefónica</text><text x="32" y="102" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7