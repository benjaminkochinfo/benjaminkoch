<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" role="img" aria-labelledby="israel-turnout-27pm-t israel-turnout-27pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="israel-turnout-27pm-t">Ahead of 2022 at every hour</title><desc id="israel-turnout-27pm-d">Bar chart of Israeli election turnout by the hour, 2022 against 27 October 2026. By 10:00 local time it was 15.9% in 2022 and 16.68% in 2026; by 12:00, 28.4% and 31.5%; by 14:00, 38.9% and 44.9%; by 16:00, 47.5% in 2022 and 55.7% in 2026, the latest reading.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="israel-turnout-27pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="830" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">INSIDE DESK · PSYCHOLOGY &amp; BEHAVIOUR</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Ahead of 2022 at every hour</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Israel, Knesset election turnout reported by the Central Elections Committee, % of eligible voters by the hour shown, 2022 and 27 Oct</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-s