<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" width="960" height="534" role="img" aria-labelledby="koerber-ukraine-aid-26nov-t koerber-ukraine-aid-26nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="koerber-ukraine-aid-26nov-t">Military aid to Ukraine: 59% for in 2025, 46% in 2026</title><desc id="koerber-ukraine-aid-26nov-d">Bar chart of German opinion on military support for Ukraine in the Körber-Stiftung Berlin Pulse survey: in favour 59 percent in 2025 and 46 percent in September 2026; against 39 percent in 2025 and 53 percent in September 2026. The latest survey, of 1,501 eligible voters by Forsa, shows a narrow majority of 53 percent against.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="koerber-ukraine-aid-26nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="534" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">POLITICS · GERMANY</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Military aid to Ukraine: 59% for in 2025, 46% in 2026</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Share of eligible voters in Germany for and against German military support for Ukraine, in %, Körber-Stiftung Berlin Pulse (Forsa),</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">surveys of 2025 and September 2026</text><line x1="32.0" x2="32.0" y1="162" y2="450" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="234.0" x2="234.0" y1="162" y2="450" stroke="rgba(236,231,220,0.11)"/><text x="234.0" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">20</text><line x1="436.0" x2="436.0" y1="162" y2="450" stroke="rgba(236,231,220,0.11)"/><text x="436.0" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">40</text><line x1="638.0" x2="638.0" y1="162" y2="450" stroke="rgba(236,231,220,0.11)"/><text x="638.0" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">60</text><line x1="840.0" x2="840.0" y1="162" y2="450" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">80</text><text x="32" y="180" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">For, 2025</text><rect x="32" y="190" width="595.9" height="26" rx="2" fill="#F2A93B"/><text x="637.9" y="209" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">59.0%</text><text x="32" y="254" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">For, 2026</text><rect x="32" y="264" width="464.6" height="26" rx="2" fill="#4CC9B0"/><text x="506.6" y="283" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">46.0%</text><text x="32" y="328" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Against, 2025</text><rect x="32" y="338" width="393.9" height="26" rx="2" fill="#FF7A5C"/><text x="435.9" y="357" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">39.0%</text><text x="32" y="402" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Against, 2026</text><rect x="32" y="412" width="535.3" height="26" rx="2" fill="#A99BFF"/><text x="577.3" y="431" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">53.0%</text><line x1="32" x2="928" y1="490" y2="490" stroke="rgba(236,231,220,0.11)"/><text x="32" y="512" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>Körber-Stiftung, The Berlin Pulse 2026/27, Forsa survey of 1,501 eligible voters, September 2026, press…</text><rect x="820" y="503" width="8" height="8" fill="#F2A93B"/><text x="928" y="512" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>