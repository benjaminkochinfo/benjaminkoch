<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="de-retail-sep-02pm-t de-retail-sep-02pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-retail-sep-02pm-t">September's tills fell in every aisle</title><desc id="de-retail-sep-02pm-d">Bar chart of how far German retail sales fell in September 2026 against August, in real terms, calendar and seasonally adjusted, provisional. Petrol stations fell 3.4%, although their nominal sales rose 2.1%. Non-food retail fell 2.4%. Online and mail order fell 2.2%. All retail fell 2.0%. Food retail fell 1.4%, the smallest fall. The latest values are for September 2026, published on 2 November 2026.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-retail-sep-02pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="580" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · SHOPS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">September's tills fell in every aisle</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Fall in German retail sales in September 2026 against August, real (price-adjusted), calendar and seasonally adjusted, provisional, %</text><line x1="32.0" x2="32.0" y1="134" y2="496" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="234.0" x2="234.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="234.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">1</text><line x1="436.0" x2="436.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="436.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">2</text><line x1="638.0" x2="638.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="638.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">3</text><line x1="840.0" x2="840.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">4</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Petrol stations (nominal +2.1%)</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Destatis</text><rect x="32" y="162" width="686.8" height="26" rx="2" fill="#F2A93B"/><text x="728.8" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">3.4%</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Non-food retail</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Destatis</text><rect x="32" y="236" width="484.8" height="26" rx="2" fill="#4CC9B0"/><text x="526.8" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">2.4%</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Online and mail order</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Destatis</text><rect x="32" y="310" width="444.4" height="26" rx="2" fill="#FF7A5C"/><text x="486.4" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">2.2%</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">All retail</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Destatis</text><rect x="32" y="384" width="404.0" height="26" rx="2" fill="#A99BFF"/><text x="446.0" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">2.0%</text><text x="32" y="448" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Food retail</text><text x="928" y="448" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Destatis</text><rect x="32" y="458" width="282.8" height="26" rx="2" fill="#C9D1D9"/><text x="324.8" y="477" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">1.4%</text><line x1="32" x2="928" y1="536" y2="536" stroke="rgba(236,231,220,0.11)"/><text x="32" y="558" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>Statistisches Bundesamt (Destatis), press release no. 383 of 2 November 2026, retail turnover September 2026…</text><rect x="820" y="549" width="8" height="8" fill="#F2A93B"/><text x="928" y="558" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>