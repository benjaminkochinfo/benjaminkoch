<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" role="img" aria-labelledby="us-tuesday-falls-25nov-t us-tuesday-falls-25nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="us-tuesday-falls-25nov-t">Tuesday's falls: ADI 17.4%, HPE 16.3%, Nvidia 5.9%</title><desc id="us-tuesday-falls-25nov-d">Bar chart of Tuesday 24 November 2026 closing falls in New York, every one lower on the day: Analog Devices down 17.37 percent to $312.95, Hewlett Packard Enterprise down 16.31 percent to $40.19, Dell Technologies down 11.83 percent to $295.28, Micron Technology down 11.01 percent to $629.79, Anthropic down 6.55 percent to $81.91, Nvidia down 5.86 percent to $155.38, the Nasdaq Composite down 1.48 percent to 23,733.54 and the S&amp;P 500 down 0.50 percent to 7,201.09. The Dow Jones Industrial Average rose 0.85 percent the same day.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="us-tuesday-falls-25nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="830" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">MARKETS · NEW YORK</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Tuesday's falls: ADI 17.4%, HPE 16.3%, Nvidia 5.9%</text><text x="32" y="94" font-family="'Famil