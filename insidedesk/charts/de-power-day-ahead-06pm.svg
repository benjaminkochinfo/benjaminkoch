ans-serif" font-size="12.5" fill="#F2A93B">Day-ahead DE-LU</text><line x1="32" x2="928" y1="496" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="32" y="518" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>Bundesnetzagentur | SMARD.de via VoltWatch day-ahead DE-LU averages, delivery days 1 Sep to 7 Nov 2026; Saturday 7 Nov base €259.83 (VoltWatch, stand 6 Nov 2026 ~13:00 CET); Friday 6 Nov €275.64 from prior SMARD series · CC BY 4.0 / reported open auction</text><rect x="820" y="509" width="8" height="8" fill="#F2A93B"/><text x="928" y="518" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>