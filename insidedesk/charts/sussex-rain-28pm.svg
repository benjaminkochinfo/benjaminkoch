<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="sussex-rain-28pm-t sussex-rain-28pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="sussex-rain-28pm-t">The rain came. The reservoir barely noticed</title><desc id="sussex-rain-28pm-d">Line chart of modelled rainfall at a grid point near Haywards Heath in West Sussex, running total from 1 October. In 2026 almost nothing falls in the first six days, the total reaches only 21.7 mm by 19 October, then storms from 20 to 24 October lift it to 96.6 mm, and it reaches 107.0 mm on Tuesday 27 October 2026, the latest value. The 1991–2020 average for the same days rises steadily to 62.4 mm by 27 October; the 2026 line overtakes it on 23 October. Latest values: October 2026 107 mm (2026-10-27); 1991–2020 average 62.4 mm (2026-10-27).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="sussex-rain-28pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · SUSSEX</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The rain came. The reservoir barely noticed</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helveti