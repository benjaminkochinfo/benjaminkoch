<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 802" width="960" height="802" role="img" aria-labelledby="de-ppi-oct-20nov-t de-ppi-oct-20nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-ppi-oct-20nov-t">Heating oil +97.2%, all producer prices +8.1% in a year</title><desc id="de-ppi-oct-20nov-d">Bar chart of the change in German producer prices of industrial products between October 2025 and October 2026, per Destatis: light heating oil up 97.2 percent, mineral oil products up 51.9 percent, energy up 18.7 percent, electricity up 12.6 percent, all industrial products up 8.1 percent, intermediate goods up 6.8 percent, all products excluding energy up 3.6 percent and capital goods up 2.4 percent. Non-durable consumer goods, not shown, were 1.3 percent cheaper.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-ppi-oct-20nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="802" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · PRICES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Heating oil +97.2%, all producer prices +8.1% in a year</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">German producer prices of industrial products (domestic sales), October 2026, change on October 2025, %</text><line x1="32.0" x2="32.0" y1="134" y2="718" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="736" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="134" y2="718" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="736" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">50</text><line x1="570.7" x2="570.7" y1="134" y2="718" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="736" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">100</text><line x1="840.0" x2="840.0" y1="134" y2="718" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="736" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">150</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Light heating oil rise</text><rect x="32" y="162" width="523.6" height="26" rx="2" fill="#F2A93B"/><text x="565.6" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">97.2%</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Mineral oil products rise</text><rect x="32" y="236" width="279.6" height="26" rx="2" fill="#4CC9B0"/><text x="321.6" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">51.9%</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Energy rise</text><rect x=