<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="de-power-day-ahead-25nov-pm-t de-power-day-ahead-25nov-pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-25nov-pm-t">Thursday €291.77 a MWh, up from Wednesday's €246.29</title><desc id="de-power-day-ahead-25nov-pm-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 26 November 2026, in euros per megawatt hour. Prices mostly ran between about €100 and €210 in September and October, climbed above €250 from late October, peaked at €351.48 on Tuesday 10 November, fell to €139.70 on Sunday 15 November, were €240.42 on Monday 23 and €254.15 on Tuesday 24 November, were €246.29 on Wednesday 25 November, and stand at €291.77 for the latest delivery day, Thursday 26 November, the highest daily average since 11 November. Latest values: Day-ahead DE-LU 291.77 (2026-11-26).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-25nov-pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Thursda