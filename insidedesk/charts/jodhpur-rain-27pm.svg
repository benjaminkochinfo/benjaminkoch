<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="jodhpur-rain-27pm-t jodhpur-rain-27pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="jodhpur-rain-27pm-t">Wet until mid-August, then almost nothing</title><desc id="jodhpur-rain-27pm-d">Line chart of modelled rainfall at a Jodhpur grid point, running total from 1 June. In 2026 the total runs slightly below the 1991–2020 average through July, pulls ahead in early August to 231.6 mm by 15 August, then adds only 25.5 mm more, ending at 257.1 mm on Monday 26 October 2026, the latest value. The 1991–2020 average for the same days keeps climbing to 277.5 mm by 26 October. Latest values: 2026 257.1 mm (2026-10-26); 1991–2020 average 277.5 mm (2026-10-26).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="jodhpur-rain-27pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · RAJASTHAN</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Wet until mid-August, then almost nothing</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Rain since 1 J