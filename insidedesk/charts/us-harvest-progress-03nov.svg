<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="960" height="608" role="img" aria-labelledby="us-harvest-progress-03nov-t us-harvest-progress-03nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="us-harvest-progress-03nov-t">Soybeans and cotton ahead, sorghum and corn behind</title><desc id="us-harvest-progress-03nov-d">Bar chart of the share of each US crop harvested by 1 November 2026, the latest week, from USDA's Crop Progress report. Soybeans 88% against a 2021–2025 average of 84%. Corn 74% against 77%. Peanuts 66% against 72%. Sorghum 64% against 78%. Cotton 63% against 54%.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="us-harvest-progress-03nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="608" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · US HARVEST</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Soybeans and cotton ahead, sorghum and corn behind</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Share of US crop harvested by 1 November 2026, % of planted area in the main producing states (USDA crop progress); the label gives the</text><text x="32" y="114