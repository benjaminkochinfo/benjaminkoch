<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="ust-week-curve-01nov-t ust-week-curve-01nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ust-week-curve-01nov-t">The middle of the curve did the most work</title><desc id="ust-week-curve-01nov-d">Bar chart of how far US Treasury par yields fell over the week from Friday 23 October to Friday 30 October 2026, in basis points. The 3-month yield fell 6, from 4.22% to 4.16%. The 2-year fell 13, from 4.69% to 4.56%, the largest move. The 5-year fell 11, from 4.82% to 4.71%. The 10-year fell 6, from 5.00% to 4.94%. The 30-year fell 2, from 5.33% to 5.31%. All yields were lower on the week; the latest values are the 30 October closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ust-week-curve-01nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="580" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · THE SUNDAY SEQUENCE</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The middle of the curve did the most work</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Fall in US Treasury par yields over the week, Fri 23 Oct to Fri 30 Oct 2026, basis points (one basis point = 0.01 percentage point)</text><line x1="32.0" x2="32.0" y1="134" y2="496" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">5</text><line x1="570.7" x2="570.7" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">10</text><line x1="840.0" x2="840.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">15</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">3-month: 4.22% to 4.16%</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="162" width="323.2" height="26" rx="2" fill="#F2A93B"/><text x="365.2" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">6.0 bp</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">2-year: 4.69% to 4.56%</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="236" width="700.3" height="26" rx="2" fill="#4CC9B0"/><text x="742.3" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">13.0 bp</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">5-year: 4.82% to 4.71%</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="310" width="592.5" height="26" rx="2" fill="#FF7A5C"/><text x="634.5" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">11.0 bp</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">10-year: 5.00% to 4.94%</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="384" width="323.2" height="26" rx="2" fill="#A99BFF"/><text x="365.2" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">6.0 bp</text><text x="32" y="448" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">30-year: 5.33% to 5.31%</text><text x="928" y="448" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="458" width="107.7" height="26" rx="2" fill="#C9D1D9"/><text x="149.7" y="477" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">2.0 bp</text><line x1="32" x2="928" y1="536" y2="536" stroke="rgba(236,231,220,0.11)"/><text x="32" y="558" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" 