<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ea-hicp-dfr-21oct-t ea-hicp-dfr-21oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ea-hicp-dfr-21oct-t">The print the committee is looking at</title><desc id="ea-hicp-dfr-21oct-d">Line chart since January 2024 of euro-area HICP inflation, core inflation and the ECB deposit rate. Headline inflation is between 1.7% and 2.8% through 2024 and 2025, is 1.9% in February 2026, then rises after the energy shock to 3.8% in September 2026; core inflation stays between 2.2% and 2.6% through 2026 and is 2.5% in September. The deposit rate steps down from 4% to 2% by mid-2025 and back up to 2.5% by September 2026. Latest values: HICP inflation 3.8% (2026-09); Core inflation 2.5% (2026-09); ECB deposit rate 2.5% (2026-10).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ea-hicp-dfr-21oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · EURO AREA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The print the committee is looking at</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" 