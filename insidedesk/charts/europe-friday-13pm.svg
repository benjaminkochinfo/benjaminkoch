<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 978" width="960" height="978" role="img" aria-labelledby="europe-friday-13pm-t europe-friday-13pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="europe-friday-13pm-t">DAX +0.07%, Wise +9.8%, Acciona −7%: flat on top</title><desc id="europe-friday-13pm-d">Bar chart of Friday 13 November 2026 percentage changes in Europe at about 15:27 CET, per XTB: Wise up as much as 9.8 percent, Eni up 1.5, TotalEnergies up 1.4, FTSE 100 up 0.21, DAX up 0.07, Euro Stoxx 50 up 0.07, CAC 40 up 0.03, Siemens down 1.4, Prosus down 1.75 and Acciona down about 7 percent. These are intraday snapshot figures, not closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="europe-friday-13pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="978" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · EUROPE</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">DAX +0.07%, Wise +9.8%, Acciona −7%: flat on top</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Percentage change on selected European indexes and shares, Friday 13 November 2026, intraday snapshot at about 15:27 CET per XTB;</tex