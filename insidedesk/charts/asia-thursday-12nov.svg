<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="asia-thursday-12nov-t asia-thursday-12nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="asia-thursday-12nov-t">Thursday morning in Asia: Seoul and Tokyo up, Hong Kong down, while Nvidia fell overnight</title><desc id="asia-thursday-12nov-d">Bar chart of Thursday 12 November 2026 percentage changes in Asia at the Tokyo midday break, about 03:30 CET, per AFP: Kospi up 1.2 percent to 5,463.98, Nikkei 225 up 0.8 percent to 61,714.16, Shanghai Composite up 0.4 percent to 3,694.28 and Hang Seng down 1.1 percent to 24,043.69. These are intraday snapshot levels, not closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="asia-thursday-12nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="570" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · ASIA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Thursday morning in Asia: Seoul and Tokyo up, Hong Kong down,</text><text x="32" y="102" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">while Nvidia fell overnight</text><text x="32" y="130" font-family="'Familjen Grotesk