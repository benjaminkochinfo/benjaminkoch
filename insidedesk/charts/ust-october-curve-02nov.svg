<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="ust-october-curve-02nov-t ust-october-curve-02nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ust-october-curve-02nov-t">October's rally reached every maturity except the bills</title><desc id="ust-october-curve-02nov-d">Bar chart of how far US Treasury par yields fell over October 2026, from Wednesday 30 September to Friday 30 October, in basis points. The 3-month yield fell 4, from 4.20% to 4.16%. The 2-year fell 32, from 4.88% to 4.56%. The 5-year fell 38, from 5.09% to 4.71%, the largest move. The 10-year fell 35, from 5.29% to 4.94%. The 30-year fell 33, from 5.64% to 5.31%. The latest values are the 30 October closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ust-october-curve-02nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="580" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · BONDS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">October's rally reached every maturity except the bills</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Fall in US Treasury par yields ove