<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 682" width="960" height="682" role="img" aria-labelledby="asia-thursday-26nov-t asia-thursday-26nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="asia-thursday-26nov-t">Asia's Thursday: Taiex +3.05%, Hang Seng +1.88%</title><desc id="asia-thursday-26nov-d">Bar chart of Asian index rises during Thursday 26 November 2026 trading, every one higher: the Taiex up 3.05 percent at 02:43 CET, the Hang Seng up 1.88 percent at 22,378.44 at the 05:00 CET midday break, the Nikkei 225 up 1.49 percent at 57,863.12 at the 03:30 CET midday break, the S&amp;P/ASX 200 up 0.90 percent at 8,770 at 04:14 CET, the Kospi up 0.80 percent at 4,736 at about 04:00 CET and the Shanghai Composite up 0.22 percent at 3,484.17 at the 04:30 CET midday break. These are intraday figures, not closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="asia-thursday-26nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="682" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · ASIA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Asia's Thursday: Taiex +3.05%, Hang Seng +1.88%</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-