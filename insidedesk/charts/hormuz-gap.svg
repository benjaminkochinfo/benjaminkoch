<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="hormuz-gap-t hormuz-gap-d" class="desk-plate" style="max-width:100%;height:auto"><title id="hormuz-gap-t">A bridge, not a pipeline</title><desc id="hormuz-gap-d">Bar chart in million barrels per day: pre-war Hormuz flows about 17.0, flows on 13 October 12.6, a shortfall of 4.4, and the remaining IEA emergency release of about 100 million barrels equal to roughly 0.8 per day if spread over four months — under a fifth of the gap.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="hormuz-gap-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="506" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">PODIUM VS PRINT</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">A bridge, not a pipeline</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Million barrels per day · hatched bars are Inside Desk arithmetic</text><line x1="32.0" x2="32.0" y1="134" y2="422" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="234.0" x2="234.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="234.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">5</text><line x1="436.0" x2="436.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="436.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">10</text><line x1="638.0" x2="638.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="638.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">15</text><line x1="840.0" x2="840.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">20</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Hormuz flows, pre-war baseline (Kpler)</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">BBC Verify, 16 Oct</text><rect x="32" y="162" width="686.8" height="26" rx="2" fill="#F2A93B"/><text x="728.8" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">17.0 mb/d</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Hormuz flows on 13 October (Kpler)</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">BBC Verify, 16 Oct</text><rect x="32" y="236" width="509.0" height="26" rx="2" fill="#4CC9B0"/><text x="551.0" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">12.6 mb/d</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Shortfall versus pre-war</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">17.0 − 12.6</text><rect x="32" y="310" width="177.8" height="26" rx="2" fill="url(#hormuz-gap-hatch)" stroke="#F2A93B" stroke-width="1.2"/><text x="219.8" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">4.4 mb/d</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Remaining IEA release (~100m bbl) spread over four months</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">100m ÷ 122 days</text><rect x="32" y="384" width="33.1" height="26" rx="2" fill="url(#hormuz-gap-hatch)" stroke="#F2A93B" stroke-width="1.2"/><text x="75.1" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">0.8 mb/d</text><line x1="32" x2="928" y1="462" y2="462" stroke="rgba(236,231,220,0.11)"/><text x="32" y="484" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>Kpler data as cited by BBC Verify (16 Oct 2026); IEA Governing Board (15 Oct); G7 deadline per S&amp;P Global</text><rect x="820" y="475" width="8" height="8" fill="#F2A93B"/><text x="928" y="484" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>