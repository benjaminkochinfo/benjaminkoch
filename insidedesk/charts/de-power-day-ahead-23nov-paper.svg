<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="de-power-day-ahead-23nov-t de-power-day-ahead-23nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-23nov-t">Monday €240.42 a MWh, up 17.8% on Sunday's €204.08</title><desc id="de-power-day-ahead-23nov-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 23 November 2026, in euros per megawatt hour. Prices mostly ran between about €100 and €210 in September and October, climbed above €250 from late October, peaked at €351.48 on Tuesday 10 November, fell to €139.70 on Sunday 15 November, moved between €146.25 and €224.83 in the week of 16 November, were €187.88 on Saturday 21 and €204.08 on Sunday 22 November, and stand at €240.42 for the latest delivery day, Monday 23 November. Latest values: Day-ahead DE-LU 240.42 (2026-11-23).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-23nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Monday €240.42 a MWh, up 17.8% on Sunday's €20