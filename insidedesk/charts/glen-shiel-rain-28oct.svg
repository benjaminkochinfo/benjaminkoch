<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="glen-shiel-rain-28oct-t glen-shiel-rain-28oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="glen-shiel-rain-28oct-t">Two Octobers' rain in one</title><desc id="glen-shiel-rain-28oct-d">Line chart of modelled rainfall at a grid point near Cluanie Inn in the Scottish Highlands, running total from 1 October. In 2026 the total passes 100 mm by 10 October, jumps to 180.0 mm by 15 October after a wet 13th and 14th, stays flat through a dry spell to 19 October, then climbs again with Storms Austen and Boelo to 269.0 mm on Monday 26 October 2026, the latest value. The 1991–2020 average for the same days rises steadily to 133.5 mm by 26 October. Latest values: October 2026 269 mm (2026-10-26); 1991–2020 average 133.5 mm (2026-10-26).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="glen-shiel-rain-28oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · SCOTTISH HIGHLANDS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Two Octobers' rain in one</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helv