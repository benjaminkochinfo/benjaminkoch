<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="us-payrolls-06pm-t us-payrolls-06pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="us-payrolls-06pm-t">October payrolls: 165,000 against a 59,000 forecast</title><desc id="us-payrolls-06pm-d">Bar chart of US nonfarm payroll changes in thousands: October 2026 actual 165,000 against a Dow Jones consensus of 59,000; September revised to 60,000 and August revised to 186,000, per the Bureau of Labor Statistics as reported by CNBC on 6 November 2026.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="us-payrolls-06pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="506" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · MACRO</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">October payrolls: 165,000 against a 59,000 forecast</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">US nonfarm payroll change, thousands of jobs, Bureau of Labor Statistics October 2026 report (released 6 Nov 2026); Dow Jones consensus for October</text><line x1="32.0" x2="32.0" y1="134" y2="422" stroke="rgba(236,231,220,0.28)"/>