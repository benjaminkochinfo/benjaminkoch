<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ust-long-end-03nov-t ust-long-end-03nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ust-long-end-03nov-t">The 30-year is back where September began</title><desc id="ust-long-end-03nov-d">Line chart of the daily US 10-year and 30-year Treasury par yields from 1 September to 2 November 2026. On 1 September the 10-year is at 4.79% and the 30-year at 5.27%. Both climb through September; the 10-year peaks at 5.31% on 5 October and the 30-year at 5.67% on 7 October. Both then fall through October. On Monday 2 November 2026, the latest value, the 10-year is at 4.91% and the 30-year at 5.28%, one hundredth of a point above where it began September. Latest values: 10-year yield 4.91% (2026-11-02); 30-year yield 5.28% (2026-11-02).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ust-long-end-03nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · RATES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The 30-year is back where September began</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Aria