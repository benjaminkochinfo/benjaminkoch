<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 950" width="960" height="950" role="img" aria-labelledby="de-october-rain-by-land-01nov-t de-october-rain-by-land-01nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-october-rain-by-land-01nov-t">A wet October in the north, a dry one by the Oder</title><desc id="de-october-rain-by-land-01nov-d">Bar chart of October 2026 precipitation in selected German federal states, in litres per square metre, preliminary DWD values. Schleswig-Holstein had 129 against a 1961–1990 mean of 73, North Rhine-Westphalia 108 against 62, Hamburg 107 against 60, Saarland 100 against 77, Lower Saxony 94 against 56. Germany as a whole had about 76 against 56. Bavaria had 64 against 61, Saxony 43 against 47, Brandenburg 35 against 37, and Berlin, the last bar, 31 against a mean of 35.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-october-rain-by-land-01nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="950" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · GERMANY</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">A wet October in the north, a dry one by the Oder</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Precipitation in October 2026 by federal state, litres per square metre (preliminary), with the 1961–1990 October mean in the note · DWD</text><line x1="32.0" x2="32.0" y1="134" y2="866" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="884" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="134" y2="866" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="884" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">50</text><line x1="570.7" x2="570.7" y1="134" y2="866" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="884" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">100</text><line x1="840.0" x2="840.0" y1="134" y2="866" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="884" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">150</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Schleswig-Holstein</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 73</text><rect x="32" y="162" width="694.9" height="26" rx="2" fill="#F2A93B"/><text x="736.9" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">129.0 l/m²</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">North Rhine-Westphalia</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 62</text><rect x="32" y="236" width="581.8" height="26" rx="2" fill="#4CC9B0"/><text x="623.8" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">108.0 l/m²</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Hamburg</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 60</text><rect x="32" y="310" width="576.4" height="26" rx="2" fill="#FF7A5C"/><text x="618.4" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">107.0 l/m²</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Saarland</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 77</text><rect x="32" y="384" width="538.7" height="26" rx="2" fill="#A99BFF"/><text x="580.7" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">100.0 l/m²</text><text x="32" y="448" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Lower Saxony</text><text x="928" y="448" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 56</text><rect x="32" y="458" width="506.3" height="26" rx="2" fill="#C9D1D9"/><text x="548.3" y="477" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">94.0 l/m²</text><text x="32" y="522" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Germany</text><text x="928" y="522" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 56</text><rect x="32" y="532" width="409.4" height="26" rx="2" fill="#7FB2FF"/><text x="451.4" y="551" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#7FB2FF">76.0 l/m²</text><text x="32" y="596" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Bavaria</text><text x="928" y="596" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 61</text><rect x="32" y="606" width="344.7" height="26" rx="2" fill="#F2A93B"/><text x="386.7" y="625" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">64.0 l/m²</text><text x="32" y="670" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Saxony</text><text x="928" y="670" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 47</text><rect x="32" y="680" width="231.6" height="26" rx="2" fill="#4CC9B0"/><text x="273.6" y="699" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">43.0 l/m²</text><text x="32" y="744" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Brandenburg</text><text x="928" y="744" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">mean 37</text><rect x="32" y="754" width="188.5" height="26" rx="2" fill="#FF7A5C"/><text x="230.5" y="773" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weig