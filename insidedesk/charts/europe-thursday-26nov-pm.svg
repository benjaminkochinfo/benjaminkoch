<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" role="img" aria-labelledby="europe-thursday-26nov-pm-t europe-thursday-26nov-pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="europe-thursday-26nov-pm-t">Thursday: Milan up 2.36%, DAX 2.08%, Zurich 1.04%</title><desc id="europe-thursday-26nov-pm-d">Bar chart of the rises on the main European stock indexes after the cash close on Thursday 26 November 2026, a day when US markets were closed for Thanksgiving: FTSE MIB (Milan) up 2.36 percent to 48,362.35, IBEX 35 (Madrid) up 2.26 percent to 19,057.90, Euro Stoxx 50 up 2.11 percent to 6,018.65, DAX (Frankfurt) up 2.08 percent to 25,215.52 at the official close, AEX (Amsterdam) up 1.86 percent to 1,083.26, FTSE 100 (London) up 1.75 percent to 10,609.30, CAC 40 (Paris) up 1.61 percent to 8,108.74, SMI (Zurich) up 1.04 percent to 14,817.68. DAX figure as reported by dpa-AFX; the others as shown by Boursorama at 17:54 CET.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="europe-thursday-26nov-pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="830" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · EUROPE</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC