<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 802" width="960" height="802" role="img" aria-labelledby="de-power-new-customer-23oct-t de-power-new-customer-23oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-new-customer-23oct-t">The cheapest tariff climbed back to 30.64 cents</title><desc id="de-power-new-customer-23oct-d">Bar chart: the average cheapest new-customer electricity tariff in Germany was 23.84 cents per kWh in January and 23.90 in February, 27.24 in April, 23.47 in June, 27.03 in August, 27.78 in September and 30.64 cents on 22 October 2026, the latest value. Basic supply averaged 40.39 cents on 22 October.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-new-customer-23oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="802" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">INSIDE DESK · ORDINARY LEDGER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The cheapest tariff climbed back to 30.64 cents</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Germany, average of the cheapest new-customer electricity tariffs, cents per kWh, 2026, and basic supply for comparison</tex