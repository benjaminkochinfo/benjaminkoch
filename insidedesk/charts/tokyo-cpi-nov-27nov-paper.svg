<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 756" width="960" height="756" role="img" aria-labelledby="tokyo-cpi-nov-27nov-t tokyo-cpi-nov-27nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="tokyo-cpi-nov-27nov-t">Tokyo November: gas +13.7%, power +9.5%, core 2.9%</title><desc id="tokyo-cpi-nov-27nov-d">Bar chart of year-on-year price rises in Tokyo's 23 wards in November 2026: city gas up 13.7 percent, electricity up 9.5 percent, hotel charges up 3.6 percent, food excluding fresh food up 3.1 percent, core prices excluding fresh food up 2.9 percent, prices excluding fresh food and energy up 2.5 percent and private rents up 1.9 percent. Rice prices fell 33.8 percent, the largest fall since January 1971, and are not shown.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="tokyo-cpi-nov-27nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="756" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">MONEY · JAPAN</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Tokyo November: gas +13.7%, power +9.5%, core 2.9%</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">Tokyo 23 wards consumer prices, November 2026 mid-month preliminary, % change on a year earlier. Rice, down 33.8%, is not shown</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">(bars show rises only)</text><line x1="32.0" x2="32.0" y1="162" y2="672" stroke="rgba(28,26,22,0.30)"/><text x="32.0" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">0</text><line x1="301.3" x2="301.3" y1="162" y2="672" stroke="rgba(28,26,22,0.12)"/><text x="301.3" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">5</text><line x1="570.7" x2="570.7" y1="162" y2="672" stroke="rgba(28,26,22,0.12)"/><text x="570.7" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">10</text><line x1="840.0" x2="840.0" y1="162" y2="672" stroke="rgba(28,26,22,0.12)"/><text x="840.0" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">15</text><text x="32" y="180" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">City gas</text><rect x="32" y="190" width="738.0" height="26" rx="2" fill="#A45A00"/><text x="780.0" y="209" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A45A00">13.7%</text><text x="32" y="254" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Electricity</text><rect x="32" y="264" width="511.7" height="26" rx="2" fill="#0A7564"/><text x="553.7" y="283" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#0A7564">9.5%</text><text x="32" y="328" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Hotel charges</text><rect x="32" y="338" width="193.9" height="26" rx="2" fill="#C2401B"/><text x="235.9" y="357" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C2401B">3.6%</text><text x="32" y="402" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Food excl. fresh food</text><rect x="32" y="412" width="167.0" height="26" rx="2" fill="#6A4FC9"/><text x="209.0" y="431" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#6A4FC9">3.1%</text><text x="32" y="476" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Core (excl. fresh food)</text><rect x="32" y="486" width="156.2" height="26" rx="2" fill="#3F4752"/><text x="198.2" y="505" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#3F4752">2.9%</text><text x="32" y="550" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Excl. fresh food and energy</text><rect x="32" y="560" width="134.7" height="26" rx="2" fill="#1F5FAF"/><text x="176.7" y="579" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#1F5FAF">2.5%</text><text x="32" y="624" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Private rents</text><rect x="32" y="634" width="102.3" height="26" rx="2" fill="#A45A00"/><text x="144.3" y="653" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A45A00">1.9%</text><line x1="32" x2="928" y1="712" y2="712" stroke="rgba(28,26,22,0.12)"/><text x="32" y="734" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#4A4F57"><tspan fill="#62676F">SOURCE </tspan>Ministry of Internal Affairs and Communications, Tokyo-area CPI for November 2026, as reported by Nikkei, 27…</text><rect x="820" y="725" width="8" height="8" fill="#A45A00"/><text x="928" y="734" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#1A1A1D">INSIDE DESK</text></svg>