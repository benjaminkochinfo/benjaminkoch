<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 682" width="960" height="682" role="img" aria-labelledby="hicp-flash-27pm-t hicp-flash-27pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="hicp-flash-27pm-t">France 3.7%→3.2%, Spain 4.9%→4.1%: November cools</title><desc id="hicp-flash-27pm-d">Bar chart of annual inflation in October and the November 2026 flash estimate. Spain's harmonised inflation falls from 4.9 percent in October to 4.1 percent in November; France's from 3.7 percent to 3.2 percent; Spain's core inflation, excluding unprocessed food and energy, from 3.1 percent to 2.6 percent. Analysts had expected 3.6 percent for France and 4.7 percent for Spain.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="hicp-flash-27pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="682" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · INFLATION</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">France 3.7%→3.2%, Spain 4.9%→4.1%: November cools</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Annual inflation, %, harmonised index (HICP) unless stated: October 2026 final figure and November 2026 flash estimate, France (INSEE)</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">and Spain (INE)</text><line x1="32.0" x2="32.0" y1="162" y2="598" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="616" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="162" y2="598" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="616" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">2</text><line x1="570.7" x2="570.7" y1="162" y2="598" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="616" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">4</text><line x1="840.0" x2="840.0" y1="162" y2="598" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="616" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">6</text><text x="32" y="180" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Spain HICP, October</text><rect x="32" y="190" width="659.9" height="26" rx="2" fill="#F2A93B"/><text x="701.9" y="209" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">4.9%</text><text x="32" y="254" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Spain HICP, November flash</text><rect x="32" y="264" width="552.1" height="26" rx="2" fill="#4CC9B0"/><text x="594.1" y="283" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">4.1%</text><text x="32" y="328" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">France HICP, October</text><rect x="32" y="338" width="498.3" height="26" rx="2" fill="#FF7A5C"/><text x="540.3" y="357" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">3.7%</text><text x="32" y="402" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">France HICP, November flash</text><rect x="32" y="412" width="430.9" height="26" rx="2" fill="#A99BFF"/><text x="472.9" y="431" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">3.2%</text><text x="32" y="476" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Spain core CPI, October</text><rect x="32" y="486" width="417.5" height="26" rx="2" fill="#C9D1D9"/><text x="459.5" y="505" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">3.1%</text><text x="32" y="550" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Spain core CPI, November flash</text><rect x="32" y="560" width="350.1" height="26" rx="2" fill="#7FB2FF"/><text x="392.1" y="579" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#7FB2FF">2.6%</text><line x1="32" x2="928" y1="638" y2="638" stroke="rgba(236,231,220,0.11)"/><text x="32" y="660" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>INE flash estimate CPI/HICP November 2026 (27 Nov 2026); INSEE preliminary November 2026 as reported by…</text><rect x="820" y="651" width="8" height="8" fill="#F2A93B"/><text x="928" y="660" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" fo