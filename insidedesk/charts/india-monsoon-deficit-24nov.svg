t-size="14" fill="#ECE7DC">Rajasthan</text><rect x="32" y="264" width="444.4" height="26" rx="2" fill="#4CC9B0"/><text x="486.4" y="283" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">22.0%</text><text x="32" y="328" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Maharashtra</text><rect x="32" y="338" width="383.8" height="26" rx="2" fill="#FF7A5C"/><text x="425.8" y="357" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">19.0%</text><text x="32" y="402" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Telangana</text><rect x="32" y="412" width="343.4" height="26" rx="2" fill="#A99BFF"/><text x="385.4" y="431" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">17.0%</text><text x="32" y="476" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">India (national)</text><rect x="32" y="486" width="262.6" height="26" rx="2" fill="#C9D1D9"/><text x="304.6" y="505" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">13.0%</text><line x1="32" x2="928" y1="564" y2="564" stroke="rgba(236,231,220,0.11)"/><text x="32" y="586" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>India Meteorological Department figures as reported by Down To Earth, 23 Nov 2026; retrieved 24 Nov 2026…</text><rect x="820" y="577" width="8" height="8" fill="#F2A93B"/><text x="928" y="586" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill=