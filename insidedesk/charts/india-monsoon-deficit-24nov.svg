<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="960" height="608" role="img" aria-labelledby="india-monsoon-deficit-24nov-t india-monsoon-deficit-24nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="india-monsoon-deficit-24nov-t">Monsoon 2026: Karnataka 35% short, India 13% short</title><desc id="india-monsoon-deficit-24nov-d">Bar chart of rainfall shortfalls against normal in the 2026 southwest monsoon: Karnataka 35 percent short, its worst in 55 years; Rajasthan 22 percent; Maharashtra 19 percent; Telangana 17 percent; India as a whole 13 percent, 759.4 millimetres against a long-period average of 868.6 millimetres. All bars are shortfalls.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="india-monsoon-deficit-24nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="608" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE · INDIA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Monsoon 2026: Karnataka 35% short, India 13% short</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Rainfall shortfall against normal, 2026 southwest monsoon (June to September), in %; India: 759.4 mm against a lo