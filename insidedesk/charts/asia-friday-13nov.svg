<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="asia-friday-13nov-t asia-friday-13nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="asia-friday-13nov-t">Friday morning in Asia: Tokyo and Seoul up, Hong Kong down, the morning after Nvidia's chief executive resigned</title><desc id="asia-friday-13nov-d">Bar chart of Friday 13 November 2026 percentage changes in Asia at the Tokyo midday break, about 03:30 CET, per AFP: Nikkei 225 up 1.6 percent to 61,816.72, Kospi up 1.3 percent to 5,410.58, Shanghai Composite up 0.2 percent to 3,662.84 and Hang Seng down 0.6 percent to 23,874.05. These are intraday snapshot levels, not closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="asia-friday-13nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="506" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · ASIA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Friday morning in Asia: Tokyo and Seoul up, Hong Kong down, the morning after Nvidia's chief executive resigned</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Percentage change on selected Asia