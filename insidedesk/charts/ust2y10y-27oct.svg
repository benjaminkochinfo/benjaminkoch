<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ust2y10y-27oct-t ust2y10y-27oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ust2y10y-27oct-t">The two-year has done the climbing</title><desc id="ust2y10y-27oct-d">Line chart of the daily US 2-year and 10-year Treasury par yields since January 2026. On 2 January the 2-year is at 3.47% and the 10-year at 4.19%. Both are at their lows on 27 February, 3.38% and 3.97%. The 2-year peaks at 4.92% on 28 September and the 10-year at 5.31% on 5 October. On Monday 26 October 2026, the latest value, the 2-year is at 4.68% and the 10-year at 5.00%, a gap of 0.32 percentage points, down from 0.72 at the start of the year. Latest values: 2-year yield 4.68% (2026-10-26); 10-year yield 5% (2026-10-26).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ust2y10y-27oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · RATES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The two-year has done the climbing</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">US