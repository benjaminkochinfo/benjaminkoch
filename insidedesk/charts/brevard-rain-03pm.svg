<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 904" width="960" height="904" role="img" aria-labelledby="brevard-rain-03pm-t brevard-rain-03pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="brevard-rain-03pm-t">Two feet of rain on the Space Coast, a third of that inland</title><desc id="brevard-rain-03pm-d">Bar chart of preliminary rain totals from the Central Florida storm of 1 to 3 November 2026, in millimetres. Grant-Valkaria in Brevard County had 601.7 mm (23.69 inches), Malabar 595.4 mm, Palm Bay 501.7 mm, Melbourne Beach 352.6 mm, Melbourne 333.0 mm, Titusville 294.9 mm and Kennedy Space Center 247.4 mm. Inland, Lake Harney in Seminole County had 214.4 mm and Eatonville in Orange County 188.7 mm, the last figure shown.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="brevard-rain-03pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="904" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · FLORIDA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Two feet of rain on the Space Coast, a third of that inland</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Rain totals of the Centra