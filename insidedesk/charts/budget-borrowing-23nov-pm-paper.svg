<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" width="960" height="534" role="img" aria-labelledby="budget-borrowing-23nov-pm-t budget-borrowing-23nov-pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="budget-borrowing-23nov-pm-t">€210.46bn new federal debt for 2027, and a €1.8bn quarrel</title><desc id="budget-borrowing-23nov-pm-d">Bar chart of planned new federal borrowing in Germany for 2027 as passed by the Bundestag budget committee: 122.97 billion euros in the core budget, 57.84 billion in the special fund for infrastructure and climate neutrality and 29.65 billion in the Bundeswehr special fund, together 210.46 billion euros. A fourth, much smaller bar shows about 1.8 billion euros, the federal government's reported share of the cost of a full adjustment for cold progression in 2027, which is not in the budget.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="budget-borrowing-23nov-pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="534" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">POLITICS · BUDGET 2027</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">€210.46bn new federal debt for 2027, and a €1.8bn quarrel</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">2027 federal budget as passed by the budget committee, new borrowing by pot, € billion; last bar: federal share of a full cold-progression</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">adjustment, not in the budget</text><line x1="32.0" x2="32.0" y1="162" y2="450" stroke="rgba(28,26,22,0.30)"/><text x="32.0" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">0</text><line x1="301.3" x2="301.3" y1="162" y2="450" stroke="rgba(28,26,22,0.12)"/><text x="301.3" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">50</text><line x1="570.7" x2="570.7" y1="162" y2="450" stroke="rgba(28,26,22,0.12)"/><text x="570.7" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">100</text><line x1="840.0" x2="840.0" y1="162" y2="450" stroke="rgba(28,26,22,0.12)"/><text x="840.0" y="468" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">150</text><text x="32" y="180" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Core budget net borrowing</text><rect x="32" y="190" width="662.4" height="26" rx="2" fill="#A45A00"/><text x="704.4" y="209" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A45A00">123.0bn</text><text x="32" y="254" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Infrastructure and climate fund</text><rect x="32" y="264" width="311.6" height="26" rx="2" fill="#0A7564"/><text x="353.6" y="283" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#0A7564">57.8bn</text><text x="32" y="328" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Bundeswehr special fund</text><rect x="32" y="338" width="159.7" height="26" rx="2" fill="#C2401B"/><text x="201.7" y="357" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C2401B">29.6bn</text><text x="32" y="402" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Cold-progression adjustment, federal share</text><rect x="32" y="412" width="9.7" height="26" rx="2" fill="#6A4FC9"/><text x="51.7" y="431" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#6A4FC9">1.8bn</text><line x1="32" x2="928" y1="490" y2="490" stroke="rgba(28,26,22,0.12)"/><text x="32" y="512" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#4A4F57"><tspan fill="#62676F">SOURCE </tspan>Deutscher Bundestag, hib 939/2026 and 948/2026, via AktienCheck (23 Nov 2026); Reuters via onvista (23 Nov…</text><rect x="820" y="503" width="8" height="8" fill="#A45A00"/><text x="928" y="512" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#1A1A1D">INSIDE DESK</text></svg>