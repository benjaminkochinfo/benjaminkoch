<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1126" width="960" height="1126" role="img" aria-labelledby="europe-thursday-19pm-t europe-thursday-19pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="europe-thursday-19pm-t">DAX −0.55% at 16:34: SAP −4.00%, Evonik −16.44%</title><desc id="europe-thursday-19pm-d">Bar chart of Thursday 19 November 2026 percentage changes in a late-afternoon snapshot, per finanzen.at realtime quotes (indices at 16:34 to 16:35 CET, shares at 16:31 to 16:35 CET): Sartorius preference shares up 3.19 percent, Aixtron up 3.01, Deutsche Bank up 1.27, Siemens Energy up 1.23, Infineon up 0.86, the Euro Stoxx 50 down 0.24 at 6,139.55 points, the TecDAX down 0.30 at 3,940.91 points, the DAX down 0.55 at 25,594.83 points, the MDax down 0.80 at 29,640.91 points, Henkel preference shares down 2.05, SAP down 4.00 and Evonik down 16.44 percent after BASF dropped its takeover effort. These are intraday snapshot figures, not closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="europe-thursday-19pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="1126" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">MARKETS · GERMANY</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D