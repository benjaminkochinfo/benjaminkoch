<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="delhi-pm25-02nov-t delhi-pm25-02nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="delhi-pm25-02nov-t">The rain washed it out, the smoke came back in two days</title><desc id="delhi-pm25-02nov-d">Line chart of modelled daily mean PM2.5 at a central Delhi grid point. It sits around 80 µg/m³ from 26 to 28 October, falls to 47.4 on 29 October and 28.8 on 30 October after rain, then climbs to 59.1 on 31 October and 81.0 µg/m³ on Sunday 1 November 2026, the latest value. Latest values: PM2.5, daily mean 81 µg/m³ (2026-11-01).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="delhi-pm25-02nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · DELHI</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The rain washed it out, the smoke came back in two days</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Fine particles (PM2.5), daily mean, µg/m³ · central Delhi grid point (modelled), 26 Oct – 1 Nov 2026, India time</text><line x1="32" x2