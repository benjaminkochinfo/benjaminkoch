ov ’26</text><path d="M32.0,199.9L158.7,178.8L285.3,187.6L412.0,298.2L538.7,357.0L665.3,261.2L792.0,192.0" fill="none" stroke="#F2A93B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="792.0" cy="192.0" r="3.6" fill="#F2A93B" stroke="#0D1015" stroke-width="1.5"/><path d="M797.0,192.0 L803,192.0" stroke="#F2A93B" stroke-opacity=".5" fill="none"/><rect x="806" y="181.0" width="83.0" height="20" rx="3" fill="#F2A93B"/><text x="811" y="196.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="12.5" fill="#0D1015">81.0 µg/m³</text><text x="806" y="216.0" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#F2A93B">PM2.5, daily mean</text><line x1="32" x2="928" y1="496" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="32" y="518" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>Open-Meteo Air Quality API (open-meteo.com), hourly PM2.5 from the Copernicus Atmosphere Monitoring Service (CAMS) model at 28.6°N 77.2°E, desk daily means of 24 hourly values (Asia/Kolkata days); retrieved 2 Nov 2026 · Open-Meteo data CC BY 4.0, contains Copernicus Atmosphere Monitoring Service information. Modelled grid values, not CPCB station readings.</text><rect x="820" y="509" width="8" height="8" fill="#F2A93B"/><text x="928" y="518" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>