<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="imf-2026-scenarios-t imf-2026-scenarios-d" class="desk-plate" style="max-width:100%;height:auto"><title id="imf-2026-scenarios-t">Read the range, not the middle</title><desc id="imf-2026-scenarios-d">Bar chart of the IMF's April 2026 cases for world growth in 2026: 3.4% on pre-war assumptions, 3.1% in the reference forecast, 2.5% in the adverse scenario and 2.0% in the severe scenario.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="imf-2026-scenarios-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="506" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">THE 2026 LEDGER · MARKETS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Read the range, not the middle</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">IMF April 2026 WEO: world GDP growth in 2026 under each case, %</text><line x1="32.0" x2="32.0" y1="134" y2="422" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="234.0" x2="234.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="234.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">1</text><line x1="436.0" x2="436.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="436.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">2</text><line x1="638.0" x2="638.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="638.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">3</text><line x1="840.0" x2="840.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">4</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Pre-war assumptions (IMF counterfactual)</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">IMF blog, 14 Apr</text><rect x="32" y="162" width="686.8" height="26" rx="2" fill="#F2A93B"/><text x="728.8" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">3.4%</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Reference forecast (short war, fades by mid-2026)</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">WEO, 14 Apr</text><rect x="32" y="236" width="626.2" height="26" rx="2" fill="#4CC9B0"/><text x="668.2" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">3.1%</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Adverse scenario (inflation 5.4%)</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">IMF blog, 14 Apr</text><rect x="32" y="310" width="505.0" height="26" rx="2" fill="#FF7A5C"/><text x="547.0" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">2.5%</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Severe scenario (inflation above 6%)</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">IMF blog, 14 Apr</text><rect x="32" y="384" width="404.0" height="26" rx="2" fill="#A99BFF"/><text x="446.0" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">2.0%</text><line x1="32" x2="928" y1="462" y2="462" stroke="rgba(236,231,220,0.11)"/><text x="32" y="484" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>International Monetary Fund, World Economic Outlook April 2026 and IMF Blog, 14 Apr 2026</text><rect x="820" y="475" width="8" height="8" fill="#F2A93B"/><text x="928" y="484" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>