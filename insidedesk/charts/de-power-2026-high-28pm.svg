<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-power-2026-high-28pm-t de-power-2026-high-28pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-2026-high-28pm-t">Thursday's power is the dearest day of 2026 so far</title><desc id="de-power-2026-high-28pm-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 January to 29 October 2026, in euros per megawatt hour. The lowest day is Sunday 5 April at minus €16.34. The previous high for the year was €256.55 on 14 September. After €13.12 on Sunday 25 October, the price climbs to €249.21 for Wednesday 28 October and to €314.85 for delivery on Thursday 29 October, the latest value and the highest daily average of the year so far. Latest values: Day-ahead DE-LU 314.85 (2026-10-29).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-2026-high-28pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Thursday's power is the dearest day of 2026 so far</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Ne