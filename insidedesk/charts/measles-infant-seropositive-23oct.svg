<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 876" width="960" height="876" role="img" aria-labelledby="measles-infant-seropositive-23oct-t measles-infant-seropositive-23oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="measles-infant-seropositive-23oct-t">By six months, most babies had lost their mothers' measles shield</title><desc id="measles-infant-seropositive-23oct-d">Bar chart: the share of 92 US infants with detectable measles neutralising antibodies was 96.7% at birth, 89.1% at two months and 8.7% at six months for the vaccine strain; 98.9%, 91.3% and 19.6% for wild type B3; and 98.9%, 91.3% and 17.4% for wild type D8.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="measles-infant-seropositive-23oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="876" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">INSIDE DESK · HEALTH</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">By six months, most babies had lost their mothers' measles shield</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">US infants with detectable measles neutralising antibodies, % of 92 mother-infant pairs, by age and virus strai