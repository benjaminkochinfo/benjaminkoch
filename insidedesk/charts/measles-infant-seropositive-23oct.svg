, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">89.1%</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Vaccine strain (Edmonston), 6 months</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">IDWeek 2026</text><rect x="32" y="310" width="46.9" height="26" rx="2" fill="#FF7A5C"/><text x="88.9" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">8.7%</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Wild type B3, at birth</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">IDWeek 2026</text><rect x="32" y="384" width="532.7" height="26" rx="2" fill="#A99BFF"/><text x="574.7" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">98.9%</text><text x="32" y="448" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Wild type B3, 2 months</text><text x="928" y="448" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">IDWeek 2026</text><rect x="32" y="458" width="491.8" height="26" rx="2" fill="#C9D1D9"/><text x="533.8" y="477" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">91.3%</text><text x="32" y="522" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Wild type B3, 6 months</text><text x="928" y="522" text-anchor="end" font-family="'JetBrains