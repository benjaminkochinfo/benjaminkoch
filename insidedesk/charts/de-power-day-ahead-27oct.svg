<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-power-day-ahead-27oct-t de-power-day-ahead-27oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-27oct-t">The storm discount lasted a weekend; Tuesday's power is €155</title><desc id="de-power-day-ahead-27oct-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 27 October 2026, in euros per megawatt hour. It averages €144.82 in September and peaks at €256.55 on 14 September. It stands at €211.94 for delivery on 21 October, falls to €30.12 on Saturday 24 October and €13.12 on Sunday 25 October during the storm, recovers to €116.57 on Monday 26 October and rises to €155.11 for delivery on Tuesday 27 October, the latest value. Latest values: Day-ahead DE-LU 155.11 (2026-10-27).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-27oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The storm discount lasted a weekend; Tuesday's power is €155</text><text x="32" y="94" font-family