<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="de-tax-estimate-22pm-t de-tax-estimate-22pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-tax-estimate-22pm-t">The plus, and the two wishes</title><desc id="de-tax-estimate-22pm-d">Bar chart: the October tax estimate adds about €4.1 billion to federal tax revenue for 2027 compared with May, against an expected €5.4 billion a year for cutting the electricity tax to the EU minimum and about €4 billion for offsetting cold progression in 2027.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-tax-estimate-22pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="432" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">INSIDE DESK · POLITICS &amp; INSTITUTIONS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The plus, and the two wishes</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Federal budget 2027, € billion: new tax-estimate plus for the Bund against two proposed reliefs</text><line x1="32.0" x2="32.0" y1="134" y2="348" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="366" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="134" y2="348" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="366" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">2</text><line x1="570.7" x2="570.7" y1="134" y2="348" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="366" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">4</text><line x1="840.0" x2="840.0" y1="134" y2="348" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="366" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">6</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Bund tax revenue 2027, plus vs May estimate</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">171st tax estimate, 22 Oct 2026 (dpa-AFX)</text><rect x="32" y="162" width="552.1" height="26" rx="2" fill="#F2A93B"/><text x="594.1" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">4.1€ bn</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Electricity tax cut to EU minimum, households and small firms, a year</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">expected annual cost (dpa-AFX)</text><rect x="32" y="236" width="727.2" height="26" rx="2" fill="#4CC9B0"/><text x="769.2" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">5.4€ bn</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Offsetting 'cold progression' in 2027</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">about, extra cost next year (dpa-AFX)</text><rect x="32" y="310" width="538.7" height="26" rx="2" fill="#FF7A5C"/><text x="580.7" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">4.0€ bn</text><line x1="32" x2="928" y1="388" y2="388" stroke="rgba(236,231,220,0.11)"/><text x="32" y="410" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>Arbeitskreis Steuerschätzungen, 171st estimate, as reported by dpa-AFX via onvista, 22 Oct 2026; cost figures as reported by dpa-AFX</text><rect x="820" y="401" width="8" height="8" fill="#F2A93B"/><text x="928" y="410" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>