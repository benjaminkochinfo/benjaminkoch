<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ea-fuel-bills-t ea-fuel-bills-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ea-fuel-bills-t">Which pipe comes into your house</title><desc id="ea-fuel-bills-d">Line chart of annual price changes since January 2025. Liquid and motor fuels fall by up to about 9% a year in spring 2025, then jump after the war begins, reaching +33.8% in the euro area and +37.3% in Germany in September 2026. Electricity, gas and heat rise far less, to +6.9%, and core inflation stays near 2.5%. Latest values: Germany: liquid &amp; motor fuels 37.3% (2026-09); Euro area: liquid &amp; motor fuels 33.8% (2026-09); Euro area: electricity, gas &amp; heat 6.9% (2026-09); Euro area: core inflation 2.5% (2026-09).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ea-fuel-bills-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ORDINARY · HOUSEHOLD ENERGY</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Which pipe comes into your house</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3