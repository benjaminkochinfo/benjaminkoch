="607.6" y="653" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A45A00">56.0%</text><line x1="32" x2="928" y1="712" y2="712" stroke="rgba(28,26,22,0.12)"/><text x="32" y="734" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#4A4F57"><tspan fill="#62676F">SOURCE </tspan>Clinical Partners, survey of 2,033 UK adults conducted by PF Global, published 25 Nov 2026, retrieved 26 Nov…</text><rect x="820" y="725" width="8" height="8" fill="#A45A00"/><text x="928" y="734" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#1A1A1D">INSIDE DESK</text></svg>