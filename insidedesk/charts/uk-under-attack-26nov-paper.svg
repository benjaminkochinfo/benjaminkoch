<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 756" width="960" height="756" role="img" aria-labelledby="uk-under-attack-26nov-t uk-under-attack-26nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="uk-under-attack-26nov-t">Debate leaves 66% misunderstood, 64% judged, 60% disbelieved</title><desc id="uk-under-attack-26nov-d">Bar chart of how UK adults with lived experience of mental-health or neurodevelopmental conditions say recent headlines and public debate have left them feeling: misunderstood 66 percent, judged 64 percent, ignored 63 percent, powerless 63 percent, not believed 60 percent, hopeless 60 percent and unfairly treated 56 percent, from a Clinical Partners survey of 2,033 UK adults published on 25 November 2026.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="uk-under-attack-26nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="756" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">PSYCH · UNITED KINGDOM</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Debate leaves 66% misunderstood, 64% judged, 60% disbelieved</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">How recent headlines and public debate have left UK adults with lived experience of mental-health or neurodevelopmental conditions</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">feeling, in %, Clinical Partners survey by PF Global of 2,033 UK adults</text><line x1="32.0" x2="32.0" y1="162" y2="672" stroke="rgba(28,26,22,0.30)"/><text x="32.0" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">0</text><line x1="234.0" x2="234.0" y1="162" y2="672" stroke="rgba(28,26,22,0.12)"/><text x="234.0" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">20</text><line x1="436.0" x2="436.0" y1="162" y2="672" stroke="rgba(28,26,22,0.12)"/><text x="436.0" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">40</text><line x1="638.0" x2="638.0" y1="162" y2="672" stroke="rgba(28,26,22,0.12)"/><text x="638.0" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">60</text><line x1="840.0" x2="840.0" y1="162" y2="672" stroke="rgba(28,26,22,0.12)"/><text x="840.0" y="690" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">80</text><text x="32" y="180" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Misunderstood</text><rect x="32" y="190" width="666.6" height="26" rx="2" fill="#A45A00"/><text x="708.6" y="209" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A45A00">66.0%</text><text x="32" y="254" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Judged<