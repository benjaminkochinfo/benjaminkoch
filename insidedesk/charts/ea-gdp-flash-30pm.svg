<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="ea-gdp-flash-30pm-t ea-gdp-flash-30pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ea-gdp-flash-30pm-t">Spain kept growing, France slipped, Germany slowed</title><desc id="ea-gdp-flash-30pm-d">Line chart of quarterly real GDP growth on the previous quarter from Q1 2024 to Q3 2026 for the euro area, Spain, Germany and France. Spain grows every quarter, between 0.5% and 1.3%, and is 0.6% in Q3 2026, the latest value. The euro area moves between 0.0% and 0.6% and is 0.4% in Q3 2026, after 0.6% in Q2. Germany moves between -0.1% and 0.4% and is 0.2% in Q3 2026, after 0.3%. France falls below zero in Q4 2024 (-0.1%) and Q1 2026 (-0.2%), is 0.0% in Q2 2026 and -0.1% in Q3 2026, the latest value. Q3 2026 figures are a preliminary flash estimate and may be revised on 13 November 2026. Latest values: Euro area 0.4% (2026-07); Spain 0.6% (2026-07); Germany 0.2% (2026-07); France -0.1% (2026-07).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ea-gdp-flash-30pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · EURO AREA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" fo