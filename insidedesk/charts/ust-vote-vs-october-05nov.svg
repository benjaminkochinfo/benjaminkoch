<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 866" width="960" height="866" role="img" aria-labelledby="ust-vote-vs-october-05nov-t ust-vote-vs-october-05nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ust-vote-vs-october-05nov-t">The vote moved yields a few points; the five weeks before it moved them thirty</title><desc id="ust-vote-vs-october-05nov-d">Bar chart comparing how far US Treasury par yields fell on the first trading day after the 3 November 2026 election with how far they fell from 1 October to 4 November, in basis points. The 2-year fell 3 on the day, from 4.61% to 4.58%, and 20 since 1 October, from 4.78%. The 5-year fell 5 on the day, from 4.74% to 4.69%, and 32 since 1 October, from 5.01%. The 10-year fell 5 on the day, from 4.95% to 4.90%, and 34 since 1 October, from 5.24%. The 30-year fell 4 on the day, from 5.32% to 5.28%, and 33 since 1 October, from 5.61%. The latest values are the Wednesday 4 November closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ust-vote-vs-october-05nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="866" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · RATES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The vote moved yields a few points; the five weeks before it moved</text><text x="32" y="102" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">them thirty</text><text x="32" y="130" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Fall in US Treasury par yields, basis points (one basis point = 0.01 percentage point): election-day close (Tue 3 Nov) to first close after the</text><text x="32" y="150" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">vote (Wed 4 Nov), and Thu 1 Oct to Wed 4 Nov 2026</text><line x1="32.0" x2="32.0" y1="198" y2="782" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="800" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="234.0" x2="234.0" y1="198" y2="782" stroke="rgba(236,231,220,0.11)"/><text x="234.0" y="800" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">10</text><line x1="436.0" x2="436.0" y1="198" y2="782" stroke="rgba(236,231,220,0.11)"/><text x="436.0" y="800" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">20</text><line x1="638.0" x2="638.0" y1="198" y2="782" stroke="rgba(236,231,220,0.11)"/><text x="638.0" y="800" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">30</text><line x1="840.0" x2="840.0" y1="198" y2="782" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="800" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">40</text><text x="32" y="216" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">2-year, 3 to 4 Nov: 4.61% to 4.58%</text><text x="928" y="216" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="226" width="60.6" height="26" rx="2" fill="#F2A93B"/><text x="102.6" y="245" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">3.0 bp</text><text x="32" y="290" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">2-year, 1 Oct to 4 Nov: 4.78% to 4.58%</text><text x="928" y="290" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="300" width="404.0" height="26" rx="2" fill="#4CC9B0"/><text x="446.0" y="319" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">20.0 bp</text><text x="32" y="364" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">5-year, 3 to 4 Nov: 4.74% to 4.69%</text><text x="928" y="364" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="374" width="101.0" height="26" rx="2" fill="#FF7A5C"/><text x="143.0" y="393" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">5.0 bp</text><text x="32" y="438" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">5-year, 1 Oct to 4 Nov: 5.01% to 4.69%</text><text x="928" y="438" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Treasury</text><rect x="32" y="448" width="646.4" height="26" rx="2" fill="#A99BFF"/><text x="688.4" y="467" font-family="'JetBrains