<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-power-day-ahead-30oct-t de-power-day-ahead-30oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-30oct-t">€268.62 for Friday, after the dearest day of the year</title><desc id="de-power-day-ahead-30oct-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 30 October 2026, in euros per megawatt hour. It reaches a September high of €256.55 on 14 September, falls to €30.12 on Saturday 24 October and €13.12 on Sunday 25 October during the storm, then climbs to €249.21 on 28 October and €314.85 on Thursday 29 October, the highest daily average of 2026 so far. The latest value is €268.62 for delivery on Friday 30 October. Latest values: Day-ahead DE-LU 268.62 (2026-10-30).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-30oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">€268.62 for Friday, after the dearest day of the year</text><text x="32" y="94" font-family="'Familjen Grot