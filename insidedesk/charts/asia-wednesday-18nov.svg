<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" width="960" height="534" role="img" aria-labelledby="asia-wednesday-18nov-t asia-wednesday-18nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="asia-wednesday-18nov-t">Nvidia beats, Asia shrugs: Hang Seng -0.5%, Nikkei -0.3%</title><desc id="asia-wednesday-18nov-d">Bar chart of Wednesday 18 November 2026 percentage changes in Asia at about 03:30 CET, per AFP: Hang Seng down 0.5 percent, Nikkei 225 down 0.3 percent at the lunch break, Shanghai Composite down 0.3 percent and Kospi down 0.2 percent. These are intraday snapshot moves, not closes.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="asia-wednesday-18nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="534" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · ASIA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Nvidia beats, Asia shrugs: Hang Seng -0.5%, Nikkei -0.3%</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Size of the fall, in percent, on selected Asia-Pacific indexes, Wednesday 18 November 2026, intraday snapshot per AFP at about 03:30</text><text x="32" y="114" font-family="'Fa