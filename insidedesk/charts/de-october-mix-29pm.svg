<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 654" width="960" height="654" role="img" aria-labelledby="de-october-mix-29pm-t de-october-mix-29pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-october-mix-29pm-t">October's ledger: solar up by almost half, gas down by an eighth</title><desc id="de-october-mix-29pm-d">Bar chart of German electricity generation from 1 to 28 October, in gigawatt hours, 2026 against 2025. Lignite generated 6,081.3 GWh in 2026 against 5,111.5 GWh in 2025, up about 19%. Solar generated 4,742.6 GWh against 3,244.9 GWh, up about 46%. Natural gas generated 4,223.2 GWh against 4,852.7 GWh, down about 13%. The latest day included is Wednesday 28 October 2026.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-october-mix-29pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="654" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">October's ledger: solar up by almost half, gas down by an eighth</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Germany, realised electricity generation, 1 to 28 October, GWh, 2026 against the same days of 2025 (sum of SMARD daily totals, desk arithmetic)</text><line x1="32.0" x2="32.0" y1="134" y2="570" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="588" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="234.0" x2="234.0" y1="134" y2="570" stroke="rgba(236,231,220,0.11)"/><text x="234.0" y="588" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">2,000</text><line x1="436.0" x2="436.0" y1="134" y2="570" stroke="rgba(236,231,220,0.11)"/><text x="436.0" y="588" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">4,000</text><line x1="638.0" x2="638.0" y1="134" y2="570" stroke="rgba(236,231,220,0.11)"/><text x="638.0" y="588" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">6,000</text><line x1="840.0" x2="840.0" y1="134" y2="570" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="588" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">8,000</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Lignite, 1–28 Oct 2026</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">+19%</text><rect x="32" y="162" width="614.2" height="26" rx="2" fill="#F2A93B"/><text x="656.2" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">6,081.3 GWh</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Lignite, 1–28 Oct 2025</text><rect x="32" y="236" width="516.3" height="26" rx="2" fill="#C9D1D9"/><text x="558.3" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">5,111.5 GWh</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Solar, 1–28 Oct 2026</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">+46%</text><rect x="32" y="310" width="479.0" height="26" rx="2" fill="#4CC9B0"/><text x="521.0" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">4,742.6 GWh</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Solar, 1–28 Oct 2025</text><rect x="32" y="384" width="327.7" height="26" rx="2" fill="#C9D1D9"/><text x="369.7" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">3,244.9 GWh</text><text x="32" y="448" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Natural gas, 1–28 Oct 2026</text><text x="928" y="448" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">−13%</text><rect x="32" y="458" width="426.5" height="26" rx="2" fill="#FF7A5C"/><text x="468.5" y="477" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">4,223.2 GWh</text><text x="32" y="522" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Natural gas, 1–28 Oct 2025</text><rect x="32" y="532" width="490.1" height="26" rx="2" fill="#C9D1D9"/><text x="532.1" y="551" font-