<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="ten-year-yields-23oct-t ten-year-yields-23oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ten-year-yields-23oct-t">Three of four ten-year yields fell overnight. France's rose</title><desc id="ten-year-yields-23oct-d">Bar chart of 10-year government bond yields in early Asian trading on Friday 23 October 2026, as reported by Reuters: Australia 5.164%, down 10 basis points; France 5.0601%, up 6 basis points overnight to its highest since 2002; the United States 4.9591%, after a fall of more than 19 basis points, the biggest since March 2023; Japan 2.790%, down 9 basis points. France is the only one of the four that rose.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ten-year-yields-23oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="506" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · COMMITTEES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Three of four ten-year yields fell overnight. France's rose</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">10-year government bond yields, %, Friday 23 Oct 2026 early Asian trading (as reported), with the overnight move</text><line x1="32.0" x2="32.0" y1="134" y2="422" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">2</text><line x1="570.7" x2="570.7" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">4</text><line x1="840.0" x2="840.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">6</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Australia</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">down 10 bp</text><rect x="32" y="162" width="695.4" height="26" rx="2" fill="#F2A93B"/><text x="737.4" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">5.2%</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">France</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">up 6 bp, highest since 2002</text><rect x="32" y="236" width="681.4" height="26" rx="2" fill="#4CC9B0"/><text x="723.4" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">5.1%</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">United States</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">down 19+ bp, most since Mar 2023</text><rect x="32" y="310" width="667.8" height="26" rx="2" fill="#FF7A5C"/><text x="709.8" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">5.0%</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Japan</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">down 9 bp</text><rect x="32" y="384" width="375.7" height="26" rx="2" fill="#A99BFF"/><text x="417.7" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">2.8%</text><line x1="32" x2="928" y1="462" y2="462" stroke="rgba(236,231,220,0.11)"/><text x="32" y="484" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>Reuters (Stella Qiu), &quot;Asian shares wobble as tech rout boosts bonds, dents rate hike bets&quot;, 23 Oct 2026 03:50, via Euronext</text><rect x="820" y="475" width="8" height="8" fill="#F2A93B"/><text x="928" y="484" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>