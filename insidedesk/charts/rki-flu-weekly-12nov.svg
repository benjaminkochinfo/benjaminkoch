<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="rki-flu-weekly-12nov-t rki-flu-weekly-12nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="rki-flu-weekly-12nov-t">Flu is climbing, one notified week at a time</title><desc id="rki-flu-weekly-12nov-d">Line chart of weekly laboratory-confirmed influenza cases notified to the Robert Koch Institute in Germany, reporting weeks 40 to 45 of 2026. Cases move between 438 and 554 in the first four weeks, rise to 726 in week 44 and reach 844 in week 45 (2 to 8 November 2026), the latest value. Hospital admissions among them rise from 116 in week 40 to 212 in week 45. Latest values: Confirmed flu cases 844 cases (2026-11-02); Of which admitted to hospital 212 cases (2026-11-02).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="rki-flu-weekly-12nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">HEALTH &amp; CARE · GERMANY</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Flu is climbing, one notified week at a time</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9A