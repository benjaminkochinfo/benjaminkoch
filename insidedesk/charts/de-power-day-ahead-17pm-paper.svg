<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="de-power-day-ahead-17pm-t de-power-day-ahead-17pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-17pm-t">Wednesday €146.25 a MWh, €65.33 below Tuesday</title><desc id="de-power-day-ahead-17pm-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 18 November 2026, in euros per megawatt hour. After a record €351.48 on Tuesday 10 November the price fell to €139.70 on Sunday 15 November, rose to €194.49 on Monday and €211.58 on Tuesday 17 November, and drops to €146.25 for delivery on Wednesday 18 November, €65.33 below Tuesday and the lowest weekday value since Monday 26 October (€116.57). Latest values: Day-ahead DE-LU 146.25 (2026-11-18).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-17pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Wednesday €146.25 a MWh, €65.33 below Tuesday</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif