<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="us-customs-duties-t us-customs-duties-d" class="desk-plate" style="max-width:100%;height:auto"><title id="us-customs-duties-t">The invoice, in the national accounts</title><desc id="us-customs-duties-d">Line chart of quarterly US federal customs receipts at a seasonally adjusted annual rate. They are about $80 billion to $89 billion through 2024, jump to about $271 billion in the second quarter of 2025 and $367 billion in the fourth, then ease to $326 billion in the first quarter of 2026 and $306 billion in the second, after the February ruling. Latest values: Customs duties 306.398 (2026-04-01).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="us-customs-duties-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">THE 2026 LEDGER · POLITICS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The invoice, in the national accounts</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">US federal customs duties received, US$ billion, seasonally adjusted annual rate, quarterly</text><