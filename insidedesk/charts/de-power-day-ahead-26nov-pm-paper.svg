<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="de-power-day-ahead-26nov-pm-t de-power-day-ahead-26nov-pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-26nov-pm-t">Friday €301.82 a MWh, up from Thursday's €291.77</title><desc id="de-power-day-ahead-26nov-pm-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 27 November 2026, in euros per megawatt hour. Prices mostly ran between about €100 and €210 in September and October, climbed above €250 from late October, peaked at €351.48 on Tuesday 10 November, fell to €139.70 on Sunday 15 November, were €246.29 on Wednesday 25 November and €291.77 on Thursday 26 November, and stand at €301.82 for the latest delivery day, Friday 27 November, the highest daily average since 11 November. Latest values: Day-ahead DE-LU 301.82 (2026-11-27).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-26nov-pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Friday €301.82 a MWh, up from Thursday's €291.77</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">Germany/Luxembourg day-ahead price, daily average by delivery day, € per MWh, 1 Sep to Fri 27 Nov 2026. Friday's quarter-hours run</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">from €203.35 (23:45) to €426.32 (08:15)</text><line x1="32" x2="792" y1="476.0" y2="476.0" stroke="rgba(28,26,22,0.12)"/><text x="32" y="470.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57" paint-order="stroke" stroke="#FFFCF6" stroke-width="5" stroke-linejoin="round">−100</text><line x1="32" x2="792" y1="412.8" y2="412.8" stroke="rgba(28,26,22,0.30)"/><text x="32" y="406.8" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57" paint-order="stroke" stroke="#FFFCF6" stroke-width="5" stroke-linejoin="round">0</text><line x1="32" x2="792" y1="349.6" y2="349.6" stroke="rgba(28,26,22,0.12)"/><text x="32" y="343.6" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57" paint-order="stroke" stroke="#FFFCF6" stroke-width="5" stroke-linejoin="round">100</text><line x1="32" x2="792" y1="286.4" y2="286.4" stroke="rgba(28,26,22,0.12)"/><text x="32" y="280.4" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57" paint-order="stroke" stroke="#FFFCF6" stroke-width="5" stroke-linejoin="round">200</text><line x1="32" x2="792" y1="223.2" y2="223.2" stroke="rgba(28,26,22,0.12)"/><text x="32" y="217.2" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57" paint-order="stroke" stroke="#FFFCF6" stroke-width="5" stroke-linejoin="round">300</text><line x1="32" x2="792" y1="160.0" y2="160.0" stroke="rgba(28,26,22,0.12)"/><text x="32" y="154.0" font-family=