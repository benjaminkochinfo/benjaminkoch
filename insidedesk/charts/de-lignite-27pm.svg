<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-lignite-27pm-t de-lignite-27pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-lignite-27pm-t">Lignite took the storm weekend off, then went back to work</title><desc id="de-lignite-27pm-d">Line chart of daily electricity generation from lignite in Germany from 1 September to 26 October 2026, in megawatt hours. It averages about 197,771 MWh a day in September and peaks at 291,434 MWh on 2 October. It stands at 255,448 MWh on Wednesday 21 October, drops to 54,346 MWh on storm Saturday 24 October, the lowest day since 14 June 2026, and 62,470 MWh on Sunday 25 October, then climbs back to 162,086 MWh on Monday 26 October, the latest value. Latest values: Lignite generation DE 162086 (2026-10-26).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-lignite-27pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Lignite took the storm weekend off, then went back to work</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-seri