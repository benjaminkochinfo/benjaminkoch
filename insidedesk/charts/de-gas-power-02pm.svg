<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-gas-power-02pm-t de-gas-power-02pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-gas-power-02pm-t">Five still days, five days of gas</title><desc id="de-gas-power-02pm-d">Line chart of daily electricity generation from natural gas in Germany from 1 September to 1 November 2026, in gigawatt hours. Before late October it moves mostly between about 50 and 240, falls to 42.5 on Saturday 24 October and 43.5 on Sunday 25 October during the storm, then climbs to 242.0 on 28 October and stays near 280 to 290 for four days: 286.5 on 29 October, 287.6 on 30 October, the highest of the period, 280.9 on 31 October and 282.6 on 1 November. The latest value is 282.6 gigawatt hours for Sunday 1 November. Latest values: Gas-fired generation DE, GWh 282.6 (2026-11-01).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-gas-power-02pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Five still days, five days of gas</text><text x="32" y="94" font-family="'Familjen Grote