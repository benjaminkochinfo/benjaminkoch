<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 728" width="960" height="728" role="img" aria-labelledby="us-midterm-stress-02nov-t us-midterm-stress-02nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="us-midterm-stress-02nov-t">Stressed by the vote, still planning to cast it</title><desc id="us-midterm-stress-02nov-d">Bar chart from a LifeStance survey of 1,000 US adults in October 2026: 70% feel at least some stress about the 3 November midterms; 55% of Gen Z, 51% of full-time employees, 48% of millennials and 43% of all adults report moderate or significant stress; 32% have a plan to protect their mental health on election night; 26% have used an AI chatbot to talk through election stress.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="us-midterm-stress-02nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="728" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">INSIDE DESK · PSYCHOLOGY &amp; BEHAVIOUR</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Stressed by the vote, still planning to cast it</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">US adults, LifeStance/Dynata online survey, October 202