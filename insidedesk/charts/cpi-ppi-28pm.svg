<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="cpi-ppi-28pm-t cpi-ppi-28pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="cpi-ppi-28pm-t">The wholesale bill runs ahead of the shop price</title><desc id="cpi-ppi-28pm-d">Line chart of the annual change in US consumer prices and producer prices for final demand, monthly since January 2025. In January 2025 consumer prices are up 3.0% on a year earlier and producer prices 3.8%. Both run between about 2.3% and 3.1% through 2025; no consumer price figure exists for October 2025. From March 2026 producer prices pull away: 4.3% in March, 5.9% in May and 6.3% in September 2026, the latest value. Consumer prices peak at 4.2% in May 2026 and stand at 3.7% in September 2026, the latest value, 2.6 percentage points below producer prices. Latest values: Producer prices, final demand 6.3% (2026-09); Consumer prices 3.7% (2026-09).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="cpi-ppi-28pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · PRICES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The wholesale bill runs ahead of the shop price</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">US consumer prices (CPI-U, all items) and producer prices (PPI final demand), change on a year earlier, %, monthly</text><line x1="32" x2="792" y1="448.0" y2="448.0" stroke="rgba(236,231,220,0.11)"/><text x="32" y="442.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">2%</text><line x1="32" x2="792" y1="384.8" y2="384.8" stroke="rgba(236,231,220,0.11)"/><text x="32" y="378.8" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">3%</text><line x1="32" x2="792" y1="321.6" y2="321.6" stroke="rgba(236,231,220,0.11)"/><text x="32" y="315.6" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">4%</text><line x1="32" x2="792" y1="258.4" y2="258.4" stroke="rgba(236,231,220,0.11)"/><text x="32" y="252.4" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">5%</text><line x1="32" x2="792" y1="195.2" y2="195.2" stroke="rgba(236,231,220,0.11)"/><text x="32" y="189.2" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">6%</text><line x1="32" x2="792" y1="132.0" y2="132.0" stroke="rgba(236,231,220,0.11)"/><text x="32" y="126.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">7%</text><line x1="32.0" x2="32.0" y1="448" y2="453" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="470" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">Jan ’25</text><line x1="144.5" x2="144.5" y1="448" y2="453" stroke="rgba(236,231,220,0.28)"/><text x="144.5" y="470" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">Apr</text><line x1="258.2" x2="258.2" y1="448" y2="453" stroke="rgba(236,231,220,0.28)"/><text x="258.2" y="470" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">Jul</text><line x1="373.2" x2="373.2" y1="448" y2="453" stroke="rgba(236,231,220,0.28)"/><text x="373.2" y="470" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">Oct</text><line x1="488.2" x2="488.2" y1="448" y2="453" stroke="rgba(236,231,220,0.28)"/><text x="488.2" y="470" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">Jan ’26</text><line x1="600.8" x2="600.8" y1="448" y2="453" stroke="rgba(236,231,220,0.28)"/><text x="600.8" y="470" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">Apr</text><line x1="714.5" x2="714.5" y1="448" y2="453" stroke="rgba(236,231,220,0.28)"/><text x="714.5" y="470" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">Jul</text><line x1="560.8" x2="560.8" y1="128" y2="448" stroke="#F2A93B" stroke-opacity=".55" stroke-dasharray="3 4"/><text x="554.8" y="140" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#F2A93B">War begins</text><path d="M32.0,334.2L70.8,359.5L105.8,372.2L144.5,42