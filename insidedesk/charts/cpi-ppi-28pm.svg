mily="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>U.S. Bureau of Labor Statistics, CPI-U all items (CUUR0000SA0) and PPI final demand (WPUFD4), not seasonally adjusted index levels via the BLS public data API, retrieved 28 Oct 2026. Annual rates are desk arithmetic from the index levels. BLS published no October 2025 CPI index · U.S. government data, public domain</text><rect x="820" y="509" width="8" height="8" fill="#F2A93B"/><text x="928" y="518" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>