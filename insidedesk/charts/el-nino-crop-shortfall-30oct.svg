<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="el-nino-crop-shortfall-30oct-t el-nino-crop-shortfall-30oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="el-nino-crop-shortfall-30oct-t">Where El Niño has bitten before</title><desc id="el-nino-crop-shortfall-30oct-d">Bar chart of the average production shortfall against trend-expected normal production in the seven strong and very strong El Niño events since 1980, as reported by FEWS NET from USDA data: South Africa maize 27.7% below normal, Australia wheat 15.3%, India rice 5.7%, Indonesia and Malaysia palm oil 4.0%, and Thailand rice 3.0%. World wheat, maize and rice together averaged 1.3% above normal over the same events, which is not shown as a bar.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="el-nino-crop-shortfall-30oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="580" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">INSIDE DESK · CLIMATE &amp; WEATHER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Where El Niño has bitten before</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Av