<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-gas-power-22pm-t de-gas-power-22pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-gas-power-22pm-t">Germany burned a sixth less gas for power this October</title><desc id="de-gas-power-22pm-d">Line chart of daily electricity generation from natural gas in Germany since July 2025, in megawatt hours. It rises each autumn and peaks in winter, at 417,047 MWh on 27 January 2026, and falls to a low of 43,247 MWh on 13 June 2026. Over 1 to 21 October 2026 gas plants generated about 3,421 gigawatt hours, against about 4,054 for the same days of 2025, roughly 16% less. The latest value, for Wednesday 21 October 2026, is 241,431 MWh, the highest daily total since 25 February 2026. Latest values: Gas-fired generation DE 123316 (2026-10-22).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-gas-power-22pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Germany burned a sixth less gas for power this October</text><text x="32" y="94" font-family="'Familjen Grotesk'