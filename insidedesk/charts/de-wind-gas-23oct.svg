<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-wind-gas-23oct-t de-wind-gas-23oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-wind-gas-23oct-t">Thursday the wind nearly tripled and the gas burn halved</title><desc id="de-wind-gas-23oct-d">Line chart of daily electricity generation in Germany from onshore wind and from natural gas, 1 September to 22 October 2026, in gigawatt hours. Wind swings widely, from 27.4 GWh on 4 October to 842.9 GWh on 9 October. Gas runs lower and steadier, from 50.1 GWh on 20 September to 241.4 GWh on Wednesday 21 October, its highest of the period. On Thursday 22 October onshore wind generated 673.1 GWh, up from 242.3 GWh the day before and the third-highest day since 1 September, while gas fell to 123.3 GWh, about half of Wednesday's total. Latest values: Onshore wind 673.1 GWh (2026-10-22); Natural gas 123.3 GWh (2026-10-22).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-wind-gas-23oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Thursday the wind nearly trip