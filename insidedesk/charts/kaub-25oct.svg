<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="kaub-25oct-t kaub-25oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="kaub-25oct-t">The Rhine reached the 2018 low, and stayed near it</title><desc id="kaub-25oct-d">Line chart of the Rhine water level at the Kaub gauge from 25 September to 24 October 2026, as daily means of 15-minute readings in centimetres above the gauge zero, against a flat line at 25 cm, the lowest daily reading of the 2010–2020 reference period, set on 22 October 2018. The daily mean stays below that line for four weeks, falling below zero on several days, with the lowest mean of −4.8 cm on 1 October. It recovers to 19.7 cm on 13 October, dips to 8.8 cm on 18 October and climbs to 19.1 cm on 22 October. On Friday 23 October the daily mean reaches 25.9 cm, just above the 2018 line, and on Saturday 24 October it slips back to 23.8 cm, just below it. Latest values: Kaub, daily mean 23.8 cm (2026-10-24); Lowest daily reading 2010–2020 (25 cm, 22 Oct 2018) 25 cm (2026-10-24).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="kaub-25oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · RHINE</text><text x="32" y="66"