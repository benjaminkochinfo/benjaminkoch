<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-household-lines-29oct-t de-household-lines-29oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-household-lines-29oct-t">The pump ran away; the plate and the boiler did not</title><desc id="de-household-lines-29oct-d">Line chart of annual price changes in Germany since January 2025, from Eurostat's harmonised index. Fuels for personal transport fall by up to 8.4% a year in April 2025, are near zero in early 2026, then jump to 19.8% in March 2026 and reach 36.8% in September 2026, the latest value. In September 2026 all items stand at 3.3%, food and non-alcoholic beverages at 0.4%, and electricity, gas and other household fuels at -1.9%, below zero throughout the period. Latest values: Fuels for your car 36.8% (2026-09); All items 3.3% (2026-09); Food and soft drinks 0.4% (2026-09); Electricity, gas and other household fuels -1.9% (2026-09).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-household-lines-29oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ORDINARY · THE HOUSEHOLD BASKET</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-