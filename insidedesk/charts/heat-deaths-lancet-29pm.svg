<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 654" width="960" height="654" role="img" aria-labelledby="heat-deaths-lancet-29pm-t heat-deaths-lancet-29pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="heat-deaths-lancet-29pm-t">The extra deaths are the warming's share</title><desc id="heat-deaths-lancet-29pm-d">Bar chart of estimated heat-related deaths worldwide per year, in thousands. The 2006–15 average was 398.4 thousand in the observed climate and 179.3 thousand without climate change. The 2016–23 average was 540.8 thousand observed and 170.9 thousand without climate change. In 2023, the latest year, the estimate was 708.7 thousand observed and 202.0 thousand without climate change.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="heat-deaths-lancet-29pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="654" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · HEAT AND HEALTH</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The extra deaths are the warming's share</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Estimated heat-related deaths worldwide a year, thousands: as obser