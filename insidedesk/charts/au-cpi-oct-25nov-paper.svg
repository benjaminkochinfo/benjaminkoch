<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="au-cpi-oct-25nov-t au-cpi-oct-25nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="au-cpi-oct-25nov-t">Australia's inflation: 1.9% in June 2025, 4.9% in October</title><desc id="au-cpi-oct-25nov-d">Line chart of Australia's monthly consumer price index, annual change in percent, from April 2025 to October 2026. Inflation was 2.4 percent in April 2025, fell to a low of 1.9 percent in June 2025, rose to 3.8 percent by October 2025, peaked at 4.6 percent in March 2026, eased to 3.5 percent in July 2026 and has since risen to 4.0 percent in August, 4.3 percent in September and 4.9 percent in October 2026, the latest month. Latest values: CPI, annual change 4.9% (2026-10).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="au-cpi-oct-25nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">MONEY · PRICES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Australia's inflation: 1.9% in June 2025, 4.9% in October</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57