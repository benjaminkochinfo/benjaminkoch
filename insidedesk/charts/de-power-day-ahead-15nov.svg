<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="de-power-day-ahead-15nov-t de-power-day-ahead-15nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-15nov-t">Sunday €139.70, the week's cheapest day</title><desc id="de-power-day-ahead-15nov-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 15 November 2026, in euros per megawatt hour. In the week from Monday 9 November it reads €345.64 on Monday, a record €351.48 on Tuesday, €316.65 on Wednesday, €199.05 on Thursday, €161.74 on Friday and €197.72 on Saturday. The latest value is €139.70 for delivery on Sunday 15 November, the lowest of the week, €58.02 below Saturday and €102.43 below the previous Sunday, 8 November, at €242.13. Latest values: Day-ahead DE-LU 139.7 (2026-11-15).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-15nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Sunday €139.70, the week's cheapest day</text><text x="32" y="94" font-family="'Familjen Grot