<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="uk-heart-failure-visits-04pm-t uk-heart-failure-visits-04pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="uk-heart-failure-visits-04pm-t">Heart failure is filling beds faster than everything else</title><desc id="uk-heart-failure-visits-04pm-d">Bar chart: between 2014/15 and 2024/25, all UK hospital visits rose by 20%, UK hospital visits for heart failure rose by 52%, from 173,744 to 264,417, and heart failure visits in England rose by 58%, the steepest of the UK nations.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="uk-heart-failure-visits-04pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="432" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">INSIDE DESK · HEALTH</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Heart failure is filling beds faster than everything else</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Rise in hospital visits between 2014/15 and 2024/25, %</text><line x1="32.0" x2="32.0" y1="134" y2="348" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="366" text-anchor="middl