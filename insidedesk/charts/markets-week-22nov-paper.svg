<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 682" width="960" height="682" role="img" aria-labelledby="markets-week-22nov-t markets-week-22nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="markets-week-22nov-t">Week to 20 Nov: Nasdaq −10.0%, S&amp;P −8.6%, DAX −7.3%</title><desc id="markets-week-22nov-d">Bar chart of weekly falls in the week to Friday 20 November 2026, all indexes lower: the Nasdaq Composite fell 10.0 percent to 22,617.73, the S&amp;P 500 8.6 percent to 6,910.39, MSCI's gauge of stocks across the globe 8.1 percent, the Dow Jones Industrial Average 8.0 percent to 48,147.33, Germany's DAX 7.3 percent to 24,802.78 and the Stoxx Europe 600 5.8 percent to 625.65. Bars show the size of the fall.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="markets-week-22nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="682" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">MARKETS · THE WEEK</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Week to 20 Nov: Nasdaq −10.0%, S&amp;P −8.6%, DAX −7.3%</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">Fall in % over the week to Friday 20 Nov 2026, closing ba