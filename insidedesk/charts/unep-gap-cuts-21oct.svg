<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="unep-gap-cuts-21oct-t unep-gap-cuts-21oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="unep-gap-cuts-21oct-t">What is needed, and what is pledged</title><desc id="unep-gap-cuts-21oct-d">Bar chart of cuts in global greenhouse gas emissions relative to 2025 in UNEP's Emissions Gap Report 2026. The lowest 1.5°C overshoot path needs 18% by 2030, 45% by 2035 and 69% by 2040. Full implementation of national pledges (NDCs) gives 5–8% by 2030 and 11–15% by 2035; the bars show the upper ends, 8% and 15%.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="unep-gap-cuts-21oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="580" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · EMISSIONS GAP REPORT 2026</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">What is needed, and what is pledged</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Cut in global greenhouse gas emissions relative to 2025, %</text><line x1="32.0" x2="32.0" y1="134" y2="496" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="234.0" x2="234.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="234.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">20</text><line x1="436.0" x2="436.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="436.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">40</text><line x1="638.0" x2="638.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="638.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">60</text><line x1="840.0" x2="840.0" y1="134" y2="496" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="514" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">80</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">2030 — needed for the lowest 1.5°C overshoot path</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">UNEP EGR 2026</text><rect x="32" y="162" width="181.8" height="26" rx="2" fill="#F2A93B"/><text x="223.8" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">18.0%</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">2030 — all NDCs implemented (upper end of 5–8%)</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">UNEP EGR 2026, range 5–8%</text><rect x="32" y="236" width="80.8" height="26" rx="2" fill="#4CC9B0"/><text x="122.8" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">8.0%</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">2035 — needed for the lowest 1.5°C overshoot path</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">UNEP EGR 2026</text><rect x="32" y="310" width="454.5" height="26" rx="2" fill="#FF7A5C"/><text x="496.5" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">45.0%</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">2035 — all NDCs implemented (upper end of 11–15%)</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">UNEP EGR 2026, range 11–15%</text><rect x="32" y="384" width="151.5" height="26" rx="2" fill="#A99BFF"/><text x="193.5" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">15.0%</text><text x="32" y="448" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">2040 — needed for the lowest 1.5°C overshoot path</text><text x="928" y="448" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">UNEP EGR 2026</text><rect x="32" y="458" width="696.9" height="26" rx="2" fill="#C9D1D9"/><text x="738.9" y="477" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">69.0%</text><line x1="32" x2="928" y1="536" y2="536" stroke="rgba(236,231,220,0.11)"/><text x="32" y="558" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>UN Environment Programme, Emissions Gap Report 2026: The Point of Return (press release, Nairobi, 21 Oct 2026)</text><rect x="820" y="549" width="8" height="8" fill="#F2A93B"/><text x="928" y="558" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>