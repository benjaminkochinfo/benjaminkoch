<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 792" width="960" height="792" role="img" aria-labelledby="china-pmi-falls-02nov-t china-pmi-falls-02nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="china-pmi-falls-02nov-t">Prices and production fell furthest; export orders more than the headline</title><desc id="china-pmi-falls-02nov-d">Bar chart of how far China's official manufacturing PMI and selected sub-indices fell from September to October 2026, in index points. The headline PMI fell 0.8, from 50.1 to 49.3. Production fell 1.9 to 49.8. New orders fell 1.1 to 49.4. New export orders fell 1.3, from 50.0 to 48.7 (desk arithmetic). The large-firm PMI fell 0.4 to 50.2. Factory-gate prices fell 2.3 to 51.7. Purchase prices fell 4.0 to 56.8, the largest fall. All figures are for October 2026, the latest month.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="china-pmi-falls-02nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="792" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">GEOECON · PODIUM VS PRINT</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Prices and production fell furthest; export orders more than the</text><text x="32" y="102" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">headline</text><text x="32" y="130" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Fall in China's official manufacturing PMI and selected sub-indices, September to October 2026, index points (50 separates expansion</text><text x="32" y="150" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">from contraction)</text><line x1="32.0" x2="32.0" y1="198" y2="708" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="726" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="198" y2="708" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="726" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">2</text><line x1="570.7" x2="570.7" y1="198" y2="708" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="726" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">4</text><line x1="840.0" x2="840.0" y1="198" y2="708" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="726" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">6</text><text x="32" y="216" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Headline PMI: 50.1 to 49.3</text><text x="928" y="216" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">NBS</text><rect x="32" y="226" width="107.7" height="26" rx="2" fill="#F2A93B"/><text x="149.7" y="245" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">0.8 pts</text><text x="32" y="290" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Production: to 49.8</text><text x="928" y="290" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">NBS</text><rect x="32" y="300" width="255.9" height="26" rx="2" fill="#4CC9B0"/><text x="297.9" y="319" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">1.9 pts</text><text x="32" y="364" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">New orders: to 49.4</text><text x="928" y="364" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">NBS</text><rect x="32" y="374" width="148.1" height="26" rx="2" fill="#FF7A5C"/><text x="190.1" y="393" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">1.1 pts</text><text x="32" y="438" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">New export orders: 50.0 to 48.7</text><text x="928" y="438" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">desk arithmetic</text><rect x="32" y="448" width="175.1" height="26" rx="2" fill="url(#china-pmi-falls-02nov-hatch)" stroke="#F2A93B" stroke-width="1.2"/><text x="217.1" y="467" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">1.3 pts</text><text x="32" y="512" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Large firms: to 50.2</text><text x="928" y="512" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">NBS</text><rect x="32" y="522" width="53.9" height="26" rx="2" fill="#C9D1D9"/><text x="95.9" y="541" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C9D1D9">0.4 pts</text><text x="32" y="586" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Factory-gate prices: to 51.7</text><text x="928" y="586" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">NBS</text><rect x="32" y="596" width="309.7" height="26" rx="2" fill="#7FB2FF"/><text x="351.7" y="615" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#7FB2FF">2.3 pts</text><text x="32" y="660" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Purchase prices: to 56.8</text><text x="928" y="660" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">NBS</text><rect x="32" y="670" width="538.7" height="26" rx="2" fill="#F2A93B"/><text x="580.7" y="689" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">4.0 pts</text><line x1="32" x2="928" y1="748" y2="748" stroke="rgba(236,231,220,0.11)"/><text x="32" y="770" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>National Bureau of Statistics of China, official manufacturing PMI for October 2026, published 31 Oct 2026, as…</text><rect x="820" y="761" width="8" height="8" fill="#F2A93B"/><text x="928" y="770" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>