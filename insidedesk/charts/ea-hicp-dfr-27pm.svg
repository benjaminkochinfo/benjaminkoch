<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ea-hicp-dfr-27pm-t ea-hicp-dfr-27pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ea-hicp-dfr-27pm-t">Prices ran ahead, the rate walked behind</title><desc id="ea-hicp-dfr-27pm-d">Line chart since January 2025 of euro-area HICP inflation and the ECB deposit rate. Inflation is 2.5% in January 2025, between 1.9% and 2.2% for the rest of 2025, 1.7% in January 2026 and 1.9% in February, then rises after the energy shock to 3.2% in May, 2.8% in June and 3.8% in September 2026, the latest value. The deposit rate falls from 3.00% to 2.00% by mid-2025, rises to 2.25% in June 2026 and to 2.50% in September 2026, where it stands in October 2026. The ECB decides on 29 October. Latest values: HICP inflation 3.8% (2026-09); ECB deposit rate 2.5% (2026-10).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ea-hicp-dfr-27pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · EURO AREA</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Prices ran ahead, the rate walked behind</text><text x="32" y="94" font-family="'Familjen Grotesk', '