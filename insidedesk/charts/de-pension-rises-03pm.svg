<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 728" width="960" height="728" role="img" aria-labelledby="de-pension-rises-03pm-t de-pension-rises-03pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-pension-rises-03pm-t">Seven Julys of pension rises, one of them zero</title><desc id="de-pension-rises-03pm-d">Bar chart of the German statutory pension adjustment on 1 July of each year from 2020 to 2026, for West Germany until 2023 and nationwide from 2024. 2020: 3.45%. 2021: zero, because wages had fallen in 2020. 2022: 5.35%. 2023: 4.39%. 2024: 4.57%. 2025: 3.74%. The latest value is 4.24% on 1 July 2026. The government's draft estimate of 4.09% for July 2027 is not shown, because it is not yet decided.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-pension-rises-03pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="728" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ORDINARY · PENSIONS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Seven Julys of pension rises, one of them zero</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Statutory pension adjustment on 1 July, West Germany until 2023, na