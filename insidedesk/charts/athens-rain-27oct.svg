<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="athens-rain-27oct-t athens-rain-27oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="athens-rain-27oct-t">A month's rain, six times over</title><desc id="athens-rain-27oct-d">Line chart of modelled rainfall at an Athens grid point, running total from 1 October. In 2026 the total stays below 10 mm until 10 October, jumps to 62.5 mm by 14 October, reaches 77.5 mm by 24 October and ends at 128.2 mm on Monday 26 October 2026, the latest value. The 1991–2020 average for the same days climbs slowly to 20.1 mm by 26 October. Latest values: October 2026 128.2 mm (2026-10-26); 1991–2020 average 20.1 mm (2026-10-26).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="athens-rain-27oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · ATHENS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">A month's rain, six times over</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Rain since 1 October, running total, mm · Athens grid point (modelled)