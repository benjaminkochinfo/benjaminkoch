<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ust-election-day-04nov-t ust-election-day-04nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ust-election-day-04nov-t">Election day closed at 4.61% and 4.95%</title><desc id="ust-election-day-04nov-d">Line chart of the daily US 2-year and 10-year Treasury par yields from 1 October to 3 November 2026. On 1 October the 2-year is at 4.78% and the 10-year at 5.24%. The 10-year peaks at 5.31% on 5 October; both fall sharply on 22 October and drift lower to 4.56% and 4.94% on 30 October. On Tuesday 3 November 2026, US election day and the latest value, the 2-year closes at 4.61% and the 10-year at 4.95%, a gap of 0.34 percentage points. Latest values: 2-year yield 4.61% (2026-11-03); 10-year yield 4.95% (2026-11-03).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ust-election-day-04nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · RATES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Election day closed at 4.61% and 4.95%</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-ser