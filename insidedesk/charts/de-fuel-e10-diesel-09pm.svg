<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-fuel-e10-diesel-09pm-t de-fuel-e10-diesel-09pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-fuel-e10-diesel-09pm-t">Petrol fell 14.4 cents in a month; diesel 0.1</title><desc id="de-fuel-e10-diesel-09pm-d">Line chart of German national average pump prices on three dates. Super E10 falls from €2.140 a litre on 8 October to about €2.072 on 1 November and €1.996 on Sunday 8 November 2026, the latest value. Diesel goes from €2.242 to about €2.282 and back to €2.241 on 8 November, leaving a gap of 24.5 cents a litre. Latest values: Super E10 1.996 €/l (2026-11-08); Diesel 2.241 €/l (2026-11-08).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-fuel-e10-diesel-09pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ORDINARY · GERMANY AT THE PUMP</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Petrol fell 14.4 cents in a month; diesel 0.1</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">ADAC national daily average pump price, € per litre, Super