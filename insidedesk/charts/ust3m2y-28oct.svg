<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ust3m2y-28oct-t ust3m2y-28oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ust3m2y-28oct-t">The bill already sits above the Fed's ceiling</title><desc id="ust3m2y-28oct-d">Line chart of the daily US 3-month Treasury bill and 2-year Treasury note par yields since January 2026. On 2 January the 3-month is at 3.65% and the 2-year at 3.47%. The 2-year falls to its low of 3.38% on 27 February, then climbs to a peak of 4.92% on 28 September, the same day the 3-month peaks at 4.28%. On Tuesday 27 October 2026, the latest value, the 3-month bill is at 4.22% and the 2-year at 4.70%, both above the Federal Reserve's 3.75% to 4% target range. Latest values: 3-month bill 4.22% (2026-10-27); 2-year note 4.7% (2026-10-27).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ust3m2y-28oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · RATES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">The bill already sits above the Fed's ceiling</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" 