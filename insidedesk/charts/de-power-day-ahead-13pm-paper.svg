<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-power-day-ahead-13pm-t de-power-day-ahead-13pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-13pm-t">Saturday €197.72, up from Friday's €161.74</title><desc id="de-power-day-ahead-13pm-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 14 November 2026, in euros per megawatt hour. It falls to €13.12 on Sunday 25 October, climbs to €314.85 on Thursday 29 October and stays between €242.13 and €275.64 from 2 to 8 November. In the week of 9 November it reads €345.64 on Monday, a record €351.48 on Tuesday, €316.65 on Wednesday, €199.05 on Thursday and €161.74 on Friday. The latest value is €197.72 for delivery on Saturday 14 November, €35.98 above Friday and €62.11 below the previous Saturday, 7 November, at €259.83. Latest values: Day-ahead DE-LU 197.72 (2026-11-14).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-13pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Satur