<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 756" width="960" height="756" role="img" aria-labelledby="europe-friday-20pm-t europe-friday-20pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="europe-friday-20pm-t">Friday close: MDax down 2.54%, DAX 2.45%, London 1.02%</title><desc id="europe-friday-20pm-d">Bar chart of falls on the main European stock indexes at the close on Friday 20 November 2026, all lower on the day: Frankfurt's MDax down 2.54 percent to 28,756.57, Milan's FTSE MIB down 2.48 percent to 48,703.72, the DAX down 2.45 percent to 24,839.65 at the Xetra close, the Stoxx Europe 600 down 1.89 percent to 626.34, Paris's CAC 40 down 1.89 percent to 7,927.75, Madrid's IBEX 35 down 1.63 percent to 18,873.10 and London's FTSE 100 down 1.02 percent to 10,346.34. These are settled closing levels.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="europe-friday-20pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="756" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">MARKETS · EUROPE</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Friday close: MDax down 2.54%, DAX 2.45%, London 1.02%</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-se