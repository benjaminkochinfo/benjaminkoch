<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1274" width="960" height="1274" role="img" aria-labelledby="us-301-caps-25nov-pm-t us-301-caps-25nov-pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="us-301-caps-25nov-pm-t">Proposed caps: Vietnam 35%, India 25%, China 20%, EU 15%</title><desc id="us-301-caps-25nov-pm-d">Bar chart of the maximum additional US tariffs proposed on 25 November 2026 under Section 301 for 14 economies: Vietnam up to 35 percent, India up to 25 percent, China and Singapore up to 20 percent, Bangladesh, Cambodia, Indonesia, Malaysia and Thailand up to 18 percent, and the European Union, Japan, Korea, Switzerland and Taiwan up to 15 percent. These are proposals open for comment, with exemptions, netted against some existing duties; none is in force.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="us-301-caps-25nov-pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="1274" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">GEOECONOMICS · TARIFFS</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Proposed caps: Vietnam 35%, India 25%, China 20%, EU 15%</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" f