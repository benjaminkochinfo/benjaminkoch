<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="ledger-brent-2026-t ledger-brent-2026-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ledger-brent-2026-t">A year in one barrel</title><desc id="ledger-brent-2026-d">Line chart of the daily Brent spot price from December 2025. It trades between about $60 and $73 until the end of February 2026, then jumps after the strikes on Iran to $126.69 at the end of March and a peak of $138.21 on 7 April, the day of the ceasefire. It falls to $68.53 in early July after the June memorandum, climbs again to above $120 in mid-September after the Saudi pipeline is hit, and is $126.55 on 14 October. Latest values: Brent spot 126.55 (2026-10-14).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ledger-brent-2026-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">THE 2026 LEDGER · ENERGY</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">A year in one barrel</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Brent, daily EIA spot price, US$ per barrel</text><line x1="32" x