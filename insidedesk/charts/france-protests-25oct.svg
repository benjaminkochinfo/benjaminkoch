<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="france-protests-25oct-t france-protests-25oct-d" class="desk-plate" style="max-width:100%;height:auto"><title id="france-protests-25oct-t">Fewer marchers, fewer marches, more than twice the arrests</title><desc id="france-protests-25oct-d">Bar chart comparing France's second Saturday of cost-of-living protests, 24 October 2026, with the first, 17 October, set at 100, using Interior Ministry figures as reported by franceinfo, TF1 Info and BFMTV. Marchers fell from 550,000 to 410,000, or 74.5. Actions fell from 430 to 289, or 67.2. Arrests by early evening rose from 385 to almost 1,000, or about 260, a figure the minister said would rise. The CGT union counted 800,000 marchers on both days.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="france-protests-25oct-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="506" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">SECURITY · FRANCE</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Fewer marchers, fewer marches, more than twice the arrests</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Saturday 24 Oct 2026 as a percentage of Saturday 17 Oct (= 100), Interior Ministry figures as reported</text><line x1="32.0" x2="32.0" y1="134" y2="422" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">100</text><line x1="570.7" x2="570.7" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">200</text><line x1="840.0" x2="840.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">300</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Saturday 17 October (reference)</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">= 100</text><rect x="32" y="162" width="269.3" height="26" rx="2" fill="#F2A93B"/><text x="311.3" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">100.0</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Marchers: 550,000 → 410,000</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">CGT: 800,000 both days</text><rect x="32" y="236" width="200.7" height="26" rx="2" fill="url(#france-protests-25oct-hatch)" stroke="#F2A93B" stroke-width="1.2"/><text x="242.7" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">74.5</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Actions: 430 → 289</text><rect x="32" y="310" width="181.0" height="26" rx="2" fill="url(#france-protests-25oct-hatch)" stroke="#F2A93B" stroke-width="1.2"/><text x="223.0" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">67.2</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Arrests by early evening: 385 → almost 1,000</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">&quot;almost 1,000&quot;, expected to rise</text><rect x="32" y="384" width="699.5" height="26" rx="2" fill="url(#france-protests-25oct-hatch)" stroke="#F2A93B" stroke-width="1.2"/><text x="741.5" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">259.7</text><line x1="32" x2="928" y1="462" y2="462" stroke="rgba(236,231,220,0.11)"/><text x="32" y="484" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>French Interior Ministry figures as reported by franceinfo, TF1 Info and BFMTV, 24 Oct 2026 · ratios: desk arithmetic (1,000 used for &quot;almost 1,000&quot;)</text><rect x="820" y="475" width="8" height="8" fill="#F2A93B"/><text x="928" y="484" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>