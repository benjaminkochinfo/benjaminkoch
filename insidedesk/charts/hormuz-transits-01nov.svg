<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="hormuz-transits-01nov-t hormuz-transits-01nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="hormuz-transits-01nov-t">October's ships, counted one week at a time</title><desc id="hormuz-transits-01nov-d">Line chart of weekly Strait of Hormuz transits reported by UKMTO, from the overview dated 2 October to the one dated 30 October 2026. All transits go 247, 275, 254, 241 and 277, the latest value and the highest of the five weeks. Inbound transits go 123, 146, 129, 127 and 155, the latest value. Outbound transits go 124, 129, 125, 114 and 122, the latest value. UKMTO describes the latest week as approximately 70% below pre-conflict levels. Latest values: All transits 277 (2026-10-30); Inbound 155 (2026-10-30); Outbound 122 (2026-10-30).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="hormuz-transits-01nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="568" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">GEOECON · STRAIT OF HORMUZ</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">October's ships, counted one week at a time</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Combined Strait of Hormuz transits in seven days (AIS-observed plus US-stated facilitated), by UKMTO weekly overview, reports dated 2</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Oct to 30 Oct 2026</text><line x1="32" x2="792" y1="476.0" y2="476.0" stroke="rgba(236,231,220,0.11)"/><text x="32" y="470.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">100</text><line x1="32" x2="792" y1="397.0" y2="397.0" stroke="rgba(236,231,220,0.11)"/><text x="32" y="391.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">150</text><line x1="32" x2="792" y1="318.0" y2="318.0" stroke="rgba(236,231,220,0.11)"/><text x="32" y="312.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">200</text><line x1="32" x2="792" y1="239.0" y2="239.0" stroke="rgba(236,231,220,0.11)"/><text x="32" y="233.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">250</text><line x1="32" x2="792" y1="160.0" y2="160.0" stroke="rgba(236,231,220,0.11)"/><text x="32" y="154.0" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE" paint-order="stroke" stroke="#0D1015" stroke-width="5" stroke-linejoin="round">300</text><path d="M32.0,243.7L222.0,199.5L412.0,232.7L602.0,253.2L792.0,196.3" fill="none" stroke="#F2A93B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle c