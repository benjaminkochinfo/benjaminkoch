<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-power-day-ahead-11pm-t de-power-day-ahead-11pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-11pm-t">Thursday at €199.05: the lowest delivery day since 27 October</title><desc id="de-power-day-ahead-11pm-d">Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 12 November 2026, in euros per megawatt hour. It falls to €13.12 on Sunday 25 October, climbs to €314.85 on Thursday 29 October, stays between €242.13 and €275.64 from 2 to 8 November, then reaches €345.64 on 9 November and a record €351.48 on 10 November. Wednesday 11 November is €316.65. The latest value is €199.05 for delivery on Thursday 12 November, €117.60 below Wednesday and the lowest delivery day since €155.12 on Tuesday 27 October. Latest values: Day-ahead DE-LU 199.05 (2026-11-12).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-11pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Thursday at €199.05: the l