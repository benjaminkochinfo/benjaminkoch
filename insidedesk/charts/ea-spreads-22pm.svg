<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="ea-spreads-22pm-t ea-spreads-22pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="ea-spreads-22pm-t">Every spread widened, France most</title><desc id="ea-spreads-22pm-d">Bar chart of 10-year bond spreads over German Bunds on the morning of 22 October 2026, as reported by Reuters: France 173.58 basis points, its widest since November 2011; Italy 123; Belgium 111.28, its highest since 2012; Greece 102; Spain 71. All five widened on the day.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="ea-spreads-22pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="580" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MONEY · PODIUM VS PRINT</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Every spread widened, France most</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">10-year government bond yield premium over German Bunds, basis points, Thursday 22 Oct 2026 (morning, as reported)</text><line x1="32.0" x2="32.0" y1="134" y2="496" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="514" text-anchor="middle" font-f