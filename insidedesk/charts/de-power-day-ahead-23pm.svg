<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-power-day-ahead-23pm-t de-power-day-ahead-23pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-day-ahead-23pm-t">Friday cleared a third below Wednesday, in a dear October</title><desc id="de-power-day-ahead-23pm-d">Line chart of the daily average German-Luxembourg day-ahead electricity price since July 2025, in euros per megawatt hour. Prices stay mostly between about €77 and €110 a month through July 2026, with a daily low of −€16.34 on 5 April 2026. They climb from August, average €144.82 in September with a daily high of €256.55 on 14 September, and average €167.60 over 1 to 23 October 2026, against €94.97 over the same days of 2025. The latest value, for delivery on Friday 23 October 2026, is €137.59, down from €148.61 on Thursday and €211.94 on Wednesday. Latest values: Day-ahead DE-LU 137.59 (2026-10-23).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-day-ahead-23pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Friday cleared a t