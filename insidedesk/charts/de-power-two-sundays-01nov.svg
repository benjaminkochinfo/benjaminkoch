<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="de-power-two-sundays-01nov-t de-power-two-sundays-01nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-power-two-sundays-01nov-t">€13.12 last Sunday, €255.91 this one</title><desc id="de-power-two-sundays-01nov-d">Line chart of the daily average German-Luxembourg day-ahead electricity price for the two weeks from 19 October to 1 November 2026, in euros per megawatt hour. In the first week it falls from €208.44 on Monday 19 October to €30.12 on Saturday 24 October and €13.12 on Sunday 25 October, during the storm. In the second week it climbs to €314.85 on Thursday 29 October, then holds at €268.62 on Friday and €251.42 on Saturday. The latest value is €255.91 for delivery on Sunday 1 November. Latest values: Day-ahead DE-LU 255.91 (2026-11-01).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-power-two-sundays-01nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">ENERGY · POWER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">€13.12 last Sunday, €255.91 this one</text><text x="32" y="94" font-family="'Familjen Grote