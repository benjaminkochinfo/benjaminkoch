<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 728" width="960" height="728" role="img" aria-labelledby="madeira-rain-6h-11nov-t madeira-rain-6h-11nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="madeira-rain-6h-11nov-t">Madeira's night under Charles: seven stations past the red line</title><desc id="madeira-rain-6h-11nov-d">Bar chart of the highest six-hour rainfall totals at seven Madeira weather stations during Storm Charles, IPMA data up to 03:00 local time (04:00 CET) on 11 November 2026, per DNOTICIAS.PT: Chão do Areeiro 232.1 mm, São Vicente 141.5 mm, Santo da Serra 130.4 mm, Pico do Areeiro 123.9 mm, Pico Alto 116.7 mm, Monte 83.6 mm and Prazeres in Calheta 70.8 mm. All seven are above IPMA's red-warning threshold of 60 mm in six hours. Chão do Areeiro also recorded 323.8 mm in 12 hours.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="madeira-rain-6h-11nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="728" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE · STORM CHARLES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">Madeira's night under Charles: seven stations past the red line</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', 