<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 682" width="960" height="682" role="img" aria-labelledby="europe-week-15nov-t europe-week-15nov-d" class="desk-plate" style="max-width:100%;height:auto"><title id="europe-week-15nov-t">DAX +3.60%, Stoxx 600 +2.44%: best week since July</title><desc id="europe-week-15nov-d">Bar chart of weekly percentage changes to Friday 13 November 2026: DAX up 3.60 percent, CAC 40 up 2.82, S&amp;P 500 up 2.51, Stoxx Europe 600 up 2.44 to a record close of 664.14, FTSE 100 up 2.14, and Brent crude down 2.52 percent to $95.84 a barrel. Source: Dow Jones Market Data via Morningstar.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="europe-week-15nov-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="682" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">MARKETS · THE WEEK</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">DAX +3.60%, Stoxx 600 +2.44%: best week since July</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">Weekly percentage change to the close on Friday 13 November 2026, selected indexes and Brent crude; Stoxx 600 and DAX had their</text><text x="32" y="114" font-family="'Familjen Grotes