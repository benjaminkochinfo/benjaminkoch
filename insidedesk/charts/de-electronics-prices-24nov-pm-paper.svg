<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 904" width="960" height="904" role="img" aria-labelledby="de-electronics-prices-24nov-pm-t de-electronics-prices-24nov-pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="de-electronics-prices-24nov-pm-t">Hard drives up 40.8%, notebooks 14.9%, all prices 2.8%</title><desc id="de-electronics-prices-24nov-pm-d">Bar chart of the change in German consumer prices for electronic products from October 2025 to October 2026: hard drives up 40.8 percent, storage media and USB sticks up 22.1 percent, notebooks up 14.9 percent, desktop PCs up 13.1 percent, games consoles up 13.0 percent, mobile phones without contract up 12.2 percent, wearables up 6.1 percent and e-book readers and digital picture frames up 0.2 percent, against 2.8 percent for all consumer prices. Televisions fell 9.2 percent, cameras 2.5 percent and audio equipment 0.9 percent; falls are not drawn.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="de-electronics-prices-24nov-pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#A45A00" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="904" rx="14" fill="#FFFCF6"/><rect x="32" y="22" width="36" height="3" fill="#A45A00"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#A45A00">ORDINARY LIFE · PRICES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#1A1A1D">Hard drives up 40.8%, notebooks 14.9%, all prices 2.8%</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">Change in consumer prices, October 2026 against October 2025, %, Germany; rises only shown. Televisions (−9.2%), cameras (−2.5%) and</text><text x="32" y="114" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4F57">audio equipment (−0.9%) got cheaper</text><line x1="32.0" x2="32.0" y1="162" y2="820" stroke="rgba(28,26,22,0.30)"/><text x="32.0" y="838" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">0</text><line x1="301.3" x2="301.3" y1="162" y2="820" stroke="rgba(28,26,22,0.12)"/><text x="301.3" y="838" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">20</text><line x1="570.7" x2="570.7" y1="162" y2="820" stroke="rgba(28,26,22,0.12)"/><text x="570.7" y="838" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">40</text><line x1="840.0" x2="840.0" y1="162" y2="820" stroke="rgba(28,26,22,0.12)"/><text x="840.0" y="838" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4A4F57">60</text><text x="32" y="180" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Hard drives</text><rect x="32" y="190" width="549.4" height="26" rx="2" fill="#A45A00"/><text x="591.4" y="209" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A45A00">40.8%</text><text x="32" y="254" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Storage media, USB sticks</text><rect x="32" y="264" width="297.6" height="26" rx="2" fill="#0A7564"/><text x="339.6" y="283" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#0A7564">22.1%</text><text x="32" y="328" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Notebooks</text><rect x="32" y="338" width="200.7" height="26" rx="2" fill="#C2401B"/><text x="242.7" y="357" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C2401B">14.9%</text><text x="32" y="402" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Desktop PCs</text><rect x="32" y="412" width="176.4" height="26" rx="2" fill="#6A4FC9"/><text x="218.4" y="431" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#6A4FC9">13.1%</text><text x="32" y="476" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Games consoles</text><rect x="32" y="486" width="175.1" height="26" rx="2" fill="#3F4752"/><text x="217.1" y="505" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#3F4752">13.0%</text><text x="32" y="550" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Mobile phones (no contract)</text><rect x="32" y="560" width="164.3" height="26" rx="2" fill="#1F5FAF"/><text x="206.3" y="579" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#1F5FAF">12.2%</text><text x="32" y="624" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">Wearables</text><rect x="32" y="634" width="82.1" height="26" rx="2" fill="#A45A00"/><text x="124.1" y="653" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A45A00">6.1%</text><text x="32" y="698" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">All consumer prices (CPI)</text><rect x="32" y="708" width="37.7" height="26" rx="2" fill="#0A7564"/><text x="79.7" y="727" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#0A7564">2.8%</text><text x="32" y="772" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#1A1A1D">E-readers, digital frames</text><rect x="32" y="782" width="2.7" height="26" rx="2" fill="#C2401B"/><text x="44.7" y="801" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#C2401B">0.2%</text><line x1="32" x2="928" y1="860" y2="860" stroke="rgba(28,26,22,0.12)"/><text x="32" y="882" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#4A4F57"><tspan fill="#62676F">SOURCE </tspan>Statistisches Bundesamt (Destatis), consumer price index, press release of 24 Nov 2026 as reported by…</text><rect x="820" y="873" width="8" height="8" fill="#A45A00"/><text x="928" y="882" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#1A1A1D">INSIDE DESK</text></svg>