<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="us-cpi-monthly-10pm-t us-cpi-monthly-10pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="us-cpi-monthly-10pm-t">A smaller rise is still a rise</title><desc id="us-cpi-monthly-10pm-d">Line chart of the monthly change in the US consumer price index, seasonally adjusted, from April to October 2026. All items rose 0.6% in April, 0.5% in May, fell 0.4% in June, then rose 0.1% in July, 0.4% in August and 0.6% in September. Core prices, excluding food and energy, rose 0.4%, 0.2%, 0.0%, 0.2%, 0.3% and 0.3% over the same months. In October 2026, the latest value, all items rose 0.4% and core rose 0.3%, a third straight 0.3% core reading. Latest values: All items 0.4% (2026-10); Less food and energy 0.3% (2026-10).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="us-cpi-monthly-10pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">MARKETS · PRICES</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">A smaller rise is still a rise</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="1