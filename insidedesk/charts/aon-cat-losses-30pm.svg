<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="aon-cat-losses-30pm-t aon-cat-losses-30pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="aon-cat-losses-30pm-t">A cheaper year for insurers, not for everyone</title><desc id="aon-cat-losses-30pm-d">Bar chart of worldwide natural-catastrophe losses for January to September, in US dollars. Insured losses in 2026 were an estimated 91 billion, against a 21st-century average of 88 billion and a past-five-year average of 135 billion. Economic losses in the same nine months of 2026, the latest figure, were about 204 billion.</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="aon-cat-losses-30pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="506" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · CATASTROPHE LEDGER</text><text x="32" y="66" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-weight="600" font-size="30" fill="#ECE7DC">A cheaper year for insurers, not for everyone</text><text x="32" y="94" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA3AE">Natural-catastrophe losses worldwide, January–September, US$ billion · Aon Global Catastrophe Recap, Q3 2026</text><line x1="32.0" x2="32.0" y1="134" y2="422" stroke="rgba(236,231,220,0.28)"/><text x="32.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">0</text><line x1="301.3" x2="301.3" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="301.3" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">100</text><line x1="570.7" x2="570.7" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="570.7" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">200</text><line x1="840.0" x2="840.0" y1="134" y2="422" stroke="rgba(236,231,220,0.11)"/><text x="840.0" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9AA3AE">300</text><text x="32" y="152" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Insured losses, Jan–Sep 2026</text><text x="928" y="152" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Aon</text><rect x="32" y="162" width="245.1" height="26" rx="2" fill="#F2A93B"/><text x="287.1" y="181" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#F2A93B">91.0 bn</text><text x="32" y="226" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Insured, 21st-century average</text><text x="928" y="226" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Aon</text><rect x="32" y="236" width="237.0" height="26" rx="2" fill="#4CC9B0"/><text x="279.0" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#4CC9B0">88.0 bn</text><text x="32" y="300" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Insured, average of past five years</text><text x="928" y="300" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Aon</text><rect x="32" y="310" width="363.6" height="26" rx="2" fill="#FF7A5C"/><text x="405.6" y="329" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#FF7A5C">135.0 bn</text><text x="32" y="374" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ECE7DC">Economic losses, Jan–Sep 2026</text><text x="928" y="374" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6B7480">Aon</text><rect x="32" y="384" width="549.4" height="26" rx="2" fill="#A99BFF"/><text x="591.4" y="403" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#A99BFF">204.0 bn</text><line x1="32" x2="928" y1="462" y2="462" stroke="rgba(236,231,220,0.11)"/><text x="32" y="484" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9AA3AE"><tspan fill="#6B7480">SOURCE </tspan>Aon, Global Catastrophe Recap: Third Quarter of 2026 (press release, Dublin, 29 Oct 2026), estimates in US dollars; retrieved 30 Oct 2026 · Early estimates, subject to revision.</text><rect x="820" y="475" width="8" height="8" fill="#F2A93B"/><text x="928" y="484" text-anchor="end" font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#ECE7DC">INSIDE DESK</text></svg>