<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="kaub-month-below-2018-22pm-t kaub-month-below-2018-22pm-d" class="desk-plate" style="max-width:100%;height:auto"><title id="kaub-month-below-2018-22pm-t">A month below the 2018 low</title><desc id="kaub-month-below-2018-22pm-d">Line chart of the Rhine water level at the Kaub gauge from 22 September to 22 October 2026, as daily means of 15-minute readings in centimetres above the gauge zero, against a flat line at 25 cm, the lowest daily reading of the 2010–2020 reference period, set on 22 October 2018. All 31 daily means sit below that line. The level falls from 12.6 cm on 22 September to below zero on five days, with a daily mean of −4.8 cm on 1 October and a lowest reading of −6 cm that morning, recovers to 19.7 cm on 13 October, dips to 8.8 cm on 18 October and stands at 18.2 cm on 22 October, to 16:15, with a last reading of 17 cm. Latest values: Kaub, daily mean 18.2 cm (2026-10-22); Lowest daily reading 2010–2020 (25 cm, 22 Oct 2018) 25 cm (2026-10-22).</desc><defs><style>@font-face{font-family:Newsreader;font-weight:600;src:url(../assets/fonts/newsreader-disp.woff2) format("woff2")}@font-face{font-family:"Familjen Grotesk";src:url(../assets/fonts/familjen.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(../assets/fonts/jetbrains-mono.woff2) format("woff2")}</style><pattern id="kaub-month-below-2018-22pm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" stroke="#F2A93B" stroke-width="2.2" opacity=".9"/></pattern></defs><rect width="960" height="540" rx="14" fill="#0D1015"/><rect x="32" y="22" width="36" height="3" fill="#F2A93B"/><text x="80" y="27" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#F2A93B">CLIMATE &amp; WEATHER · RHINE</text><text x="