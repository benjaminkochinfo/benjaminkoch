title: "The bill for pipes and the price of a promise"
standfirst: "UNEP puts what developing countries need for adaptation at about $305bn a year by 2035, against roughly $30bn of international public money sent. Elsewhere: the Bank of England raises to 4% and says not to assume a series, a record for the DAX, German factory orders up 4.4%, Friday's power at €275.64, and a third day of bomb hoaxes on European flights."
closing:
  title: Before you close the tab
  published: "2026-11-05T17:30:04+01:00"
  habit:
    text: 'When a big story breaks, pick one and read the original before the reactions: the statement itself, the minutes, the press release. Today''s Bank of England summary is a few short paragraphs [2]. Five commentaries tell you how people feel; the source tells you what was actually said, and it is usually calmer than the noise around it.'
    note: A habit, not advice.
  went_right:
    text: 'A species that falls below 50 animals in the wild is not doomed, and a study published this week counts why [1]. Researchers from Monash University and the Zoological Society of London looked at every bird and mammal known to have dropped below 50 wild individuals since 1950, and tracked 141 species in detail [1]. Of the 51 that got direct help, such as predator control, habitat restoration, captive breeding or moving animals to safer sites, 61% recovered to at least 100 individuals; of those left alone, only 2% did, and 37% went extinct [1]. Australia''s Lord Howe woodhen went from 23 birds in the late 1970s to more than 1,600 today [1]. "Abandoning critically endangered species because their numbers look too low is a mistake," said Professor Rohan Clarke [1]. Small numbers are a warning, not a verdict.'
  sentence: "The Bank of England raised its interest rate for the first time in more than three years, to 4%, because dearer energy is pushing up prices, and it says the next step is not fixed."
  euros:
    text: 'A litre of Super E10 cost on average €2.041 in Germany, 4.3 cents less than a week earlier, and a litre of diesel €2.260, down 2.9 cents, the ADAC reported on Wednesday [3]. Brent crude closed on Tuesday at about $104 a barrel, roughly $10 lower than a week before, and the ADAC expects room for further falls at the pump [3]. Late in the morning, shortly before the daily price rise at 12:00, the national E10 average briefly dipped below €2 [3]. Desk arithmetic: a 50-litre tank of E10 costs about €102 at that average, about €2.15 less than last week; the same tank of diesel costs about €113, about €1.45 less, and about €11 more than E10. Small, but heading the right way.'
    note: Desk arithmetic on ADAC national averages published 4 Nov 2026. Prices at your station differ by region, brand and time of day. Nothing here is advice.
  small_words:
    term: Second-round effects
    text: 'What happens when a price shock stops being only about that one price [2]. The first round is direct: energy costs more, so bills and fuel cost more. The second round is when firms raise their other prices and workers ask for higher pay to keep up, and those rises keep inflation high even after energy calms down [2]. The Bank of England says there is still limited evidence of this so far, but that the risk has grown; that risk is the main reason it raised rates today [2].'
