closing:
  title: "Before you close the tab"
  published: "2026-10-22T08:30:00+02:00"
  habit:
    text: "This week, when a company you know reports its quarter, skip the headline and find two lines in its own release: the cash its operations brought in and what it spent on buildings and equipment. Meta's release, for example, puts them side by side: $32.79 billion in, $34.91 billion out [1]. Two numbers from the source make the next day's commentary easier to weigh."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "Nigeria's Ebola contact tracing is closing files, not only opening them. Ogun State said it had recorded no Ebola case as of 21 October, and 111 people under watch completed their monitoring period and were discharged; in Anambra, 33 of 40 contacts completed monitoring and were cleared, with seven still followed up [2]. Monitoring periods that end on schedule are what containment looks like when it works."
  sentence: "A single remark moved Tesla's shares more than its quarter did, Meta spent more on data centres than its business brought in, and on Thursday the wind came back and cut Germany's wholesale power price by almost a third."
  euros:
    text: "Heating oil cost €173.38 per 100 litres on Thursday's German average for a 3,000-litre order, unchanged on the day, €3.00 more than a week ago and €40.16 more than three months ago [3]. Desk arithmetic: a 3,000-litre delivery costs about €5,201 today, some €1,205 more than the same order in July."
    note: "Desk arithmetic on the cited average price. Local prices differ by region, quantity and supplier. Nothing here is advice."
  small_words:
    term: "Free cash flow"
    text: "The cash a business's operations bring in, minus what it spends on buildings and equipment. It is what is left to pay dividends, buy back shares or save. Meta's was minus $2.12 billion in the third quarter: $32.79 billion in, $34.91 billion spent, against plus $10.63 billion a year earlier [1]."
