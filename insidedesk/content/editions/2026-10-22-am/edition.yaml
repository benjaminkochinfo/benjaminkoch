title: "Read the release before the reaction."
standfirst: "A merger remark lifted Tesla before its quarter did, and companies that beat their forecasts fell anyway. Meta spent more on buildings than it brought in, and the wind came back to Germany's power auction. Eleven desks, every number sourced."
