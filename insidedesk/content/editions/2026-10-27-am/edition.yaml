closing:
  title: Before you close the tab
  published: '2026-10-27T08:30:00+01:00'
  habit:
    text: 'This week, before you forward any claim about an election, a price or a war, find the one number it rests on and write it next to the claim. If there is no number, wait a day. Today''s example:
      about 35,000 late votes in Brazil, set against a margin of 4.4 million [4]. Most outrage shrinks when it meets its own denominator.'
    note: A habit, not advice.
  went_right:
    text: Libya says the UN aviation agency has lifted restrictions on its airspace imposed in 2015, during the civil war. The transport ministry reported 61,968 flight permits a month for the November
      2026 to March 2027 winter season, against an average of 2,000 monthly transit flights the winter before [1]. Eleven years after the planes went round it, a country's sky is open to them again.
  sentence: 'Israel votes today with no bloc near a majority, Bolsonaro''s own party accepted the Brazilian count, and a US court left 20,000 ballots in the pile: on three continents, the counting held.'
  euros:
    text: 'Heating oil averages €174.58 per 100 litres in Germany this morning for a 3,000-litre order, unchanged on the day, €0.76 above a week ago and €43.30 above three months ago [2]. A litre holds
      about 10 kilowatt hours of heat, which HeizOel24 turns into roughly 17.46 cents per kilowatt hour, a figure you can lay directly beside the price per kilowatt hour on a gas bill [2]. Desk arithmetic:
      a 2,000-litre order at today''s average costs about €3,492, some €866 more than at the price of three months ago.'
    note: Desk arithmetic on the cited average price. Local prices differ by region, quantity and supplier. Nothing here is advice.
  small_words:
    term: Electoral threshold
    text: 'The minimum share of the national vote a party needs to win any seats at all. In Israel it is 3.25%. One joint list averaged 3.10% in the final four polls, just 0.15 points short [3]: a few thousand
      votes either side of the line can decide which coalitions are even possible.'
