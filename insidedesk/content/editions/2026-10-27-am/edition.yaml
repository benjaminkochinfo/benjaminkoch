title: A vote decides who sits in the room; the counting decides whether anyone believes it.
standfirst: Israel votes today with no bloc near a majority, and in Brazil the loser's own party accepted the count. Seoul bought on its growth print, the US two-year sits at 4.68% before Wednesday's Fed,
  and German power is back at €155 once the storm moved on. Eleven desks, every number sourced.
