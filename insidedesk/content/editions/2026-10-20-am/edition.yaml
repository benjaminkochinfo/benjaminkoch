closing:
  title: "Before you close the tab"
  published: "2026-10-20T08:30:00+02:00"
  habit:
    text: "This week, before any journey in rough weather, open your national weather service's warning map once and note the colour where you are going, not just where you are. Ten seconds. If it is orange, think about bridges and underpasses on the way rather than the sky above you."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "Germany's grid ran mostly on renewables this year. Fraunhofer ISE's Energy-Charts reports 215 TWh of renewable public net generation in the first three quarters of 2026 against 120 TWh from fossil sources, covering 62.1% of grid load [1] — up from 35.2% in the same months of 2015 [2]. Solar panels alone fed in more than 76 TWh, 21% more than a year earlier [3]. That is not a pledge. It is metered electricity."
  sentence: "Southern France was warned of worse rain than came, and the closed bridges were the point; Paris read its curfew orders, oil waited near $110, and Parliament booked its questions."
  euros:
    text: "At 05:12 on Tuesday, the national average for a litre of Super E10 at open German stations was €2.089, from the official price-reporting data; Hessen averaged €2.139 and Baden-Württemberg €2.049 [4]. Desk arithmetic: that 9-cent gap comes to €4.50 on a 50-litre tank. The ADAC motoring club says prices are lowest shortly before 12:00 and rise sharply at noon [5], so the hour you fill up can matter about as much as where you live."
    note: "Desk arithmetic on the cited averages. This is an early-morning snapshot; prices change through the day. Nothing here is advice."
  small_words:
    term: "Vigilance orange"
    text: "Météo-France's warning colours run from yellow to orange to red. Orange means dangerous weather is forecast: keep informed and follow the safety advice from the authorities. Red is kept for phenomena of exceptional intensity [6]. On Tuesday morning nine départements were orange and none red [6]. The colour is a timetable for behaviour, not a forecast of disaster."
