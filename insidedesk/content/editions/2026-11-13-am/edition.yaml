title: "Minus 14%, then minus 4.3%: Nvidia loses its founder, and the market keeps its nerve"
standfirst: "Jensen Huang resigned and Nvidia's rivals rose; the heavier move was a ten-year Treasury yield back above 5.1%. Also: a budget settled after 3am, a pipeline around Hormuz under fire, wind that kept its word on your power price, drought in the Mid-South and an antibiotic-resistance ledger that slows but does not turn."
closing:
  title: Before you close the tab
  published: '2026-11-13T08:30:00+01:00'
  habit:
    text: 'This weekend, when the heating is on anyway, look at the small device on
      each radiator and note what it shows: a display, a number, or only a sealed
      glass tube. Write the readings on the back of last year''s heating statement.
      It takes five minutes, and when the next statement arrives you will be reading
      it against your own notes rather than against a feeling.'
    note: A habit, not advice.
  went_right:
    text: At Culbin Forest in Moray, 18 volunteers have moved 3,400 one-flowered wintergreens,
      one of Britain's rarest wildflowers, away from a shoreline where 2 to 3 metres
      of land had collapsed into the sea [1]. In the UK the plant survives at just
      seven sites, only three of them with healthy populations, according to Plantlife
      Scotland [1]. Volunteers cut out whole sections of soil so the fungi the plant
      depends on travelled with it [1]. "Any survival will be a success," said Iain
      Macdonald of NatureScot [1]. The money came from the Scottish government's nature
      restoration fund [1]. A spade, a soil block and a public fund are not glamorous;
      they are how a species gets a second address.
  sentence: A founder resigned in an afternoon, the bond market moved more than the
    chip index, and the budget committee worked past 3am; on Friday the weight sat with
    the dull numbers.
  euros:
    text: 'By the end of 2026 most heat cost allocators in buildings with central
      heating or hot water and at least two flats must be readable remotely; from
      1 January 2027 that is mandatory for the majority of such buildings, the Verbraucherzentrale
      Bayern says [2]. If the remote-readable devices are missing, tenants may cut
      the consumption-based share of their heating bill by 3%, and by a further 3%
      if the required monthly consumption information is missing or incomplete; the
      two cuts can be combined [2]. The statement must also arrive no later than
      twelve months after the billing period ends [2]. Desk arithmetic: on every
      €100 of consumption-based heating costs, the two cuts together come to €6.'
    note: Rules as summarised by Verbraucherzentrale Bayern on 4 Nov 2026; your
      statement and building decide what applies. Nothing here is advice.
  small_words:
    term: Heizkostenverteiler (heat cost allocator)
    text: The small device on a radiator that records how much of the building's
      heat that radiator used, so the bill can be split by use rather than by floor
      space alone [2].  A remote-readable one sends its figures without anyone ringing your doorbell.
  sources:
