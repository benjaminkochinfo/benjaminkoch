title: "The week was written in ship counts"
standfirst: "Speeches about Hormuz filled the week; the paperwork counted 277 transits, a contract that expired $4.21 above its successor, and two central banks that held and pointed at December. November opens with a heating bill worth reading."
closing:
  title: "Before you close the tab"
  published: "2026-11-01T10:15:46+01:00"
  habit: {text: "The heating season starts in earnest this month. Once this week, find your gas or electricity contract and write three things on one sheet of paper: the price per kilowatt-hour, the monthly base charge and the date the price guarantee ends. Put the sheet where the post arrives. When a letter about new prices comes, you will already know what you are comparing.", note: "A habit, not advice."}
  went_right: {text: "Deutsche Bahn's family ticket was meant to be a summer-holiday offer. Demand was high enough that from 1 November it is permanent: €99.99 for a return journey for up to five people, with an ICE seat reservation included [1]. A good idea was tried, people used it, and it stayed. That is how public services are supposed to learn."}
  sentence: "Shares rose three days on a prospectus and fell two on the accounts, two central banks held and pointed at December, and at home November opened with a dearer parcel, a cheaper family train and a heating bill worth reading."
  euros: {text: "Verivox puts a new gas contract at about 14 cents per kilowatt-hour for a household using 20,000 kWh a year, as of 30 October; the average across all customers was about 12.7 cents on 1 October [2]. Desk arithmetic: at 14 cents that household pays €2,800 a year, at 12.7 cents €2,540, so the gap between a new contract and the average one is about €260 a year, or roughly €22 a month.", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Hawkish pause", text: "When a central bank leaves interest rates where they are but makes clear it may raise them soon, markets call it a hawkish pause. The ECB did that on Thursday: no change, but its president said a hike had been discussed and the direction was clear. The pause is real; so is the warning that comes with it."}
  sources:
    - {n: 1, title: "PayPal, Pakete, Bahn: Wichtige Änderungen kommen im November 2026", publisher: "t-online", url: "https://www.t-online.de/finanzen/aktuelles/verbraucher/id_101499292/paypal-bahn-pakete-das-aendert-sich-im-november-2026.html", date: "1 Nov 2026, 03:00 CET"}
    - {n: 2, title: "Gaspreise vergleichen", publisher: "Verivox", url: "https://www.verivox.de/gas/gaspreise/", date: "as of 30 Oct 2026, retrieved 1 Nov 2026"}
