title: Ten per cent off the Nasdaq in a week, and $81 billion still waiting to be paid
standfirst: 'The worst week for American shares since April 2025 made the noise, and the chip makers took most of it. Underneath, the dull machinery kept printing: Nvidia''s receivables, a Brent price down for a third week, cheaper petrol at the pump, Antalya''s paper and the rules for your next pension. This Sunday reads the invoices, not the speeches.'
closing:
  title: Before you close the tab
  published: '2026-11-22T10:00:00+01:00'
  habit: {text: 'Before the first Advent candle next Sunday, gather every annual statement that has arrived this year, the pension letter, the insurance renewals, the bank''s fee notice, into one folder. Do not read them yet, and do not act on any of them. The point is only that, when January''s offers arrive, the paper they are meant to replace is already in one place.', note: 'A habit, not advice.'}
  went_right: {text: 'Guyana has been validated by the World Health Organization as having eliminated mother-to-child transmission of HIV and syphilis as public health problems, for the period 2022 to 2025 [1]. WHO Director-General Tedros Adhanom Ghebreyesus confirmed it to Guyana''s health minister in a letter dated 16 November, after the WHO''s Global Validation Advisory Committee assessed the country''s submission on 5 November; a regional team had reviewed programmes, laboratories and data in June [1]. The certification means elimination as a public health problem, not eradication, and Guyana will be reviewed again in 2030 [1]. Antenatal screening, timely treatment, laboratory records and a second inspection already in the diary: no ribbon to cut, just a system that kept working.'}
  sentence: The screens spent the week marking down chips; the quieter machinery spent it cutting four cents off a litre of petrol, validating a country's antenatal clinics and printing the rules for your next pension.
  euros: {text: 'ADAC''s weekly survey on Wednesday put Super E10 at €1.938 a litre on the national average, 4.0 cents less than a week earlier, and diesel at €2.181, 3.6 cents less [2]. Brent had risen by about two dollars over the same week, to around $93 a barrel, and ADAC still sees room for further cuts, especially for diesel, which it considers too dear compared with E10 [2]. Desk arithmetic: on a 50-litre tank, the weekly fall is about €2.00 for petrol and €1.80 for diesel; the gap between the two fuels is 24.3 cents a litre, or about €12 a tank. ADAC''s own habit for the forecourt: prices are lowest in the daily cycle shortly before noon [2].', note: Desk arithmetic on the cited figures.}
  small_words: {term: Bestandsschutz (grandfathering), text: 'When a rule changes, the people already inside the old rule are allowed to stay there. From 1 January no new Riester contracts can be signed, but existing ones run on unchanged, under the old subsidy system, for as long as their holders wish [3][4]. It is the law''s way of saying that a contract signed in good faith is not torn up by a reform; you may move, but nobody can make you.'}
