title: "€210.46 billion to borrow, a founder back by breakfast: Monday reads the fine print"
standfirst: "Budget week opens with Söder rebuffed by his own side; Nvidia takes back its founder and markets half a week. Also: €254.15 power, NATO on Poland's missiles, California's sea walls, a Podium vs Print."
closing:    # end-of-edition section, plain and warm; no mailbag
  title: "Before you close the tab"
  published: "2026-11-23T18:30:00+01:00"
  habit: {text: "In this first cold week, call one person over 80 you know and ask two dull questions: is the heating working properly, and when was your last jab? Write the answers down. Most winter emergencies are prevented by somebody asking early, not by somebody arriving late.", note: "A habit, not advice."}
  went_right: {text: "German factories are hiring again. In November's flash survey, manufacturing employment rose for the first time in almost three and a half years, ending what S&P Global calls the longest run of factory job cuts since its records began; firms cited piling order books and brighter prospects [1]. New orders across the private sector grew at the fastest pace in more than four and a half years [1]. Hiring is the dullest form of optimism, and the most reliable one."}
  sentence: "Nvidia got its founder back and markets got their nerve, while Berlin argued over €1.8 billion inside a €210 billion borrowing plan, and the frost arrived on time."
  euros: {text: "From 1 January the electricity tax falls from 2.05 to 0.1 cents a kilowatt hour for one year; Verivox puts the saving at about €35 a year for a single person using 1,500 kWh, €65 for two people using 2,800 kWh and €93 for three using 4,000 kWh [2]. Desk arithmetic: that is about €2.92, €5.42 and €7.75 a month. For comparison, Tuesday's wholesale power costs €254.15 a megawatt hour on average, about 25.4 cents a kilowatt hour before grid fees, taxes and margins [3].", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Spread", text: "The extra interest a government pays to borrow compared with a benchmark, usually Germany, measured in basis points (one basis point is 0.01 percentage points). On Monday France's ten-year bonds yielded 150 basis points, or 1.5 percentage points, more than Germany's [4]. A narrowing spread means lenders are a little less nervous."}
