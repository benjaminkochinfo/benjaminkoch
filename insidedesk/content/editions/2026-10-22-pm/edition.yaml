title: "The price is for the risk, not the barrel."
standfirst: "Oil rose on what might happen, not on what did. Germany paid more for power while burning less gas, Paris paid more than Washington to borrow, and the Rhine at Kaub has spent a month below its 2018 low. Eleven desks, every number sourced."
