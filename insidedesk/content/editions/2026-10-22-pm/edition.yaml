closing:
  title: "Before you close the tab"
  published: "2026-10-22T17:30:00+02:00"
  habit:
    text: "This weekend, write down one reading from your own home: the gas or electricity meter, or the level in the oil tank. Do it again next weekend. Tonight's edition is full of gauges, from the Rhine at Kaub to the spread on French bonds, and the one in your hallway is the only one that tells you about your own winter."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "Employers in the United States are still not letting people go. Initial claims for unemployment benefits fell to 194,000 in the week to 17 October, against 200,000 expected, close to the lowest levels since the late 1960s [1]. In a week of oil spikes and bond nerves, the dullest form in the system said the job you have is fairly safe."
  sentence: "Oil got dearer because of what might happen rather than what did, Germany paid more for power while burning less gas, and France now pays more than the United States to borrow."
  euros:
    text: "Heating oil cost €172.72 per 100 litres on Thursday's German average, 0.38% less than on Wednesday, €2.34 more than a week ago and €39.50 more than three months ago [2]. Desk arithmetic: a 3,000-litre delivery costs about €5,182 today, some €1,185 more than the same order three months ago."
    note: "Desk arithmetic on the cited average price. Local prices differ by region, quantity and supplier. Nothing here is advice."
  small_words:
    term: "Spread"
    text: "The extra interest one government pays over another to borrow for the same length of time, here measured against Germany. On Thursday France paid 173.58 basis points (1.7358 percentage points) more than Germany for ten-year money, the widest gap since November 2011 [3]. A basis point is a hundredth of a percentage point."
