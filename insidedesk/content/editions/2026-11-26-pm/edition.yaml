title: "A new name, an old warning: Thursday the ECB showed its hand"
standfirst: "Also: the DAX back above 25,000 without New York, a Podium vs Print on the EU budget, €301.82 for Friday power, Europe’s antibiotic midpoint, and a diesel tanker off Ibiza."
closing:
  title: "Before you close the tab"
  published: "2026-11-26T18:30:00+01:00"
  habit: {text: "This week, before you buy anything for a store cupboard, take one minute to look at what is already there and move the oldest tin to the front. Germany's civil protection office recommends buying food you regularly eat and using older supplies first, and the UK's Be Ready campaign suggests checking dates every six months [1]. It is calm, it is cheap, and it turns a worry into a routine.", note: "A habit, not advice."}
  went_right: {text: "Europe has already met one of its 2030 targets against antibiotic resistance years early: the incidence of MRSA bloodstream infections, according to the OECD and European Commission [2]. Veterinary antimicrobial sales fell 24% between 2018 and 2024, keeping a 50% reduction target broadly within reach [2]. Nobody held a press conference for the hand-washing. It worked anyway."}
  sentence: "The ECB got a new name and published an old warning, Europe bought back what it sold on Wednesday, and Friday's electricity costs a little more because it is cold."
  euros: {text: "Friday's wholesale electricity averages €301.82 a megawatt hour, about 30.2 cents a kilowatt hour before grid fees, taxes and margins, against €291.77 for Thursday [3]. Desk arithmetic: a household on a dynamic tariff that uses 8 kWh on Friday pays about €2.41 for the energy part at the day's average, against about €2.33 at Thursday's. Moving a 1 kWh dishwasher run from 08:15 (€426.32 per MWh) to 23:45 (€203.35) saves about 22 cents [3]. On a fixed tariff none of this changes your bill this week.", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Account", text: "The ECB's word for the minutes of a rate meeting, published about four weeks later without names attached to views. Thursday's account of the October meeting records that members wanted to signal 'another rate hike would likely be necessary unless the inflation outlook improved significantly' [4]. A press conference gives you the tone. The account gives you the argument."}
