title: "Ten ships in ten days, Brent at $91.62: the screen prices the talks, the strait still prices the war"
standfirst: "Oil fell overnight on hopes for diplomacy while Hormuz kept its count; the institutions keep the ledger either way. Also: a bond market back from its holiday, Asia buying chips, the budget committee's €25 a month, flu season starting on schedule, and Delhi's smog by the numbers."
closing:
  title: Before you close the tab
  published: '2026-11-12T08:30:00+01:00'
  habit:
    text: 'Write down every medicine you take on one card: name, strength, how often,
      and what it is for, plus any allergy. Put it in your wallet next to your health
      insurance card and update it whenever a prescription changes. It takes ten minutes
      once. In a waiting room, a pharmacy or an emergency department, it answers the
      first question before anyone has to ask it twice.'
    note: A habit, not advice.
  went_right:
    text: In 2024, Butterfly Conservation released 20 adult Wood Whites, a butterfly
      classified as endangered in Great Britain, at Fineshade Wood in Rockingham Forest
      near Corby [1]. This year its volunteers and the public recorded 746 there, against
      73 in 2025, a rise of 922% [1]. The charity thinks a warm spring "may have turbo-charged
      larval growth" [1]. Since 1992 the butterfly's distribution has shrunk by 76%,
      and it survives in only a dozen parts of its former range [1]. "Only two years
      ago we were releasing butterflies here," said Jamie Wildman of the charity [1].
      The work was funded by Natural England's Species Recovery Programme [1]. A ditch
      edge, a grant and hundreds of volunteer hours are not a headline until, one
      summer, they are.
  sentence: A Thursday of budget numbers, flu notifications and price lists, which
    is to say a day when the useful news arrives in tables, and the tables are being
    kept.
  euros:
    text: 'Germany''s Christmas tree growers expect a Nordmann fir, the country''s
      favourite, to cost €25 to €33 per metre this season, against about €18 to €23
      ten years ago, according to the Association for Natural Christmas Trees, quoted
      by the Tagesspiegel on 8 November [2]. Blue spruce is put at €17 to €22 per metre
      and Norway spruce at €14 to €19 [2]. One grower near Potsdam charges €49.90 for
      a 1.75-metre premium Nordmann fir, up from €46 last year; another in Schleswig-Holstein
      says trees up to two metres keep last year''s price, while larger ones rise by
      three to four euros [2]. Desk arithmetic: a two-metre Nordmann fir comes to €50
      to €66 at this year''s range, against €36 to €46 at the range of ten years ago;
      the Potsdam premium tree is €3.90, or about 8.5%, dearer than last year.'
    note: Indicative retail ranges per metre from growers' associations, reported
      8 Nov 2026; your price depends on region, quality, size and seller. Nothing
      here is advice.
  small_words:
    term: Meterpreis (price per metre)
    text: How Christmas trees are usually priced in Germany, by height rather than
      by the tree [2]. It makes trees of different sizes comparable at a glance, but
      it is a range, not a rule, and sellers may add more for taller or premium trees
      [2]. When you compare two stands, compare the price per metre at the same quality
      first, then the height you actually need for your ceiling.
