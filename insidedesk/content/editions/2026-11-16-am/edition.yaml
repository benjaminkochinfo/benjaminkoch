title: "Three crossings, 1 December: Estonia answers a failed arson with a timetable"
standfirst: "Eight suspects at a drone factory, a border due to shut in 17 days. Also: Japan shrinks by 0.1%, China's shoppers add 0.4%, Monday power at €194.49 on eleven times the wind, a measles status lost, rain for the Black Forest and a chocolate Santa 70 cents cheaper."
closing:
  title: Before you close the tab
  published: '2026-11-16T08:30:00+01:00'
  habit:
    text: 'This week, when the November payslip arrives, find the line for health
      insurance and read it once, slowly: the percentage, the euro amount, the name
      of your insurer. Then put the payslip in the same folder as last month''s. When
      your insurer''s letter about next year comes, you will have the number it is
      talking about in front of you.'
    note: A habit, not advice.
  went_right:
    text: Green turtle nesting at the Turtle Islands in Sabah, Malaysia, has tripled
      since the 1970s to more than 20,000 nests a year, AFP reports [1]. The islands
      have been protected since 1977, and Sabah banned turtle meat and egg consumption
      in 1997 [1]. On Omadal island a 20-strong women's cooperative has moved eggs
      to a hatchery since 2012 and now funds the work itself, putting 10% of its
      handicraft and catering revenue into turtle protection [1]. Globally, green
      turtles have moved from endangered to "least concern" [1]. "I've done my part,"
      said the turtle scientist Juanita Joseph [1]. Fifty years of fences, bans and
      buckets of sand do not make headlines; they make nests.
  sentence: A night guard stopped an arson in Estonia and a government answered with a date, Japan's economy slipped by a decimal, and on Monday the timetables said more than the speeches.
  euros:
    text: 'The average additional contribution to Germany''s statutory health insurance
      for 2027 stays at 2.9%, the health ministry announced on 30 October; with the
      general rate of 14.6% that makes a notional total of 17.5%, shared equally by
      employee and employer [2]. On a gross monthly salary of €4,000 subject to contributions,
      the 2.9% means €58 a month each for employee and employer [2]. But the figure
      is a benchmark, not a price: insurers set their own rates, and the average actually
      charged in 2026 is about 3.13%, according to the GKV-Spitzenverband [2]. Desk
      arithmetic: on €4,000 a month, the gap between 3.13% and 2.9% is €9.20 a month,
      of which your half is €4.60, or €55.20 a year.'
    note: Figures as reported by krankenkasseninfo.de on 2 Nov 2026; your insurer's
      own rate for 2027 decides what applies to you. Nothing here is advice.
  small_words:
    term: Zusatzbeitrag (additional contribution)
    text: The part of the statutory health insurance rate that each insurer sets for
      itself on top of the general 14.6%; the ministry publishes an average each autumn
      as a benchmark, and the insurers decide their own figure [2].
