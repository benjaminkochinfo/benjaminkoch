title: 'Minus 1,100 at the low, €291.77 for power: the invoices under a holiday'
standfirst: 'New York climbed out of a 1,100-point hole on thin pre-holiday trade and shuts for Thanksgiving today. Also: what Thursday''s power price is made of, Asia answering the tariff drafts in three registers, a Fed that decides on October, a one-tablet gonorrhoea option, California''s king tides, and a Podium vs Print on Ukraine aid.'
closing:
  title: Before you close the tab
  published: '2026-11-26T08:30:00+01:00'
  habit: {text: 'Today, before the first thing you do with a screen, check one quiet gauge in your own life: the meter, the boiler pressure, the tyre in the cold, the date on a prescription. Write the number down. A number you noted in calm is a number you will not have to guess in a hurry.', note: 'A habit, not advice.'}
  went_right: {text: 'The world''s first deliveries of generic lenacapavir, a twice-yearly HIV prevention injection that the Global Fund calls nearly 100% effective, arrived in Zambia on Wednesday, with Uganda expected in the coming days and Zimbabwe in early 2027 [1]. It comes just one year after the originator product reached sub-Saharan Africa; more than 189,000 people in 10 early-adopter countries have already had a first dose, and the Global Fund plans four times this year''s volume in 2027 [1]. Licences, pooled procurement and regulators did this: the dull machinery, moving fast.'}
  sentence: Preparation is invisible when it works; that is not a reason to stop paying for it.
  euros: {text: 'Germany''s day-ahead power price for today runs from €195.81 per megawatt hour in the quarter hour from 03:45 to €388.02 from 17:45 [2]. Desk arithmetic: that is 19.6 cents and 38.8 cents per kilowatt hour on the wholesale market, almost exactly double. A 2 kWh load, a washing cycle for example, costs about 39 cents of wholesale power before dawn and about 78 cents at a quarter to six in the evening: a difference of about 39 cents. Only households on a dynamic tariff see this directly, and grid fees, levies, taxes and VAT come on top.', note: Desk arithmetic on the cited figures.}
  small_words: {term: King tide, text: 'The season''s naturally high tides [3]. On their own they are a calendar event; this autumn El Niño has added a foot or more to them on the US West Coast, enough, with surf, to flood roads and some homes [3]. Low-pressure storm systems add to it too [3].'}
