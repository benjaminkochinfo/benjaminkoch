title: 'Minus 5% in Tokyo, plus 8.1% at the factory gate: Friday''s two price tags'
standfirst: 'This morning''s edition, published late at lunchtime: Asia''s AI sell-off reached Frankfurt by noon while Destatis printed the slower number, producer prices up 8.1%. Also: TSMC halts advanced Chinese orders, Kyiv''s night of 84 cruise missiles, the Länder stop the Kita bill, Lahore''s air turns hazardous, and a Podium vs Print on who counts the costs.'
closing:
  title: Before you close the tab
  published: '2026-11-20T12:15:00+01:00'
  habit:
    text: 'Take one sheet of paper this weekend and write down four dates: when your identity card expires, when your passport does, when your next regular prescription runs out, and when your driving licence needs renewing. Nothing else. A list of expiry dates made on a quiet Saturday saves a queue on a busy Tuesday.'
    note: A habit, not advice.
  went_right:
    text: 'Rice in Japan was 29.7% cheaper in October than a year earlier, the largest fall since comparable records began in January 1971, the internal affairs ministry''s figures show [1][2]. After last year''s shortage and panic buying, the Nikkei attributes the fall mainly to easing supply and demand and to building inventories [2]. It is how shortages usually end: not with a speech, but with full warehouses and a price index that says so.'
  sentence: 'Asia sold the AI story hard, Frankfurt followed by lunch, and the number that will still matter next month was the one printed at 08:00: German factories paying 8.1% more than a year ago.'
  euros:
    text: 'The federal care-reform bill would raise the long-term care insurance surcharge for childless members by 0.3 points to 0.9% from 2027 [3]. Desk arithmetic: on a gross salary of €3,500 a month, 0.3 points is €10.50 a month, or €126 a year; on €2,500 it is €7.50 a month. Contributions stop at the ceiling, which the same bill would raise by €300 a month [3]. It is still a draft, and the Bundestag decides.'
    note: Desk arithmetic on the cited figures.
  small_words:
    term: Mediation committee (Vermittlungsausschuss)
    text: 'When the Bundestag and the Bundesrat disagree on a law, either side can call this joint committee. Its members come from both chambers; it meets behind closed doors and proposes a compromise, which both chambers then vote on. On Friday the Länder sent the Kita start-chances bill there; it is how German federalism argues without breaking.'
