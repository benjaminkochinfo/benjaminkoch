title: "Count the follow-up, not the province."
standfirst: "Ebola reached an eighth Congolese province while its own daily report printed the gaps. France answered a night of riots with a list of meetings. Brent slipped to $107.92 on a waiver nobody is obliged to use. Eleven desks, every number sourced."
