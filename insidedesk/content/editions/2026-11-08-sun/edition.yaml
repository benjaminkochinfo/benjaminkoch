title: "Oil answered the ballot box. The power price answered the weather"
standfirst: "Brent had its steepest weekly fall since April 2020 after the midterms, yet German wholesale power never cleared below €242 a megawatt-hour all week. Chips crashed and bounced, COP31 opens in Antalya on Monday, and the week's most useful numbers were the dull ones: a 2.9% contribution rate, 190,000 soldiers and €2.15 off a tank."
closing:
  title: "Before you close the tab"
  published: "2026-11-08T10:23:55+01:00"
  habit: {text: "On Sunday evening, write three numbers on one card: what a litre of fuel cost the last time you filled up, the price per kilowatt-hour on your electricity contract, and how full your heating-oil tank is or what your gas meter reads. Do the same next Sunday. After a month you will know which of this winter's headlines actually reached your house, and which only reached the news.", note: "A habit, not advice."}
  went_right: {text: "Researchers in Hannover and Würzburg note that prospective studies put malnutrition among hospital patients at 30% to 70% at least, yet only 1.16% to 1.30% of inpatients are diagnosed with it. Instead of stopping at the warning, Hannover Medical School signed a contract with the Techniker Krankenkasse so that insured patients are screened for malnutrition on admission, during longer stays and at discharge, with the insurer paying for it, and the data will go to the body that sets hospital quality rules [1]. A study found a gap; a clinic and an insurer wrote a contract to close it."}
  sentence: "Oil fell hard on an American vote, German electricity stayed dear because November is dark and still, and the numbers that will matter most this winter were the quiet ones: a stable health-insurance rate, a record headcount in the army, and two euros off a tank of petrol."
  euros: {text: "ADAC's survey on Wednesday put Super E10 at €2.041 a litre, 4.3 cents cheaper than a week earlier, and diesel at €2.260, 2.9 cents cheaper [2]. Desk arithmetic: on a 50-litre tank that is €2.15 saved on petrol and €1.45 on diesel. For electricity, Sunday's wholesale average of 24.21 cents per kilowatt-hour compares with a household average of 36.18 cents including taxes, levies and grid fees in the first half of 2026 [3]; on a fixed contract, this week's wholesale moves do not reach your bill until your supplier's next price change [3].", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Day-ahead auction", text: "Every day at noon, Europe's power exchanges hold an auction for each quarter-hour of the next day. Generators say what they will sell and at what price, buyers say what they need, and the auction finds the price that clears. In Germany and Luxembourg the result is published shortly after midday, which is why this edition can tell you on Sunday morning that Sunday's power averages €242.13 a megawatt-hour, but not yet what Monday's will be."}
