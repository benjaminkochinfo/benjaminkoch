title: "The second Saturday was counted"
standfirst: "France marched again and the ledger, not the slogans, told you how it went. Oil ended the week at $116.72, the wind sold German power at €13, and the dull machinery of counting, warning and reconnecting kept doing its job."
closing:
  title: "Before you close the tab"
  published: "2026-10-25T10:00:07+01:00"
  habit: {text: "Once this week, look at the fuel board before 12:00 rather than after, and compare two stations on your usual route. Write the difference down; after a month you will know what your habit is worth.", note: "A habit, not advice."}
  went_right: {text: "After two storms in two days, National Grid said on Saturday that more than 124,000 properties in Britain had been reconnected since the storms began [1]. Crews worked through the wind, and the lights came back."}
  sentence: "France counted fewer marchers and far more arrests, oil priced the risk of another round, and the wind sold Sunday's wholesale power at a sixteenth of Wednesday's price."
  euros: {text: "ADAC's weekly reading put Super E10 at €2.110 a litre, 4.1 cents lower than a week earlier, and diesel at €2.255, 0.8 cents higher [2]. For a 50-litre tank, that is about €2.05 less for petrol and 40 cents more for diesel than the week before.", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Second-round effects", text: "When energy gets dearer, the first round is the bill itself. The second round is what follows: firms raising prices and workers asking for higher pay to keep up. Central banks worry most about the second round, because it can keep inflation going after oil calms down."}
