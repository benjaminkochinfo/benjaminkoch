title: "Three tankers on fire, Brent down 21% this month: Tuesday reads the ledger, not the smoke"
standfirst: "Iran's navy counted burning tankers in Hormuz while war-risk premiums kept easing and Brent barely moved. Also: Frankfurt 1.17% lower by mid-afternoon before Nvidia's night, a Dutch cabinet that stays, Washington's message to EU defence ministers, Wednesday's power €65 cheaper and 419,000 care-grade requests."
closing:
  title: Before you close the tab
  published: "2026-11-17T17:30:03+01:00"
  habit:
    text: 'Once this week, sit down with an older relative, or with yourself, and put the papers that
      matter into one folder: insurance card, the latest letters from the health and care insurers, a
      list of medicines with doses, and the names and numbers of the doctors. Write the date on the front.
      It takes half an hour. On the day somebody has to fill in a form in a hurry, the folder does the
      remembering.'
    note: A habit, not advice.
  went_right:
    text: 'Green and golden bell frogs are back at Carwoola in New South Wales, their last upland stronghold,
      where the last known population was seen in 2021 [1]. University of Canberra researchers reintroduced
      them with a $200,000 grant from the NSW Environmental Trust [1]. The species had almost vanished
      from inland eastern Australia under the chytrid fungus, which has sent more than 500 frog species
      into decline or extinction worldwide [1]. The site will also use lab immunisation, frog "saunas"
      and salted ponds against the fungus [1]. Frogs released in the ACT in February have survived their
      first winter, when they are most vulnerable, and are entering breeding season [1]. A grant, a pond
      with salt in it, and patience: that is what a comeback looks like up close.'
  sentence: Iran said three tankers burned in Hormuz and oil barely moved, and Europe's shares slipped
    before Nvidia's numbers; on Tuesday the ledgers moved faster than the speeches.
  euros:
    text: 'Petrol has kept slipping, diesel less so. At 16:00 CET on Tuesday the median price across Germany''s
      roughly 15,000 filling stations was €1.92 a litre for E10, €1.97 for Super and €2.17 for diesel,
      according to the SWR Data Lab [2]. A week earlier the ADAC put the average at €1.978 for E10 and
      €2.217 for diesel, and noted that diesel was getting cheaper more slowly than crude would suggest
      [3]. Prices may rise each day at 12:00 and may only fall afterwards, which is why the ADAC suggests
      filling up shortly before noon [2][3]. Desk arithmetic: a 50-litre tank of E10 at €1.92 costs about
      €96, roughly €2.90 less than at €1.978; the same tank of diesel at €2.17 costs about €108.50, some
      €12.50 more than E10. The two sources measure differently (median against average), so read the
      weekly change as a rough guide.'
    note: SWR Data Lab median of the past 24 hours as of 17 Nov 2026, 16:00 CET; ADAC national average
      published 11 Nov 2026. Your price depends on station, region and time of day. Nothing here is advice.
  small_words:
    term: Verhinderungspflege
    text: 'Respite care, literally "prevention care": money from German long-term care insurance that
      pays for a stand-in when the family member who usually provides care is ill, on holiday or otherwise
      unable to. The coalition''s care reform bill would abolish it, along with the relief amount of up
      to €131 a month in care grade 1, with many changes meant to apply from 1 January 2027 [4]. The Bundestag
      is expected to vote in mid-December [4].'
