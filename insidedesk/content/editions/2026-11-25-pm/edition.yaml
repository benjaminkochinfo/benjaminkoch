title: "€291.77 for power, smoke over Ras Tanura: Wednesday prices fear and frost"
standfirst: "Also: the DAX below 25,000, Washington's tariff caps for 14 economies, a Podium vs Print on the budget, America's 4.3% and 3.8%, and a Thanksgiving ledger."
closing:    # end-of-edition section, plain and warm; no mailbag
  title: "Before you close the tab"
  published: "2026-11-25T18:30:00+01:00"
  habit: {text: "This week, write tomorrow's three most important tasks on paper before you finish today, and leave the list where you will see it first. Germany's depression barometer finds that deliberately structuring the day is the self-help measure people with depression use most, and that such classic measures are rated more helpful than digital ones [1]. It costs two minutes and needs no app.", note: "A habit, not advice."}
  went_right: {text: "American households got a real raise in October. Real disposable income rose 0.5% after a 0.2% fall in September, and the saving rate was 4.1%, according to the Bureau of Economic Analysis [2]. Part of it came from one-off Medicare premium rebates, so it will not repeat every month. But people who received extra money mostly kept it, which is the sensible thing to do with a windfall."}
  sentence: "German power got dearer because it is cold, oil got dearer because of a claim, and only the cold is certain."
  euros: {text: "Thursday's wholesale electricity averages €291.77 a megawatt hour, about 29.2 cents a kilowatt hour before grid fees, taxes and margins, against €246.29 for Wednesday [3]. Desk arithmetic: a household on a dynamic tariff that uses 8 kWh on Thursday pays about €2.33 for the energy part at the day's average, against about €1.97 at Wednesday's. Moving a 1 kWh dishwasher run from 17:45 (€388.02 per MWh) to 03:45 (€195.81) saves about 19 cents [3]. On a fixed tariff none of this changes your bill this week.", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Risk premium", text: "The extra amount a price carries because something might go wrong, not because it has. On Wednesday an oil analyst used the phrase for Brent's rise after the Houthi claim against Ras Tanura [4]. A risk premium can vanish as fast as it appears, once the facts arrive."}
