title: '€8 a month from Berlin, €281 at breakfast from the exchange: your power bill has two authors'
standfirst: 'The coalition''s tax cut got its verdicts and its first sum; Thursday''s day-ahead price shows the bigger author. Also: Asia sells after Anthropic''s $83 debut, Australia''s jobless rate hits 4.9%, France rations a water pill, a red rain warning for the Black Forest, and a Podium vs Print on workers'' rights.'
closing:
  title: Before you close the tab
  published: '2026-11-19T08:30:00+01:00'
  habit:
    text: 'Before the cold weekend, walk once round your home with a notepad: the radiator that never gets warm, the window that whistles, the meter reading on the first of the month. Write it down, nothing more. A list made on a calm Thursday is worth more than a repair hunted for on a frozen Sunday.'
    note: A habit, not advice.
  went_right:
    text: 'The US Food and Drug Administration has approved Sanofi''s Infilbray (venglustat), a once-daily pill, as the first medicine to treat the neurological manifestations of Type 3 Gaucher disease, a rare inherited disorder [1]. Until now only the disease''s effects on the body could be treated; in the phase 3 LEAP2MONO study of 43 patients, the pill beat the standard enzyme infusion on a combined test of balance, coordination and cognition after 52 weeks [1]. "The neurological manifestations remained beyond the reach of available therapies," said Dr Pramod Mistry of Yale [1]. The label carries warnings, the study was small, and that is how rare-disease progress looks: one blinded trial, one approval, a door that was shut now open.'
  sentence: 'Berlin''s electricity-tax cut is worth about €8 a month to a family while one breakfast quarter-hour on the power exchange cost €281, Asia sold after New York''s record listing, and the useful news sat in tariff letters, rationed pills and wheat harvests, not in the verdicts.'
  euros:
    text: 'Fastenergy''s national average for 100 litres of heating oil was €158.62 on 18 November, against €161.64 the day before, as Brent slipped from $93.45 to $91.43 a barrel [2]. Desk arithmetic: for a household filling a 2,000-litre tank, that is €3,172.40 instead of €3,232.80, about €60 less than one day earlier. One day is not a trend, and the dealer''s quote for your street and order size is the figure that counts.'
    note: Desk arithmetic on the cited figures.
  small_words:
    term: Day-ahead auction
    text: 'Every day around noon, Europe''s power exchanges sell the next day''s electricity, hour by hour or quarter-hour by quarter-hour, in one sealed-bid auction. The result is the wholesale price you see in charts like this morning''s. Your household tariff follows it only slowly, through supplier contracts, grid fees and taxes.'
