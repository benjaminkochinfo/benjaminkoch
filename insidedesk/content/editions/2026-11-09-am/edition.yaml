  - {n: 2, title: "Spritpreise heute (09.11.2026): Durchschnitt E5, E10 und Diesel in Deutschland (source: MTS-K)", publisher: "kraftstoffbilliger.de", url: "https://kraftstoffbilliger.de/spritpreise", date: "as of 09 Nov 2026, 05:11 CET"}
