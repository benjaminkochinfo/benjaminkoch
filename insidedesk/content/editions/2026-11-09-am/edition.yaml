title: "A week that runs on paperwork"
standfirst: "Pump prices start Monday a few cents kinder, and the decisions that shape your bills sit on dull calendars: US inflation on Tuesday, Berlin's budget committee on Thursday, COP31 from today. Elsewhere: Monday power at €345.64, Taiwan's market curbs, Brent below $98 while the physical barrel firms, and Ukraine's line crews after a night of strikes."
closing:
  title: Before you close the tab
  published: '2026-11-09T08:30:00+01:00'
  habit:
    text: 'Pick one morning this week and read your electricity and gas meters, then write the numbers and the date on the back of the last bill. Do it again on the same weekday next month. A month of your own readings tells you more about your winter costs than any average in any newspaper, this one included.'
    note: A habit, not advice.
  went_right:
    text: 'When the Freshwater Biological Association began work on the River Kent in Cumbria, it could find only three adult freshwater pearl mussels [1]. "When we started, we could only find three adult specimens," said Sarah Raubenheimer, who manages the project [1]. The association bred young mussels in its Freshwater Pearl Mussel Ark, releases began in 2025, and by the summer of 2026 almost two thousand were settled in the river''s gravels, with about three thousand planned by 2027 [1]. A young mussel spends its first months riding harmlessly on the gills of a brown trout or Atlantic salmon, and some adults live well over a hundred years [1]. Natural England, the Environment Agency, South Cumbria Rivers Trust and the EU''s LIFE programme are partners [1]. Three in a river, then thousands: that is what patient institutions look like.'
  sentence: "A week of committee sessions, release calendars and conference texts begins today, and that is good news: the decisions that shape your bills are being made in public, on paper, with dates attached."
  euros:
    text: 'At 05:11 this morning the federal fuel-price register put the average litre of Super E10 at €2.035 in Schleswig-Holstein and €1.920 in Saarland and Thuringia, and the brand averages ranged from €1.929 at HEM to €2.028 at Agip Eni [2]. Desk arithmetic: on a 50-litre tank, the regional gap is about €5.75 and the brand gap about €4.95. If you fill up twice a month, choosing the cheaper end of the brand range is worth roughly €10 a month, or about €120 a year, without driving a kilometre further.'
    note: Desk arithmetic on early-morning MTS-K averages via kraftstoffbilliger.de. Prices change by station and hour; your own saving depends on where and when you fill up. Nothing here is advice.
  small_words:
    term: Bereinigungssitzung
    text: 'The final session of the Bundestag''s budget committee before the budget is passed, where the coalition settles its last disputes and amends the government''s draft line by line [3]. For the 2027 budget it begins on Thursday [3]. This year''s open items include a plastic tax worth about €670 million in 2027, a sugar tax worth €690 million, and planned savings on housing benefit [3]. It is the least glamorous meeting of the parliamentary year, and one of the most important.'
  sources:
