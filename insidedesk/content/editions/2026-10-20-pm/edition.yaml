closing:
  title: "Before you close the tab"
  published: "2026-10-20T17:30:00+02:00"
  habit:
    text: "This week, when a percentage in a headline makes you flinch, ask one quiet question before reading on: compared with what — last month or last year? Ten seconds. Germany's producer prices were up 6.7% on the year but 0.1% on the month once energy is taken out [1]. Both are true; they tell different stories."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "In Congo's Ebola outbreak, the recovery column keeps growing. The bulletin for 18 October counted 2,550 people who have recovered, 20 more than the day before, and 8,353 people vaccinated with Ervebo since the campaign began on 26 August [2]. Those are not slogans. They are people discharged and doses given, counted by a health ministry under strain."
  sentence: "German factories paid much more for energy but barely more for everything else, the rain that spared Gard hit Corsica, and Alberta settled its argument with a count."
  euros:
    text: "HeizOel24 put Tuesday's German average for heating oil at €1.73 a litre, against about 90 cents a year ago; Hamburg was cheapest at €1.68 and North Rhine-Westphalia dearest at €1.78 [3]. Desk arithmetic: on a 2,000-litre order, today's average comes to about €3,460, roughly €1,660 more than the same order a year ago, and the ten-cent gap between Hamburg and North Rhine-Westphalia is about €200."
    note: "Desk arithmetic on the cited per-litre averages. Your price depends on volume, postcode and the day you order. Nothing here is advice."
  small_words:
    term: "Producer prices"
    text: "Producer prices are what factories, mines and utilities charge when they sell goods inside Germany, before VAT. Destatis records them on the 15th of every month, so they show cost pressure early, before it reaches shop shelves [1]. In September they were 6.7% higher than a year earlier, most of it from energy [1]."
