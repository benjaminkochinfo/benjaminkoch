title: "Read the receipt before the chart."
standfirst: "Shares fell for a second day on oil and AI nerves; Wiesbaden's quieter release said German producer prices rose 6.7% in a year, almost all of it energy. Corsica went red for rain, Alberta voted three to one to stay, and a French prime minister said \"too static\" in the chamber. Eleven desks, every number sourced."
