title: "The referees meet in the same week as the invoices."
standfirst: "Oil eased on a flight to Tehran, not a ceasefire. The US ten-year closed Friday at 5.00% before three central banks and three hyperscalers report. A storm sold German power at €13 on Sunday, the Rhine cleared its 2018 low, and Brazil counted to 100%. Eleven desks, every number sourced."
