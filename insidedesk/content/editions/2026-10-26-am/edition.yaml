closing:
  title: "Before you close the tab"
  published: "2026-10-26T08:30:00+01:00"
  habit:
    text: "This week, when you next pass your heating, look at one number: the oil tank gauge, the gas meter or the thermostat setting. Write it down with the date. Do it again next Monday. Two readings a week apart tell you more about your own winter than any price headline in this edition."
    note: "A habit, not advice. Nothing here tells you what to buy, order or switch."
  went_right:
    text: "Germany's onshore wind turbines generated more than 1,000 gigawatt hours on both Saturday and Sunday, and Sunday's day-ahead power price averaged €13.12 per megawatt hour, against €211.94 for delivery on 21 October [1]. The storm arrived and the grid was ready to use it."
  sentence: "Oil eased because mediators flew to Tehran, not because anything was signed; this week the central banks and the big tech companies show their paperwork, and the paperwork usually wins."
  euros:
    text: "Heating oil costs €174.34 per 100 litres on Monday's German average for a 3,000-litre order, €3.70 more than a week ago and €40.79 more than three months ago [2]. Desk arithmetic: a 3,000-litre delivery costs about €5,230, some €1,224 more than the same order three months ago."
    note: "Desk arithmetic on the cited average price. Local prices differ by region, quantity and supplier. Nothing here is advice."
  small_words:
    term: "Day-ahead price"
    text: "The price of electricity for each hour of tomorrow, set in an auction the day before. Germany's daily average for Sunday 25 October was €13.12 per megawatt hour, and for Monday it is €116.57 [1]: the wind dropped, and tomorrow's auction noticed."
