title: "Before the statement, the invoices; the committees will speak tonight and tomorrow, the bills already have."
standfirst: "The Fed decides after this edition, so we read what it read: 3.7% on the shelf, 6.3% at the wholesale gate, and Ottawa hiking first. German power for Thursday cleared at €314.85, Israel's opposition says it can count to 61 while the tally gives its bloc 48, and South Africa is short of everyday pills. Eleven desks, every number sourced."
closing:
  title: Before you close the tab
  published: '2026-10-28T17:30:00+01:00'
  habit:
    text: 'This weekend, write down your electricity and gas meter readings and the
      price per kilowatt hour on your current contract, on one sheet of paper. Default
      suppliers in Germany have until 20 November to announce price changes for 1
      January, and seven of 116 tracked tariffs have already done so, all upwards
      [3]. If a letter arrives, you will have the numbers to compare in five minutes
      rather than fifty.'
    note: A habit, not advice.
  went_right:
    text: 'The overall age-adjusted death rate in the United States fell to 689.2
      deaths per 100,000 people in 2025, the lowest ever reported, according to
      provisional CDC figures analysed in a new report from the US health department''s
      planning office [1]. Between March 2015 and March 2026, measured per head of population, opioid prescriptions dispensed fell
      to 45.3% of their March 2015 level, while patients filling prescriptions for
      the addiction treatments buprenorphine or naltrexone rose to 218% of it [1].
      Fewer pills handed out, more treatment taken up: two slow lines in a pharmacy
      ledger, moving the right way [1].'
  sentence: 'Germany''s power for Thursday cleared at €314.85 a megawatt hour, gas
    touched €100, consumers think better of the country than of their own pay, and
    two central banks decide tonight and tomorrow: a day when the invoices spoke louder
    than the forecasts.'
  euros:
    text: 'Heating oil cost €1.73 a litre on the German average on Wednesday morning,
      almost two cents less than the day before, HeizOel24 reports for orders of
      3,000 litres [2]. It was cheapest in Brandenburg at €1.70 and dearest in Hesse
      at €1.77 [2]. Desk arithmetic: a 3,000-litre fill at the national average
      costs about €5,190, nearly €60 less than a day earlier, and the gap between
      Brandenburg and Hesse on the same order is about €210.'
    note: Desk arithmetic on the cited averages. Prices differ by dealer, region,
      order size and time of day. Nothing here is advice.
  small_words:
    term: Grundversorgung (default supply)
    text: 'The tariff you are on if you never chose an electricity or gas supplier:
      you are supplied by the default supplier for your area on its standard terms. That supplier may change
      its prices at the start of any month, but must announce it publicly at least
      six weeks ahead, and when it does, you may cancel without notice to the day
      of the change [3]. That is why 20 November matters this year: it is the last
      day to announce a price change for 1 January [3].'
