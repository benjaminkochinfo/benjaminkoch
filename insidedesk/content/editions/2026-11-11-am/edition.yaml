title: "Charles counted: 323.8 mm on a Madeira hillside, 84 call-outs, and schools shut before the first gust"
standfirst: "Storm Charles hit Madeira overnight and reaches mainland Portugal today under red warnings; the institutions moved first. Also: a Fed speech against a calm Kospi, a trade truce with a date on it, Abu Dhabi day two, and what Wednesday's wind does to your power price."
closing:
  title: Before you close the tab
  published: '2026-11-11T08:30:00+01:00'
  habit:
    text: 'Pick one day a month, say the first Sunday, and read your own meters: electricity, gas or the oil gauge, and the water meter if you have one. Write the numbers on one line in a notebook, with the date. It takes four minutes. After a winter you will know your house better than any bill can tell you, and a surprise will look like a surprise instead of like weather.'
    note: A habit, not advice.
  went_right:
    text: 'In Kerala, a road was going to take the trees, and the orchids growing on them with it. Researchers collected 27,324 of those orchids from felled or condemned trees and planted them on trees at a beach and two urban wetlands [1]. After 12 to 24 months more than 19,500, nearly 71%, were still alive; of the 6,126 endemic orchids, nearly 55% survived, and many flowered and set seed [1]. "That was a really big surprise," said Viswambharan Sarasan of the Royal Botanic Gardens, Kew [1]. At one park, QR tags on ten species drew more than 126,000 scans in two years [1]. The authors call such rescue "a last resort" [1]. A last resort that works is still a resort worth having.'
  sentence: "A storm reached Madeira first and left counted call-outs, a restored power line and a mainland that closed its schools in good time, which is what it looks like when the dull machinery of warnings does its job."
  euros:
    text: 'At 05:13 CET this morning the German average price for heating oil was €161.82 per 100 litres at a 3,000-litre order, 5.2% cheaper than a week earlier, according to the comparison site esyoil [2]. The four-week high was €174.31 on 25 October [2]. Regions differ more than days do: €151.34 in Bremen against €168.51 in Hesse [2]. Desk arithmetic: a 3,000-litre fill costs about €4,854.60 at today''s average, €374.70 less than at the 25 October high, and the Bremen–Hesse gap alone is about €515 on the same order.'
    note: esyoil national and state averages per 100 litres incl. VAT for 3,000 litres of standard low-sulphur heating oil, 11 Nov 2026, 05:13 CET. Your own price depends on postcode, quantity and delivery date. Nothing here is advice.
  small_words:
    term: Abnahmemenge (order quantity)
    text: 'The amount you buy in one delivery. Heating-oil prices in Germany are quoted per 100 litres for a given order quantity, and the headline average on comparison sites is set at 3,000 litres for a household [2]. Change the quantity and the price per litre changes with it, since a delivery has costs that do not shrink with the order. When you compare a quote with a headline, compare it at the same quantity first.'
