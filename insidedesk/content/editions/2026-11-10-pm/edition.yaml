title: "A month without its year, and a market that read it anyway"
standfirst: "US consumer prices rose 0.4% in October, core 0.3% for a third month, and two-year yields jumped. Elsewhere: €316.65 for Wednesday's power, a second day in Abu Dhabi, €8.2 billion for the job agency and a Portuguese storm alert declared a day early."
closing:
  title: Before you close the tab
  published: '2026-11-10T17:30:00+01:00'
  habit:
    text: 'Tonight, before the heating clicks on, walk through your home and put a hand near each radiator valve and each window frame. Note one draught and one radiator that stays cold at the top. Two small notes on paper are the start of a winter that costs less; the rest is a bleed key and a strip of draught tape.'
    note: A habit, not advice.
  went_right:
    text: 'Researchers at Oxford Population Health, funded by Cancer Research UK, followed blood samples from more than 20,000 men and found that higher levels of certain immune-activating proteins went with a lower risk of prostate cancer [1]. Higher levels of one protein, interleukin-15, were linked to a 14% lower risk seven or more years later, and in one cohort to a 26% lower risk of advanced disease [1]. The study, published today in Nature Communications, compared 368 proteins in 1,434 men who later developed the cancer with 1,434 who did not [1]. "The strongest immune signals were present more than seven years before diagnosis," said Professor Karl Smith-Byrne [1]. The authors are careful: these are associations, not a treatment yet [1]. But a decade of stored blood, patiently kept in freezers, has just told us when to look.'
  sentence: "Prices were counted, a power auction cleared and old blood samples taught us something new: the patient bookkeeping of institutions did the day's quiet work."
  euros:
    text: 'Heating oil got a little cheaper today. The Funke papers'' daily table puts the litre at €1.63 on esyoil and €1.69 on Tecson on 10 November, against €1.69 and €1.74 a day earlier [2]. That is up to 14 cents a litre below a week ago, but still around 80 cents above the end of October 2025 [2]. "An end to the high price level is not in sight," writes esyoil''s Klaus Bergmann, who suggests buying part of a year''s needs rather than all of it [2]. Desk arithmetic: for a 2,000-litre fill, a 6-cent drop on esyoil''s figure is €120; the roughly 80-cent gap to a year ago is about €1,600.'
    note: Average per-litre prices from comparison portals as reported by Berliner Morgenpost on 10 Nov 2026; your price depends on postcode, quantity and delivery charges. Nothing here is advice.
  small_words:
    term: Teilmenge (part order)
    text: 'Ordering only part of the heating oil you will need for the winter, instead of filling the whole tank at once [2]. It spreads the price risk across two or more delivery dates: you give up the chance of catching the single best day in exchange for not catching the worst one. Heating-oil traders suggest it when prices are high and the direction is unclear [2].'
  sources:
