title: "0.37% from the high, and a bond market on holiday"
standfirst: "Europe closed just below its record on order books and dividends, while US bonds took Veterans Day off."
closing:
  title: Before you close the tab
  published: '2026-11-11T17:30:00+01:00'
  habit:
    text: 'Once a quarter, on the day the inflation figure comes out, write two numbers on one line: the interest rate on each account you hold, and the latest inflation rate. Then add a third: the change in the one price that matters most in your house, whether that is heating oil, electricity or the weekly shop. Three numbers, five minutes, and next time a headline says "inflation", you will know what it means for you.'
    note: A habit, not advice.
  went_right:
    text: 'In a single water-filled cavern in Death Valley, divers and surface counters from the US National Park Service and the Fish and Wildlife Service counted 137 endangered Devils Hole pupfish on 10 October, nearly double the 77 seen in spring and about double the 69 recorded in autumn 2025 [1]. Two earthquakes in 2025 had knocked the population back; scientists then released 72 captive-raised fish between March 2025 and February 2026 and fed the pool while its algae recovered [1]. Because the fish live only 10 to 14 months, biologists believe most of the 137 hatched and grew in Devils Hole itself [1]. "While challenges remain, we''re encouraged by this progress," said park superintendent Mike Reynolds [1]. The two agencies have counted these fish the same way since 1972 [1]. Fifty-four years of patient counting is why we can call this good news, rather than guess.'
  sentence: "The statisticians confirmed October's prices line by line, a heart association counted what service leaves behind, and divers counted 137 small fish in a desert cave: a day when counting carefully was the work that mattered."
  euros:
    text: 'With October inflation confirmed at 2.8%, money in an account that pays nothing loses purchasing power: €10,000 would be worth about €9,728 in today''s money a year from now, a loss of about €272, according to an example calculation published with today''s figures [2]. At 2.5% interest, the European Central Bank''s current deposit rate, the same €10,000 earns €250 a year if it falls within the tax-free saver''s allowance, or about €184 after withholding tax and solidarity surcharge [2]. Desk arithmetic: the gap between earning nothing and earning €184 after tax is €184 a year on €10,000, and the remaining real loss on the taxed account is about €88 (€272 minus €184).'
    note: Example figures from Merkur/€uro-Finanzwissen, 11 Nov 2026, based on the Federal Statistical Office's confirmed October CPI and the ECB's deposit rate; tax example at 25% withholding tax plus solidarity surcharge, no church tax. Your own rate, taxes and allowance will differ. Nothing here is advice.
  small_words:
    term: Kerninflation (core inflation)
    text: 'Inflation measured without energy and food, the two groups whose prices jump around most [3]. In October it was 2.1% in Germany, against 2.8% for the full basket [3]. Economists watch it because it shows the slower, stickier part of price rises; households should remember it leaves out exactly the bills, heating and groceries, that many of them feel most.'
