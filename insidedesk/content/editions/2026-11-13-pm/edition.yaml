title: "Less demand, a dearer Saturday: the auction that refused to follow the calendar"
standfirst: "Saturday's power was bought on Friday for more than Friday's, while the oil watchdog sees a barrel back in surplus. Also: a flat DAX over busy shares, the 2027 budget signed off with one promise left open, new powers and new checks for the intelligence services, a record month in England's A&E, and Spain's new olive oil near three euros."
closing:
  title: Before you close the tab
  published: "2026-11-13T17:30:00+01:00"
  habit:
    text: 'Pick one day a month, the first Saturday will do, and press the test button
      on every smoke alarm in your home until it beeps. Note the date on a sticky label
      inside a kitchen cupboard, and next to it the year printed on the back of each
      alarm. It takes three minutes. A device that only speaks in an emergency deserves
      to be asked, now and then, whether it can still speak at all.'
    note: A habit, not advice.
  went_right:
    text: 'Two years after the Wood White butterfly was returned to Fineshade Wood in
      Northamptonshire, volunteers recorded 746 sightings there this year, against 73
      in 2025, a rise of 922%, the charity Butterfly Conservation says [1]. The project
      began in 2024 with 20 adult butterflies moved from two other Forestry England woods,
      and 23 more were released last summer [1]. Since 1992 the species'' distribution
      has fallen by 76%, and it now survives in only a dozen fragments of its former
      range [1]. The warm spring helped, but the charity credits years of habitat work:
      keeping the grassy rides open and the caterpillars'' food plants growing [1]. "Seeing
      hundreds of Wood Whites flying through Fineshade today shows what''s possible,"
      said Dr Jamie Wildman of Butterfly Conservation [1]. The money came from Natural
      England''s Species Recovery Programme [1]. Mowing a path on schedule is not a headline;
      it is how a headline like this one gets made.'
  sentence: The Bundestag gave the intelligence services new powers and a panel of former
    judges to check them first, the DAX took a breather after its record, and the pumps
    passed on a week of cheaper oil; on Friday the checks mattered as much as the powers.
  euros:
    text: 'Filling up got cheaper again this week. On Thursday a litre of Super E10 cost
      €1.949 on the ADAC''s nationwide daily average, a little over six cents or 3.2%
      less than a week earlier, and diesel fell by a little over six cents to €2.188
      [2]. Diesel, unusually, is still well above petrol [2]. Brent crude stood at a little
      over $93 a barrel on Thursday, against a little over $113 before the US congressional
      elections [2]. Desk arithmetic: six cents less on a 50-litre tank of E10 is about
      €3 a fill-up; and at Thursday''s prices the same 50 litres of diesel cost about
      €11.95 more than E10 (23.9 cents a litre).'
    note: ADAC nationwide daily averages for Thursday 12 Nov 2026, as reported by dpa-AFX
      on 13 Nov; prices vary by region, station and time of day. Nothing here is advice.
  small_words:
    term: Nachrichtendienst (intelligence service)
    text: 'In German law, a service that gathers information, covertly if need be, under
      legal and parliamentary oversight, but without police powers: it cannot arrest
      anyone [3]. Friday''s reform lets the BND and the domestic intelligence service
      do more, from disrupting attackers'' servers to acting against explosives, while
      arrests and open searches stay with the police [3]. "Intelligence services are
      becoming real secret services," said Interior Minister Alexander Dobrindt; 309
      MPs voted yes, 190 no and 71 abstained [3].'
