title: "Four percent off the index, and a jobs print at half past two"
standfirst: "Wall Street's AI sell-off cut the S&P by about 4.4% and put the Nasdaq into a correction; Friday's US payrolls are next. Elsewhere: the Bank of England at 4%, Friday's German power at €275.64, voters rejecting data centres in 40 of 41 local ballots, Europe's flight hoaxes, and a split map for winter sowing."
closing:
  title: Before you close the tab
  published: '2026-11-06T08:30:00+01:00'
  habit:
    text: 'When a market day is loud, write down one number you will wait for before you refresh again — today, the 14:30 CET payrolls print, or this noon''s day-ahead power auction. One appointment beats a morning of scrolling.'
    note: A habit, not advice.
  went_right:
    text: 'Ireland''s tillage farmers have had an almost perfect autumn for planting winter oilseed rape and cereals, the European Commission''s crop monitors told Agriland this week, even as much of the continent wrestles with either dust-dry soils or waterlogged fields [1]. A quiet success on one island does not cancel a hard season elsewhere; it does show that the same weather system still leaves room for a crop to establish when the rain arrives on time.'
  sentence: "Wall Street had its worst day since April, the Bank of England raised to 4%, and the next hard number is this afternoon's jobs print."
  euros:
    text: 'A litre of Super E10 averaged €1.974 at German stations open early this morning and diesel €2.212, according to the federal price register [2]. Desk arithmetic: a 50-litre tank of E10 costs about €98.70 at that average, about €3.35 less than at Wednesday''s ADAC national average of €2.041; the same tank of diesel costs about €110.60, about €2.40 less than Wednesday''s €2.260 [2][3]. Early prints often firm after midday.'
    note: Desk arithmetic on cited national averages. Your station differs by region, brand and hour. Nothing here is advice.
  small_words:
    term: Correction
    text: 'In market shorthand, a fall of 10% or more from a recent high in a stock index [4]. On Thursday the Nasdaq Composite closed more than 10% below its recent high after a 5.5% one-day drop, which is why desks called it a correction rather than only a bad session [4]. It is a description of distance travelled, not a prediction of what comes next.'
