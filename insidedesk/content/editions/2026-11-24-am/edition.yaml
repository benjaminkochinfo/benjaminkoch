title: "Plus 31.5% for a rehiring, a 19-month high for the dollar"
standfirst: "New York bought back Friday and priced a December Fed rise in the same session. Also: oil at a three-month low, India's drought, the budget's interest bill, and a Podium vs Print."
closing:
  title: "Before you close the tab"
  published: "2026-11-24T08:30:00+01:00"
  habit: {text: "This week, when a share or an index moves a lot in one day, ask one plain question before you react: what changed on an invoice, a payroll or a delivery note? Most days the honest answer is nothing yet. Write the question down; check it again on Friday.", note: "A habit, not advice."}
  went_right: {text: "More than four in ten US college students are now flourishing, the highest share in a decade: 43% in the 2025–26 Healthy Minds Study of 67,477 students, up from 38% a year earlier [1]. Depression symptoms fell to 34% from 37%, anxiety to 30% from 32%, and fewer students said they would think less of someone who had received treatment [1]. Slow, measured, and moving the right way [1]."}
  sentence: "A board changed its mind and a market added a trillion dollars, while the budget, the pay round and the oil tanks kept their own calendars."
  euros: {text: "Brent was $88.97 a barrel early on Tuesday [2], and the euro was $1.089 after Monday's fall [3]. Desk arithmetic: that is about €81.70 a barrel. A barrel holds 159 litres, so crude costs about 51 cents a litre in euros, before refining, transport, taxes and the retailer's margin. Before Monday's 0.7% fall in the euro, the same dollar price would have been about €81.12: the currency took back roughly 58 cents a barrel.", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Sidecar", text: "A short, automatic pause on programme trading when an index moves sharply, used in South Korea. On Tuesday morning the Kospi's gains triggered a five-minute sidecar curb on programme buying [4]. It does not stop the market; it slows the machines for a few minutes so that people can catch up."}
