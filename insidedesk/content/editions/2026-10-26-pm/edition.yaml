standfirst: "Saudi Arabia, Pakistan and Turkey sat with Iran's leaders in Tehran while the Houthis claimed another pipeline strike; Brent gave back about 1.6%. The ifo rose for a sixth month, Brazil's loser filed his complaint, and the Rhine climbed to 55 cm. Eleven desks, every number sourced."
