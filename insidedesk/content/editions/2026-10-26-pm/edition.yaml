closing:
  title: "Before you close the tab"
  published: "2026-10-26T17:59:01+01:00"
  habit:
    text: "Tonight, write tomorrow's three fixed costs on a slip of paper: one bill, one subscription, one regular purchase. Leave it by the door. Not to cut anything, just to know them by heart. A known bill is a lighter one."
    note: "A habit, not advice."
  went_right:
    text: "German manufacturers' business climate turned positive in October for the first time in more than three years, at +1.2, with incoming orders rising and firms planning to expand production, according to the ifo Institute [1]."
  sentence: "Neighbours sat down in Tehran, German factories got more orders, and the Rhine rose; none of it is finished, all of it is moving the right way."
  euros:
    text: "Heating oil averaged €174.58 per 100 litres in Germany on Monday afternoon, €41.03 more than three months ago [2]. Desk arithmetic: for a house using 2,500 litres a year, that is about €4,365 at today's price, roughly €1,026 more than at the price of three months ago."
    note: "Desk arithmetic on the cited average price. Local prices differ by region, quantity and supplier. Nothing here is advice."
  small_words:
    term: "Balance (in a survey)"
    text: "The share of firms saying 'good' minus the share saying 'poor'. When the ifo says manufacturing's balance is +1.2, it means slightly more factories report good business than bad, for the first time in over three years [1]."
