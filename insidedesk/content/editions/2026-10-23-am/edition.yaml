closing:
  title: "Before you close the tab"
  published: "2026-10-23T08:40:57+02:00"
  habit:
    text: "This week, find two lines on your electricity paperwork: the price per kilowatt-hour you actually pay and the date your contract can end. Write them down somewhere you will see them again. Today's Ordinary Ledger shows how far apart the cheapest new-customer tariff and basic supply can sit; knowing your own two numbers makes the next headline about tariffs easier to read."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "Kenya says it traced 135 contacts of its first Ebola death and has accounted for all of them, \"100 per cent\" in the health ministry's words [1]. Contact lists that close completely are the dull, decisive work of containment."
  sentence: "When tech shares fell, bonds caught the drop; in Germany the wind cut the wholesale power price by about a third in two days, and the Rhine at Kaub climbed back over its 2018 low."
  euros:
    text: "Heating oil costs €172.71 per 100 litres on Friday's German average for a 3,000-litre order, unchanged on the day, €3.42 more than a week ago and €38.67 more than three months ago [2]. Desk arithmetic: a 3,000-litre delivery costs about €5,181 today, some €1,160 more than the same order three months ago."
    note: "Desk arithmetic on the cited average price. Local prices differ by region, quantity and supplier. Nothing here is advice."
  small_words:
    term: "Basis point"
    text: "One hundredth of a percentage point, the unit bond markets use for small moves in interest rates. When the US ten-year yield fell by more than 19 basis points overnight, its biggest fall since March 2023, it dropped by roughly 0.19 of a percentage point; on Friday it stood at 4.9591% [3]."
