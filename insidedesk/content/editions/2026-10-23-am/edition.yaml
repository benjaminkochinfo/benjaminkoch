title: "The bonds caught what the shares dropped."
standfirst: "Tech shares had their worst day since June, and the long rate fell further than it has since March 2023. The wind cut Germany's power price by a third, the Rhine at Kaub climbed back over its 2018 low, and a poll answered the podium. Eleven desks, every number sourced."
