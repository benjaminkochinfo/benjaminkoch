title: "4.9% in Australia, 0 of 40 interceptors cleared: the arithmetic before the speeches"
standfirst: "Two inflation prints are partly about last year, and the committees have already leaned. Also: New York sorts its AI shares, a tariff verdict waits behind its caps, a budget debate, the harvest map, and a Podium vs Print on Patriot missiles."
closing:
  title: "Before you close the tab"
  published: "2026-11-25T08:30:00+01:00"
  habit: {text: "This week, when you read an annual figure, an inflation rate, a price rise or a bill, look up the same month a year ago before you react. Ask what dropped out of the window and what came in. Two minutes, one note, and the number usually becomes smaller or clearer.", note: "A habit, not advice."}
  went_right: {text: "America's winter wheat is in better shape than usual: 54% of the crop is rated good to excellent, against a 45% average for the time of year, Lachstock Consulting's market wire reports from US data [1]. In a week when southern Brazil is waterlogged and Russia's ports face frost, one large crop going into winter well is quietly good news for bread prices next year [1]."}
  sentence: "Before you ask what a central bank will do about a price, ask what that price was a year ago."
  euros: {text: "Germany's day-ahead power price for today runs from €201.83 per megawatt hour at 04:45 to €304.34 at 17:30 [2]. Desk arithmetic: that is 20.2 cents and 30.4 cents per kilowatt hour on the wholesale market. A 2 kWh load, a washing cycle for example, costs about 40 cents of wholesale power before dawn and about 61 cents at half past five: a difference of about 21 cents. Only households on a dynamic tariff see this directly, and grid fees, levies, taxes and VAT come on top.", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Base effect", text: "When an annual rate rises or falls because of what happened twelve months ago rather than this month. US core prices rose only about 0.18% last October, so a rise of about 0.21% this October is enough to lift the published annual rate from 3.1% to 3.2% [3]. The month that leaves the window matters as much as the one that enters it."}
  sources:
    - {n: 1, title: "Daily Market Wire 24 November 2026", publisher: "Grain Central (Lachstock Consulting)", url: "https://www.graincentral.com/markets/daily-market-wire-24-november-2026/", date: "24 Nov 2026"}
    - {n: 2, title: "Day-ahead auction prices, bidding zone DE-LU (data: Bundesnetzagentur | SMARD.de)", publisher: "Fraunhofer ISE Energy-Charts", url: "https://api.energy-charts.info/price?bzn=DE-LU&start=2026-11-24T00:00%2B01:00&end=2026-11-25T23:59%2B01:00", date: "retrieved 25 Nov 2026, 05:22 CET"}
