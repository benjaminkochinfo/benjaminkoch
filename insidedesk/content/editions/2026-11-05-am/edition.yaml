title: "Eight phones, two warrants, one judge"
standfirst: "A Starlink ground station in Poland burned in September; this week German special police arrested the man suspected of organising it, on paperwork that crossed two borders. Elsewhere, the 10-year Treasury yield ended the first session after the vote at 4.90%, and German day-ahead power runs from €196.97 a megawatt-hour at midnight to €349.36 for the hour from 17:00."
closing:
  title: Before you close the tab
  published: '2026-11-05T08:30:00+01:00'
  habit:
    text: 'Find the letter or email from your electricity and gas supplier with this year''s prices, and put it where January''s letter will land. The useful comparison next year is cents per kilowatt-hour against cents per kilowatt-hour, not one monthly instalment against another. Two minutes now saves a guess later.'
    note: A habit, not advice.
  went_right:
    text: 'After the black summer bushfires of 2019-20, scientists in East Gippsland, Australia, found puddles of tadpoles of the southern giant burrowing frog, critically endangered in Victoria, and took about 160 of them to Melbourne zoo [1]. More than five years later, The Guardian reported on Wednesday, 53 of those tadpoles, now male frogs about five years old, were returned to their native habitat, released just after thunderstorms had soaked the sites with 80 to 100 mm of rain [1]. Each frog is tagged, and song meters at the release sites are listening for their calls [1]. The species bred in captivity for the first time last year, and there are only five known breeding sites in Victoria [1]. "The best thing to do was just to raise those frogs up and release them back out," said Ryan Moes, an amphibian keeper at Zoos Victoria [1]. Patience, genetic tests and a zoo that keeps its records: that is what a rescue looks like.'
  sentence: "A fire in Poland was answered by a warrant, a police raid and a judge in Stuttgart, which is how Europe usually wins: slowly, on paper, and for good."
  euros:
    text: 'A gas contract that a German household can sign today costs on average 14.9 cents per kilowatt-hour, 3.8 cents or 34% more than at the start of the year, according to the energy industry association BDEW, based on a detached house using 20,000 kWh a year [2]. For customers on running tariffs, BDEW says, there has so far been no effect [2]. Desk arithmetic: on 20,000 kWh, 3.8 cents is about €760 a year, or about €63 a month, between a contract signed in January and one signed now. That is why a household on a good running deal has every reason to read the small print before it switches, and a household whose contract is ending has every reason to compare before it lapses into whatever comes next.'
    note: Desk arithmetic on BDEW's average for a 20,000 kWh household. Your own price depends on supplier, region and contract. Nothing here is advice.
  small_words:
    term: Bank Rate
    text: 'The interest rate the Bank of England charges other banks and building societies to borrow money [3]. It feeds through to what they charge for mortgages and pay on savings [3]. It is 3.75% now, and most analysts expect a rise to 4% when the Bank announces its decision at 12:00 GMT, 13:00 in Berlin, today; it would be the first increase since August 2023 [3]. Borrowers on tracker mortgages feel a change at once; those on fixed deals feel it when the deal ends [3]. The euro area''s equivalent is set by the European Central Bank in Frankfurt.'
