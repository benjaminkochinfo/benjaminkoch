title: "Minus 0.65% after Nvidia's beat, 0.1 cents on the power bill: Wednesday reads the terms"
standfirst: "Europe's shares slipped by mid-afternoon as miners fell and chipmakers rose on the first full day after Nvidia's numbers. Also: a coalition deal that cuts the electricity tax for one year, Thursday's power at €224.83 a MWh, a Hamm court on DAZN's price rise, Waymo off California's freeways and a €45 billion loan proposal for Kyiv."
closing:
  title: Before you close the tab
  published: "2026-11-18T17:30:04+01:00"
  habit:
    text: 'Before the cold arrives, write down three numbers on one sheet of paper: the gas or electricity
      meter, the water meter, and, if you have one, the level on the oil tank. Put the date next to them
      and pin the sheet somewhere dull, inside a cupboard door will do. Do it again in four weeks. You will
      not need an app to see what the winter costs you; the paper will have done the counting.'
    note: A habit, not advice.
  went_right:
    text: 'Antarctic blue whales, the largest animals known to have lived, have grown from about 418 animals
      in 1973 to an estimated 4,018, an average of 4.5% a year [1]. The International Whaling Commission
      banned killing them in 1964, but illegal whaling went on until 1973 [1]. The estimate comes from a study
      led by Zoe Rand at the University of Washington, which combined historical catch records, photo
      identification and decades of line transect surveys across the Southern Ocean [1]. The species is still
      listed as critically endangered and remains a fraction of its pre-whaling numbers [1]. A ban, a
      logbook and fifty years of counting: recovery is mostly patience with paperwork.'
  sentence: Nvidia beat, Europe's miners sold off and Berlin bought one cheaper year of electricity;
    Wednesday was a day for reading the terms, not the headlines.
  euros:
    text: 'Heating oil kept slipping on Wednesday. Tecson put the litre at €1.65 on 18 November, down from
      €1.70 on each of the previous four days, and esyoil at €1.60, down from €1.63 on Tuesday [2]. A year
      earlier, in mid-November 2025, esyoil''s average was €0.95 [2]. Desk arithmetic: 3,000 litres, a
      typical order for a detached house, cost about €4,950 at Tecson''s €1.65, some €150 less than at €1.70;
      at esyoil''s €1.60 it is about €4,800. At last November''s €0.95 the same order would have been about
      €2,850. An esyoil commentator quoted by the Morgenpost said an end to the high price level is "not in
      sight" [2].'
    note: Prices per litre as listed by Berliner Morgenpost from Tecson and esyoil, 18 Nov 2026, 10:25 CET;
      they depend on quantity, region and supplier. Nothing here is advice.
  small_words:
    term: Line transect survey
    text: 'A way of counting animals you cannot all see at once. A ship sails along straight, pre-planned
      lines and the crew records every animal spotted and how far from the line it was. Because fewer
      animals are seen the further away they are, statisticians use those distances to estimate how many
      were missed, and from that the population across the whole area. It is how the Southern Ocean''s
      blue whales were counted.'
