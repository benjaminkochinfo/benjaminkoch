title: "The shares took the blame, the bonds took the money, and the Bank of Japan finally said two per cent."
standfirst: "Asia's chipmakers fell and Treasuries headed for their best month since December 2023. The BoJ held at 1.25% and called its target in reach, Germany's wind dropped by seven-eighths before the year's dearest power day, and Hormuz traffic is still 70% below normal. Eleven desks, every number sourced."
closing:
  title: Before you close the tab
  published: '2026-10-30T08:30:00+01:00'
  habit:
    text: 'On Sunday, the first of November, write down your meter readings: gas, electricity, or the level in the oil tank. Heating oil cost about €1.72 a litre on the German average on Thursday, HeizOel24 reports [2], but that is a price, not your bill. A reading on the first of every month turns the national number into your own, and makes the next statement something you can check rather than merely pay.'
    note: A habit, not advice.
  went_right:
    text: 'Some 252 million hectares in 149 countries are now under restoration, an area about the size of Kazakhstan, a UN report published on Thursday finds, creating more than one million green jobs: the largest documented restoration effort to date [1]. Restoration on land has reached nearly half of the global goal of putting 30% of degraded land ecosystems under restoration by 2030 [1]. The share of countries reporting wetland restoration programmes has risen from 8% to 54% since 2022, and the flagship projects count mountain gorillas, jaguars, snow leopards and Ganges river dolphins among their recoveries [1]. Rivers and coasts still lag, and the money must more than quadruple, the report says [1]; but the ledger is being kept, and it is growing.'
  sentence: 'Shares in the companies spending most on AI fell, the money moved into government bonds, and Japan''s central bank said its two per cent target is finally in sight: a loud week ended with the quiet instruments doing the work.'
  euros:
    text: 'Heating oil cost €171.77 per 100 litres on the German average on Thursday at 12:20, for an order of 3,000 litres, against €171.79 the day before, HeizOel24 reports [2]. Per litre that is about €1.72, barely changed on the day; among large cities Munich was cheapest at €1.67 and Frankfurt dearest at €1.76 [2]. Desk arithmetic: a 3,000-litre delivery at the national average comes to about €5,153; the nine-cent gap between Munich and Frankfurt is worth about €270 on the same order.'
    note: Desk arithmetic on the cited averages. Prices differ by dealer, region, order size and day. Nothing here is advice.
  small_words:
    term: Flash estimate
    text: 'A first, quick reading of how much an economy grew, published before all the data are in. Eurostat releases its preliminary flash estimate for euro-area growth in the third quarter today at 11:00 CET, with further GDP releases scheduled for 13 November and 7 December [3]. Each one uses more information than the last, so the number can move. A flash is a photograph taken early, not the final portrait; it is useful precisely because it comes on time.'
