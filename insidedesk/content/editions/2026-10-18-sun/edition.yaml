closing:
  title: "Before you close the tab"
  published: "2026-10-18T10:00:00+02:00"
  habit:
    text: "Pick one number from this edition that touches your own month, a litre of diesel, a gas store, a rate, and write it on the first page of your calendar for November. On the first of the month, look it up again. Two numbers a month apart teach you more than thirty headlines in between."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "Brazil's space research agency Inpe reported that 3,335 square kilometres of Amazon rainforest were cleared between August 2025 and July 2026, the lowest since its records began in 1988 and nearly 42% less than the 5,731 square kilometres of the year before [1]. A climate group credited greater monitoring and stiffer penalties for illegal logging [1]. Satellites, inspectors and fines: dull machinery, very large result."
  sentence: "Oil got dearer again by Friday, the central banks chose to wait for wages, and Brazil cut the clearing of its rainforest to the lowest level in nearly forty years."
  euros:
    text: "ADAC's weekly average put diesel at €2.247 a litre and Super E10 at €2.151 [2]. A 50-litre diesel tank therefore cost about €112.35, and a 50-litre E10 tank about €107.55. The fuel-tax cut in force since 1 October is worth just under 17 cents a litre including VAT, ADAC says [2], so, taking ADAC's 16.7-cent gross figure, it is worth roughly €8.35 on that 50-litre tank, until the end of December."
    note: "Desk arithmetic on ADAC's national averages. Your local station's board is the binding number."
  small_words:
    term: "Credit default swap"
    text: "An insurance contract against a borrower failing to pay its debts. The buyer pays a yearly fee, quoted in basis points (hundredths of a percent) of the amount insured. When the fee jumps, lenders are telling you they trust the borrower less: this week CoreWeave's five-year fee went briefly above 1,140 basis points, a level generally read as distress [3]."
