title: "Read the week in the order it was paid."
standfirst: "Brent closed the week at $109.86 and diesel at the German pump at €2.247. The committees waited, on purpose, and Tehran's seven-day plan arrived after the screens went dark. Eleven desks, one sequence, every number sourced."
