  - {n: 2, title: "Marktbriefing", publisher: "Tankerkönig (MTS-K data)", url: "https://www.tankerkoenig.de/marktbriefing", date: "29 Oct 2026, data 04:01 CET, retrieved 29 Oct 2026, 16:30 CET"}
