title: "The president named her last day; the rate stayed where it was, and the invoices did the talking."
standfirst: "The ECB held at 2.50% and Christine Lagarde will step down on 7 February 2027. Alphabet's capital spending ran past its operating cash, Israel's count is complete and still short of 61, and German solar output rose 46% in October. Eleven desks, every number sourced."
closing:
  title: Before you close the tab
  published: '2026-10-29T17:30:00+01:00'
  habit:
    text: 'Next time you fill up, glance at the price board before you glance at the pump, and note the date beside the figure in your phone. The fuel tax cut that took 17 cents a litre off the energy tax began on 1 October, Tankerkönig notes from official MTS-K data [2]; a month of your own notes will tell you how much of it reached your street. It takes ten seconds a visit.'
    note: A habit, not advice.
  went_right:
    text: 'About 252 million hectares of degraded land and sea across 149 countries are now documented as being under restoration, an area the size of Kazakhstan, according to a UN Environment Programme report published today [1]. The flagship restoration drives it recognises are linked to more than one million green jobs [1]. The report is frank that the world is off track: that is only 34% of the benchmark for 2030, and freshwater restoration stands at just 5% [1]. A stocktake that counts honestly is how a pledge becomes a programme.'
  sentence: 'The ECB held at 2.50% and Christine Lagarde named 7 February as her last day, Alphabet''s capital spending outran its operating cash, and Germany''s October ran on more sun and less gas: the people at the top changed, and the ledgers kept counting.'
  euros:
    text: 'A litre of Super E10 cost €2.019 on the German average early on Thursday, 20.6 cents less than on 30 September, and diesel cost €2.238, down 13.6 cents, Tankerkönig reports from official MTS-K data at 04:01 [2]. Most of the fall dates from 1 October, when the fuel tax cut lowered the energy tax on petrol and diesel by 17 cents a litre [2]. Desk arithmetic: a 50-litre tank of E10 costs about €10.30 less than a month ago, and the same tank of diesel about €6.80 less.'
    note: Desk arithmetic on the cited national averages. Prices differ by station, region and time of day. Nothing here is advice.
  small_words:
    term: Deposit facility rate
    text: 'The interest the European Central Bank pays banks on money they leave with it overnight. Because banks will not lend to each other much below what the central bank pays them for doing nothing, it sets the floor for short-term rates across the euro area. Today the Governing Council left it at 2.50% [3].'
  sources:
