title: "Nvidia lost $657 billion in a week. On Tuesday it sends the invoice"
standfirst: "The chip sell-off made the noise, but the S&P 500 still gained 2.5% and the Stoxx 600 had its best week since July. German power fell from a record €351.48 to €139.70 as the wind arrived, COP31 rests before its paper week, and petrol dropped below two euros a litre: the useful numbers were the dull ones."
closing:
  title: "Before you close the tab"
  published: "2026-11-15T10:00:01+01:00"
  habit: {text: "Pick one recurring bill this week, the phone contract, the streaming service or the insurance that renews in January, and write down three things on a single line: what it costs a month, the date it renews and the date by which you would have to cancel. Do nothing else with it. The point is not to cut anything; it is to know which of your invoices runs on autopilot.", note: "A habit, not advice."}
  went_right: {text: "Germany's statistics office counted fewer deaths this autumn than usual. On its provisional figures, published on 10 November, mortality was 2% below the median of 2022 to 2025 in August, 6% below in September and 9% below in October, after a summer in which heat waves had pushed the late-June week 36% above that median [1]. The figures are provisional and extrapolated from incomplete registrar data, which Destatis says plainly [1]. A registrar's office, a weekly count and an honest footnote: that is how a country learns it had a quieter autumn."}
  sentence: "The week's loud numbers were about chips and oil; the quiet ones were six cents off a litre of petrol and an autumn in which fewer people died than usual."
  euros: {text: "ADAC's survey on Wednesday put Super E10 at €1.978 a litre, about 6.3 cents cheaper than a week earlier and below two euros for the fifth day running, and diesel at €2.217, 4.3 cents cheaper [2]. On Thursday's daily average, dpa-AFX reported E10 at €1.949 and diesel at €2.188 [3]. Desk arithmetic: on a 50-litre tank, Wednesday's weekly fall is about €3.15 for petrol and €2.15 for diesel. ADAC says diesel prices are still not fully explained by wholesale prices, the fuel discount and crude, and sees room for further cuts [2].", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Median", text: "Line up all the values from smallest to largest and take the one in the middle. Statisticians like it because one extreme year, a pandemic winter or a record heat wave, cannot drag it around the way it drags an average. When Destatis says October deaths were 9% below the median of 2022 to 2025, it is comparing this October with the middle of the last four, not with their average."}
  sources:
    - {n: 1, title: "Evaluation of the infra-annual mortality figures since 2020", publisher: "Federal Statistical Office (Destatis)", url: "https://www.destatis.de/EN/Themes/Society-Environment/Population/Deaths-Life-Expectancy/mortality.html", date: "10 Nov 2026"}
    - {n: 2, title: "Kraftstoffpreise: Super E10 wieder unter 2 Euro", publisher: "ADAC", url: "https://presse.adac.de/meldungen/adac-ev/verkehr/kraftstoffpreise-super-e10-wieder-unter-2-euro.html", date: "11 Nov 2026"}
    - {n: 3, title: "Benzinpreise in Deutschland sinken", publisher: "dpa-AFX via onvista", url: "https://www.onvista.de/news/2026/11-13-benzinpreise-in-deutschland-sinken-0-10-26576094", date: "13 Nov 2026, 11:18 CET"}
