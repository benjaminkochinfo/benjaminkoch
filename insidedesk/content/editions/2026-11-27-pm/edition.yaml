title: "3.2% and 4.1%: Europe’s prices cooled faster than the forecasts"
standfirst: "Also: every European index up into the weekend, a $149.5 billion US trade gap built from AI machines, a Podium vs Print on the EU budget, England’s early flu, €191.77 for Saturday power, and a drought counted in reservoirs."
closing:
  title: "Before you close the tab"
  published: "2026-11-27T18:30:00+01:00"
  habit: {text: "This weekend, when a shop tells you 'only two left', leave the item in the basket overnight and look again in the morning. Singapore's competition regulator warned on Friday that AI can personalise false scarcity messages to your own browsing [1]. A night's sleep is the cheapest filter there is.", note: "A habit, not advice."}
  went_right: {text: "Malaria vaccination is now part of routine immunisation in 25 African countries, and three-dose coverage has reached 70% on average where it is being rolled out, Gavi reported on Friday [2]. A new grant of up to $214 million would, if Gavi's board approves it in December, restore support to 85% of eligible children in high-transmission areas [2]. One of the fastest vaccine rollouts in Gavi's history is being run by clinics, schedules and cold boxes."}
  sentence: "France and Spain printed cooler prices than anyone forecast, Europe's markets closed the week higher, and Brussels set a date in December for the budget it could not agree on Thursday."
  euros: {text: "Saturday's German wholesale electricity averages €191.77 a megawatt hour, about 19.2 cents a kilowatt hour before grid fees, taxes and margins, against €301.82 for Friday [3]. Desk arithmetic: a household on a dynamic tariff that uses 8 kWh pays about €1.53 for the energy part at Saturday's average, against about €2.41 at Friday's. Moving a 1 kWh washing-machine run from 17:30 on Saturday (€232.03 per MWh) to 23:45 (€138.91) saves about 9 cents [3]. On a fixed tariff none of this changes your bill this week.", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Flash estimate", text: "An early reading of a month's inflation, published before the month's full price data are in and confirmed or revised later. Spain's statistics office calls its November figure 'a preview of the final data that will be published next month' [4]. A flash tells you the direction early. The final figure tells you the size."}
