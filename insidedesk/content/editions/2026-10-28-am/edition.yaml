title: "A still day costs more than a stormy one; the meter noticed before the speeches did."
standfirst: "The wind left Germany on Tuesday and Wednesday's power cleared at €249.21 a megawatt hour. Israel's count gives no bloc 61 yet, the Fed decides tonight with the three-month bill above its ceiling, and two storms left Britain counting reconnections. Eleven desks, every number sourced."
closing:
  title: "Before you close the tab"
  published: "2026-10-28T08:30:00+01:00"
  habit:
    text: "This week, if you owe a small business money, a plumber, a printer, the café that did the catering, pay the invoice on the day it is due rather than at the last possible moment. Allianz Trade expects 25,900 company insolvencies in Germany this year, the most in 13 years [2]. An invoice paid on time is the cheapest support a local firm can get."
    note: "A habit, not advice."
  went_right:
    text: "Scientists at The Wertheim UF Scripps Institute have found new compounds, sphaeriaurantins, made by rare soil bacteria, that in laboratory tests cleared 99.9% of a multidrug-resistant malaria parasite from blood and liver cells [1]. They came from a collection of 122,550 microbial strains gathered over 80 years [1]. The road to a medicine is long, the researchers say, but old freezers full of patient collecting are still paying out [1]."
  sentence: "The wind dropped and Wednesday's German power cost €249 a megawatt hour, Israel's count has handed no one 61 seats yet, and the Fed decides tonight: a day for meters and tallies, not speeches."
  euros:
    text: "Super E10 cost €2.059 a litre on the German average at 17:01 on Tuesday, 3.0 cents less than the day before, according to Tankerkönig's market briefing on official MTS-K data [3]. Over the month, the daily average fell from €2.261 on 28 September to €2.049 on 27 October, a drop of 21.2 cents, mainly because the fuel-price brake cut energy tax by 17 cents a litre from 1 October [3]. Desk arithmetic: a 50-litre tank at Tuesday's daily average costs about €102.45, some €10.60 less than four weeks earlier."
    note: "Desk arithmetic on the cited national averages. Prices differ by station, region and time of day. Nothing here is advice."
  small_words:
    term: "Credit insurance"
    text: "A policy a supplier buys so that, if a customer fails to pay an invoice, the insurer covers much of the loss. It is why credit insurers watch insolvencies so closely: Allianz Trade insured business transactions worth €1,400 billion worldwide in 2025 and tracks more than 83 million companies [2]. When its forecast moves, it is because its own invoices are on the line."
  sources:
