    - {n: 2, title: "Deutsche Insolvenzen steigen 2026 um 8 % auf höchsten Stand seit 2013 und bleiben 2027 unvermindert hoch", publisher: "Allianz Trade", url: "https://www.allianz-trade.de/presse/pressemitteilungen/deutsche-insolvenzen-steigen-2026-um-8-prozent.html", date: "27 Oct 2026"}
