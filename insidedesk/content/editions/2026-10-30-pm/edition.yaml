title: "The refinery lull ended in one sentence; the armoured vehicles arrive in 2033, and the invoices kept their own clock."
standfirst: "Ukraine's refinery strikes resumed while NATO capitals signed orders that deliver years from now. France shrank 0.1% as the euro area grew 0.4%, German inflation eased to 2.8%, Saturday power costs €251.42 a megawatt hour, and three in four German hospitals ran a loss. Eleven desks, every number sourced."
closing:
  title: Before you close the tab
  published: "2026-10-30T17:30:03+01:00"
  habit:
    text: 'The clocks went back last weekend, and the dark now arrives before most people leave work. This week, pick one fixed time for the lights out and the phone down, and keep it on Saturday as well as Tuesday. A study in today''s Psych note links a late-running body clock to a kind of tiredness that does not lift; you do not need a diagnosis to give your own clock a regular appointment.'
    note: A habit, not advice.
  went_right:
    text: 'The Green Climate Fund''s board ended its meeting in Songdo with the largest approval it has ever made: $1.97 billion for 21 projects [1]. That takes the fund''s approvals for 2026 to $3.3 billion, a second record year running, and a third of the money (34%) will flow through national and regional institutions [1]. Algeria, Cameroon, Moldova and Yemen get their first single-country projects, and reviews took six months on average against a nine-month target [1]. Faster paperwork is how a pledge reaches a field.'
  sentence: 'Drones flew by the hour and armour was ordered by the decade, France shrank while its shoppers spent, and Germany''s prices cooled even as Saturday''s power got dear: the speeches ran fast, and the ledgers kept their own time.'
  euros:
    text: 'A litre of diesel cost €2.289 on the German national average this week, against €2.084 for Super E10, the ADAC reports, so diesel is 20.5 cents dearer [2]. Diesel rose 3.4 cents in a week while E10 fell 2.6 cents [2]. Desk arithmetic: a 50-litre diesel fill costs about €10.25 more than the same fill of E10, and the week''s rise alone adds about €1.70.'
    note: Desk arithmetic on the cited national averages. Prices differ by station, region and time of day. Nothing here is advice.
  small_words:
    term: Preliminary flash estimate
    text: 'The first official reading of how much an economy grew, published about a month after the quarter ends from incomplete data. It is designed to be early rather than final, and later releases revise it. Today''s euro-area flash put growth at 0.4% for the third quarter [3].'
