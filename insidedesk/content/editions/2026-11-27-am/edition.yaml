title: 'Seven wounded in Kyiv, 2.9% in Tokyo: the week''s quieter ledgers'
standfirst: 'Zelenskyy warns of a new mass strike while envoys brief Putin and Brussels counts 24 of 27. Also: Europe rallying without New York, Nvidia''s halted boxes, Tokyo''s subsidy-free prices, Friday''s breakfast-priced power, Germany''s flu season at the door, an El Niño dry season for the Caribbean, and two Podium vs Print pieces.'
closing:
  title: Before you close the tab
  published: '2026-11-27T08:30:00+01:00'
  habit: {text: 'Before the weekend, send one invitation you have been meaning to send: a walk, a coffee, a call at a fixed time. Put it in both calendars. Loneliness is common enough that the other person is quite possibly waiting for exactly that message.', note: 'A habit, not advice.'}
  went_right: {text: 'In Western Australia, RSV cases have fallen by 40 to 60% over the past three years, according to Perth paediatrician Peter Richmond, after the state offered infant antibody injections from 2024 and Australia added maternal RSV vaccination to its national programme in February 2025 [1]. "No introduction of a vaccine has had a bigger impact on my day-to-day work as a pediatrician," he said in Seoul on Thursday [1]. Public programmes, procurement and patient record checks did this: the dull machinery of prevention.'}
  sentence: The shooting keeps one calendar and the diplomats another; trust the one that comes with signatures.
  euros: {text: 'Germany''s day-ahead power price for Friday runs from €203.35 per megawatt hour in the quarter hour from 23:45 to €426.32 from 08:15 [2]. Desk arithmetic: that is 20.3 cents and 42.6 cents per kilowatt hour on the wholesale market. A 2 kWh load, a dishwasher cycle for example, costs about 85 cents of wholesale power at a quarter past eight in the morning and about 41 cents just before midnight: a difference of about 44 cents. Only households on a dynamic tariff see this directly, and grid fees, levies, taxes and VAT come on top.', note: Desk arithmetic on the cited figures.}
  small_words: {term: Sentinel sample, text: 'A swab taken from a patient with a respiratory illness at one of a fixed network of doctors'' practices and sent to the national reference laboratory [3]. Because the network stays the same week after week, the share of samples with influenza, 9% in the week to 22 November, shows the trend even when most sick people are never tested [3].'}
