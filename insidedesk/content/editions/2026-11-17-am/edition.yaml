title: "Minus 1.2% in Tokyo, a rule for rented chips: Asia trades the week's paperwork"
standfirst: "Asia sold off ahead of Nvidia's results tonight and a US rule printed overnight. Also: missiles on Kyiv's bridges, a roughly €7 billion evening bill in Berlin, COP31's 18-page draft, 669 GWh of wind for Tuesday and car liability cover 4% dearer for 2027."
closing:
  title: Before you close the tab
  published: '2026-11-17T08:30:00+01:00'
  habit:
    text: 'Once this week, write one card or letter by hand to someone who still has
      a letterbox: three sentences are enough. Address it, stamp it, and walk it to
      the postbox rather than leaving it on the hall table. The writing takes ten
      minutes; the walk is the part that makes it real.'
    note: A habit, not advice.
  went_right:
    text: 'For the first time in more than a century, native oysters have been born
      in the Dornoch Firth in the Scottish Highlands, Heriot-Watt University reported
      on 16 November [1]. The firth''s oysters were probably fished to extinction in
      the late 1800s; the restoration began in 2017 with 300 oysters from Loch Ryan,
      and by October 2026 more than 140,000 hand-cleaned juveniles had been released
      by scientists and volunteers [1]. Some of the new spat have already reached the
      size of a 50p coin [1]. "This is a moment over 12 years and 140,000 oysters in
      the making," said Professor Bill Sanderson [1]. The project now aims for around
      four million oysters by 2031 [1]. Twelve years of scrubbing shells is not a
      headline; it is a reef.'
  sentence: Tokyo slipped 1.2% after Wall Street, Washington printed a rule for rented
    chips, missiles went for the bridges people cross in Kyiv, and in Berlin and Antalya
    the day's real work is a bill and a draft, not a speech.
  euros:
    text: 'Deutsche Post plans to raise the price of a standard letter on 1 January
      from 95 cents to €1.15, and a postcard by the same amount; the Großbrief rises
      55 cents to €2.35 and the Maxibrief €2.10 to €5 [2]. The regulator, the Bundesnetzagentur,
      allowed letter prices to rise by up to 20.35%, and the Post uses that frame in
      full; the final approval is still pending [2][3]. The reason is volume: 16.9
      billion letters were sent in Germany in 2005, barely 9.4 billion in 2025 [2].
      Desk arithmetic: 20 cents more is a rise of 21.1%; a household sending 30 standard
      letters a year pays €6 more, and ten Großbriefe add €5.50. Desk arithmetic: the
      2025 letter volume is about 44% below 2005, carried by the same network of postboxes
      and branches.'
    note: Prices as announced by Deutsche Post and reported by tagesschau on 20 Oct
      2026, subject to final approval by the Bundesnetzagentur. Nothing here is advice.
  small_words:
    term: Spat
    text: The young of oysters and other shellfish once they have finished drifting
      in the plankton and settled, only a few millimetres across
      at first; finding spat is how restorers know a population is breeding, not just
      surviving [1].
