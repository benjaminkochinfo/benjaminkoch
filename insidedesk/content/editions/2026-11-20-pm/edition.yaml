title: '879,000 chips approved, a third hike in view: Friday reads the paperwork'
standfirst: 'This evening''s edition: Washington''s list of AI-chip licences for China met a Friday chip sell-off, the DAX closed 7.1% down on the week, and Nagel spoke of a third hike. Also: Lagarde''s last Frankfurt speech, Ukraine''s strike on a Druzhba hub, buy-now-pay-later becomes credit, Britain''s first hard frost, and a Podium vs Print on who takes the first losses.'
closing:
  title: Before you close the tab
  published: '2026-11-20T18:31:00+01:00'
  habit:
    text: 'Before the first proper frost, walk once around your home with a pen: which
      radiator stays cold at the top, which window lets in a draught, where the stopcock
      is. Write the three answers on a card and pin it next to the fuse box. A cold
      night is easier when you already know where things are.'
    note: A habit, not advice.
  went_right:
    text: 'Nobody had ever bred the stocky galaxias, one of Australia''s most endangered
      alpine fish, in captivity. Researchers at Charles Sturt University did, and
      on Friday the university reported that the captive-bred fish are thriving in
      the wild [1]. After the largest release so far, about 250 juveniles, recapture
      surveys found 10 healthy adults from an earlier release in the Snowy Mountains,
      where the species had been confined to two known wild populations [1]. "To achieve
      a world first, then take those fish and put them back into the wild and see
      the wild population grow ... it''s incredible," said Professor Lee Baumgartner
      [1].'
  sentence: 'A congressional committee published how many AI chips Washington had approved for China, chip shares paid for the list, and the Bundesbank''s president said of rates: "I believe we have to do something."'
  euros:
    text: 'The health ministry has set the average supplementary contribution rate in
      statutory health insurance at 2.9% for 2027, unchanged, and each fund sets its
      own rate [2]. Desk arithmetic: on a €3,500 gross monthly salary, 2.9% is €101.50 a month;
      split evenly between employer and employee, that is €50.75 each, or €609 a
      year for the employee. Every 0.1 point a fund charges above or below the average
      moves an even half-share by €1.75 a month on that salary. Worth a look when your fund announces its 2027 rate.'
    note: Desk arithmetic on the cited figures.
  small_words:
    term: Alternate bearing (vecería)
    text: Olive trees tend to swing between a heavy crop one year and a light one the
      next. The FAO names this alternation, alongside heat, irregular rain and pests,
      as one reason olive harvests and prices jump so much from season to season [3].
      It is why one record year says little about the next.
