title: "Two checks, one weekend, and the dearest power day of the year again"
standfirst: "Nvidia's board opens a file on its own chief while Washington's AI-safety office runs without a lamp. Elsewhere: Tuesday's German power at €351.48, banks lift the DAX back above 26,000, ships hit near Hormuz while Brent falls, Aigner nominated, COP31 adopts its agenda, and a hospital winter plan that does its own arithmetic."
closing:
  title: Before you close the tab
  published: "2026-11-09T17:30:02+01:00"
  habit:
    text: 'Find your last electricity bill and look for one word: the name of your tariff. If it says basic supply, or you cannot tell, write that down and put the bill somewhere you will see it on Saturday. You do not have to decide anything tonight. Knowing which tariff you are on is the first line of every sensible decision about it.'
    note: A habit, not advice.
  went_right:
    text: 'Petrol is back below €2. The ADAC national daily average for Super E10 on Sunday was €1.996 a litre, 7.6 cents below a week earlier and, dpa reports, the cheapest daily average in more than four months [1]. Diesel has not followed yet, but the cheaper of the two fuels is moving the right way.'
  sentence: "A chip company investigated its own boss, Tuesday's power set another record, and petrol slipped back under two euros."
  euros:
    text: 'Tuesday''s German day-ahead power averages €351.48 per megawatt hour, about €0.35 per kilowatt-hour before taxes, levies and network charges [2]. In Verivox''s worked example, a 4,000 kWh household in Schmalkalden pays €2,169.41 a year on basic supply against €1,261.43 on the cheapest tariff, a gap of €907.98 [3]. Desk arithmetic: at Sunday''s averages, a 50-litre tank costs about €99.80 in E10 and €112.05 in diesel [1].'
    note: Desk arithmetic on cited averages. Your household tariff and station prices differ. Nothing here is advice.
  small_words:
    term: Basic supply (Grundversorgung)
    text: 'The default electricity tariff in Germany, from the local supplier that serves the most households in your area. You land on it if you never chose a contract or your supplier stopped serving you. It is a safety net, which is why it is often not the cheapest option: in Verivox''s example the gap to the cheapest tariff is €907.98 a year [3].'
