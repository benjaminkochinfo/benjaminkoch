title: "Trust the date on the notice."
standfirst: "Berlin's tobacco-tax law came into force by mistake and the customs office simply kept the old rates until January. UNEP counted the gap between pledges and cuts, Britain printed 3.5% with most of it at the pump, and Europe's shares were sorted by quarterly results. Eleven desks, every number sourced."
