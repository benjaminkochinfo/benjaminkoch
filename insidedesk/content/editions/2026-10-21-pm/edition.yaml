closing:
  title: "Before you close the tab"
  published: "2026-10-21T17:30:00+02:00"
  habit:
    text: "This week, look up one river gauge near you, on PEGELONLINE in Germany or Vigicrues in France, and note two things: its usual level and its record low or high [1]. Kaub on the Rhine, for example, averaged 208 cm over 2010–2020, and its lowest low water was 25 cm in October 2018 [1]. With those two numbers written down, the next headline about a river has a ruler next to it."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "The machinery of climate policy is measurably working. UNEP's Emissions Gap Report 2026, published today, finds that global renewable electricity capacity has grown three times faster since the Paris Agreement than was anticipated, and solar seven times faster [2]. Across more than 220 policy evaluations, electricity-sector policies cut emissions by an average of 9% [2]. The report is blunt that the cuts are not yet fast enough; it is just as clear that the tools already exist and have been counted."
  sentence: "A tax law took effect by mistake and the customs office quietly kept the old rates until January, UNEP counted how far the pledges fall short, and Germany's power auction is still waiting for the cheaper electricity Spain already has."
  euros:
    text: "A litre of Super E10 cost €2.110 on Wednesday's national average, 4.1 cents less than a week ago, while diesel rose 0.8 cents to €2.255, according to the ADAC [3]. Desk arithmetic: on a 50-litre fill, E10 is €2.05 cheaper than last week and diesel €0.40 dearer, and the gap between the two is now 14.5 cents a litre, or €7.25 a tank. The ADAC says most of the fuel-tax rebate now seems to be reaching the pump for petrol, while colder weather lifts heating-oil demand and with it diesel [3]."
    note: "Desk arithmetic on the ADAC national averages. Local prices differ by station and time of day. Nothing here is advice."
  small_words:
    term: "Gauge zero"
    text: "A river level such as \"Kaub 11 cm\" is not the depth of the water. It is measured from a fixed mark, the gauge zero, which at Kaub sits 67.669 metres above sea level [1]. The shipping channel lies well below that mark: the waterways administration guarantees a fairway depth of 190 cm at the reference low level of 77 cm on the gauge [1]. Desk arithmetic: at 11 cm, that is still roughly 124 cm of channel. Low, and expensive for barges, but not a dry riverbed."
