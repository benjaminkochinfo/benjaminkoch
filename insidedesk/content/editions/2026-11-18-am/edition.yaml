title: '$115.8 billion and a shrug: Nvidia beats, Asia slips, Berlin talks till 2 a.m.'
standfirst: 'Nvidia''s quarter beat its own guide by almost $8 billion and Asia still drifted lower. Also: an eight-hour coalition night over €5.4 billion, Japan''s record exports and record energy bill, Brent down a fifth while Hormuz traffic stays near zero, and the EMA''s first flu recipe for mRNA vaccines.'
closing:
  title: Before you close the tab
  published: '2026-11-18T08:30:00+01:00'
  habit:
    text: 'For three nights this week, pick one bedtime and one getting-up time and keep both, weekend included if you can. No app, no score: a note on the fridge is enough. The point is not more sleep but the same sleep, at the same hour, so the day starts from a known place.'
    note: A habit, not advice.
  went_right:
    text: The World Health Organization has validated Eritrea's elimination of trachoma as a public health problem, making it the 34th country in the world and the 11th in WHO's African Region to do so [1]. Trachoma is the world's leading infectious cause of blindness [1]. Eritrea surveyed all 58 of its sub-zobas and used surgery, antibiotics, face-washing and better water and sanitation, with a community-led sanitation approach and limited external funding [1]. Globally, the population needing interventions against trachoma fell from about 1.5 billion in 2002 to below 100 million by November 2025, a reduction of about 94% [1]. "After two decades of determined effort, Eritrea has consigned trachoma as a public health problem to history," said Dr Tedros Adhanom Ghebreyesus [1]. Twenty years of surveys and soap is how blindness ends.
  sentence: Nvidia sold more than anyone expected and Asia shrugged anyway, Berlin's coalition talked until 2 a.m. about who pays for cheaper electricity, and the useful news was in invoices, customs forms and a flu-strain list, not in speeches.
  euros:
    text: 'Germany''s electricity tax is 2.05 cents per kilowatt hour; the EU minimum for households is 0.1 cents [2]. Cutting it to the minimum would save about 2.32 cents per kWh including VAT, if suppliers pass it on in full [2]. StromAuskunft calculates about €35 a year for a single person using 1,500 kWh, €58 for two people at 2,500 kWh and €104 for a family of four at 4,500 kWh [2]. Desk arithmetic: €104 a year is about €8.67 a month, roughly the price of one cinema ticket. The finance ministry puts the cost to the state at about €5.4 billion a year [2]; whether and from when the cut comes depends on what the coalition announces this morning.'
    note: Desk arithmetic on the cited figures.
  small_words:
    term: Guidance
    text: A company's own forecast for its next quarter, published with its results. Nvidia guided to $130.0 billion of revenue, plus or minus 3%, for a quarter that has an extra week [3]. Markets often react more to the guidance than to the quarter just reported, because the quarter is already paid for and the guidance is not.
