closing:
  title: "Before you close the tab"
  published: "2026-10-19T17:43:02+02:00"
  habit:
    text: "This week, when a dramatic picture of unrest reaches you, open one official source beside it — a prefecture notice, an interior-ministry tally, a company repair figure — and write the number next to the image. Ten seconds. Most arguments get quieter."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "Germany's manufacturers still have work on the books. Destatis reported that the real stock of manufacturing orders rose 0.5% in August on July, seasonally and calendar adjusted, and stood 10.7% above a year earlier, with the backlog range unchanged at 9.0 months [1]. That is not a boom, and it is not a riot video. It is orders already taken and not yet shipped."
  sentence: "France answered a violent weekend with local curfews and a minister kept to write new methods, the bond market charged a wider premium for French debt, and a cheaper barrel still failed to cut the heating-oil quote."
  euros:
    text: "Carrefour's chief executive said fifty of the chain's stores had been looted, with repair work expected to cost more than €10 million [2]. Desk arithmetic: that is more than €200,000 per named store on average if the total is spread evenly — a crude average, not a claim about any one shop. Your local bill is the broken glass on your own street, counted by insurers and owners, not by a national average."
    note: "Desk arithmetic on the chief executive's reported total. Individual store losses will differ."
  small_words:
    term: "OAT–Bund spread"
    text: "An OAT is a French government bond; a Bund is a German one. The spread is how many extra hundredths of a percentage point investors demand to lend to France rather than Germany for the same maturity. On Monday that premium widened to about 145 basis points on the ten-year [2]. It is the market's short sentence about relative risk."
  sources:
