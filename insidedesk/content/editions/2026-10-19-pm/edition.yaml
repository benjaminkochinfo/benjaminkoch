title: "Count the curfew hours, not the speech."
standfirst: "France moved from Sunday's meetings to Monday's local curfews while OATs priced the night near 4.89%. Brent slipped; heating oil barely noticed. Congo's ECDC tally listed an eighth province. Eleven desks, every number sourced."
