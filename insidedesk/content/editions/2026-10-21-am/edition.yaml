closing:
  title: "Before you close the tab"
  published: "2026-10-21T08:30:00+02:00"
  habit:
    text: "This week, pick one public count you rely on, such as a weather warning map, a fuel-price site or a weekly shipping tally, and note when it is next updated. Météo-France, for example, updates its warnings at least at 06:00 and 16:00 [1]. Knowing when the next number arrives makes the statements in between easier to set aside."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "In Congo's Ebola response, the laboratories are getting faster. Situation report 157 records 500 samples analysed in a day, against 423 on 11 October, an increase of 18.2%, while the share testing positive fell from 20.8% to 19.4% [2]. Twenty more people recovered that day, bringing the total to 2,550 [2]. More tests and a slightly lower positive rate are what a response gaining ground looks like in the early stages."
  sentence: "Three capitals described one strait three ways while the ship count said open but thin, companies settled the market with their quarterly reports, and a €220 billion figure in Berlin turned out to have a footnote."
  euros:
    text: "The Deutschlandticket costs €63 a month and rises to €66.80 in January [3]. Desk arithmetic: that is €3.80 more a month, or €45.60 more a year for someone who keeps it all twelve months. A single fare in Berlin is €4 [4], so sixteen single trips a month cost €64, and the seventeenth takes you past the new ticket price. The Länder transport ministers are discussing a tariff that would charge occasional riders by the trip and stop at the ticket price [3]."
    note: "Desk arithmetic on the cited fares. Local fares differ by region and transport association. Nothing here is advice."
  small_words:
    term: "Special committee"
    text: "When a company's leader or largest owner stands on both sides of a deal, the board can hand the decision to a special committee made up only of independent directors, people with no stake in the outcome beyond their duty to shareholders. The conflicted person stays out of the room. SpaceX and Tesla each set one up on Tuesday to look at a merger, and Elon Musk said he cannot take part because he is \"a conflicted party\" [5]."
