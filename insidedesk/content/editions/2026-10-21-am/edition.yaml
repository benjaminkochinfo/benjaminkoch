title: "Believe the one that counts the ships."
standfirst: "Tehran says Hormuz is shut, Washington says traffic is near normal, the Guards say their mines stopped three tankers. The weekly count says open but thin. Quarterly reports, not forecasts, moved the market, and Berlin's €220 billion came with a footnote. Eleven desks, every number sourced."
