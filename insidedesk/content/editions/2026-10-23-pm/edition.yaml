title: "The wind paid for Friday. The tank did not."
standfirst: "Wholesale power fell by a third because the wind came back; heating oil and Brent kept climbing because the Gulf did not calm down. Europe's business surveys cooled, chip stocks learned what \"off the charts\" costs, and the Rhine at Kaub held above its 2018 line all day."
closing:
  title: "Before you close the tab"
  published: "2026-10-23T18:40:48+02:00"
  habit:
    text: "Before Monday, find the date your electricity or gas contract ends, and the notice period, and write both on this month's page of your calendar. Tonight's edition is about prices that move without asking you. The end date of your contract is the one price moment you get to choose."
    note: "A habit, not advice. Nothing here tells you what to buy, sign or switch."
  went_right:
    text: "Euro-area factories are selling abroad again. New export orders rose for a third month in a row in October, after nearly four and a half years of declines, according to the flash PMI survey [1]. On a day when growth slowed and France shrank, the line about customers abroad pointed the right way."
  sentence: "The wind made Friday's electricity cheaper, the Gulf made oil dearer, and a survey of purchasing managers told the ECB it can afford to wait."
  euros:
    text: "Heating oil cost €174.25 per 100 litres on Friday's German average, 0.90% more than on Thursday, €4.96 more than a week ago and €40.21 more than three months ago [2]. Desk arithmetic: a 3,000-litre delivery costs about €5,227.50 today, some €1,206 more than the same order three months ago."
    note: "Desk arithmetic on the cited average price. Local prices differ by region, quantity and supplier. Nothing here is advice."
  small_words:
    term: "Day-ahead auction"
    text: "The daily auction in which electricity for each hour of the next day is bought and sold. Germany and Luxembourg share one price zone; Friday's average came to €137.59 per megawatt hour [3]. Desk arithmetic: that is 13.8 cents per kilowatt hour, before grid fees, taxes and levies."
