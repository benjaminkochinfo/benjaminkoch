title: "A barrel answers a sentence, a turbine answers the wind"
standfirst: "Brent fell 6.4% and European gas about 6.5% on Monday after soft words between Washington and Tehran, while German gas plants had run near flat out through a windless weekend. Elsewhere: a factory survey that cheered and a retail print that did not, a slow count that is not a suspicious one, and a storm named Agneta in the south."
closing:
  title: Before you close the tab
  published: '2026-11-02T17:30:00+01:00'
  habit:
    text: 'If you want to follow the American results, pick one time to look on Wednesday morning, and leave the screen alone until then. Counts firm up over hours, not minutes, and a figure read once over breakfast tends to be calmer, and more complete, than the same figure refreshed at three in the morning.'
    note: A habit, not advice.
  went_right:
    text: 'NASA''s Perseverance rover has now driven farther than any vehicle on another world: on 11 October its total reached 45.22 kilometres, or 28.10 miles, and Guinness World Records has recognised the mark [1]. The record could have come two months earlier, when the rover sat about 200 metres short, but the team kept it working among ancient rock outcrops first [1]. Engineers got there with thousands of simulations, braking software that steers around rocks, and a way for the rover to fix its own position from orbital pictures without help from Earth [1]. Patience first, record second, and the paperwork followed.'
  sentence: "Oil fell on a diplomat's words today, but your electricity bill still depends more on whether the wind comes back."
  euros:
    text: 'A litre of Super E10 cost €2.114 on Germany''s October average, about 15.2 cents less than in September, and diesel €2.261, 12.5 cents less, according to ADAC''s monthly review published today [2]. The motoring club credits the fuel tax cut that runs from 1 October to the end of the year, and says it has largely reached drivers at the petrol pump but only partly at the diesel pump [2]. Desk arithmetic: a 50-litre tank of E10 at October''s average comes to about €105.70, roughly €7.60 less than at September''s €2.266; the same tank of diesel cost about €6.25 less than in September.'
    note: Desk arithmetic on the cited averages. Prices differ by station, region and time of day. Nothing here is advice.
  small_words:
    term: Tankrabatt
    text: 'The German word for the temporary fuel tax cut. From 1 October to the end of December, the energy tax on petrol and diesel is 14 cents a litre lower, which with VAT comes to almost 17 cents [3]. Whether a driver actually sees it depends on whether the stations pass it on, which is why ADAC checks the monthly averages [2].'
