title: "Projected, not certified"
standfirst: "By breakfast in Berlin the networks had called the House for the Democrats, while twelve Senate seats and a warehouse of bagged ballots in Westchester were still being counted. Elsewhere, AMD's margin outlook slipped a point, the 10-year Treasury yield slipped to about 4.90% overnight, and German wind nearly doubled without moving the gas plants or the price."
closing:
  title: Before you close the tab
  published: '2026-11-04T08:30:00+01:00'
  habit:
    text: 'Read the American results once this morning, from one source that is willing to write "too early to call", and then close it. A race nobody has called is not a race anybody has lost; it is ballots still being counted by people paid to be careful. Let the uncalled stay uncalled until lunch.'
    note: A habit, not advice.
  went_right:
    text: 'Five people who set out on 30 July on what should have been a one-hour boat trip between two atolls in Micronesia were found alive on Sunday off Fanning Island in Kiribati, about 5,400 kilometres away, after roughly three months adrift [1][2]. The three men and two boys were severely dehydrated and malnourished and were put straight on drips; the local nursing officer said they could already "give a smile face" and wanted to eat [1]. The US Coast Guard, which had searched 85,700 square kilometres of ocean for ten days after the boat was reported missing, called it "truly amazing and joyful news", while sending condolences for the four who did not come back [2]. Chuuk State has begun talks with Kiribati about bringing the survivors home [2]. Local people spotted the boat; a small island clinic did the rest.'
  sentence: "America voted, the television networks have called the House, and the counting goes on in rooms where nobody is in a hurry, which is exactly as it should be."
  euros:
    text: 'A litre of Super E10 cost €2.003 on the German average at 05:13 this morning, diesel €2.228, across stations reporting to the federal fuel price register [3]. Where you fill up matters more than you might think: E10 averaged €1.932 in Berlin and €2.044 in North Rhine-Westphalia, and among the 15 largest brands it ranged from €1.947 at SB stations to €2.071 at Agip Eni [3]. Desk arithmetic: the gap between Berlin and North Rhine-Westphalia is 11.2 cents a litre, about €5.60 on a 50-litre tank; between the cheapest and dearest of those brands it is 12.4 cents, about €6.20. Early-morning averages are snapshots, and prices move through the day.'
    note: Desk arithmetic on the cited averages. Prices differ by station, region and hour. Nothing here is advice.
  small_words:
    term: Race call
    text: 'When a news agency such as the Associated Press declares a winner before every vote is counted [4]. It is not a guess: AP''s Decision Team of journalists, data analysts and political scientists waits until the trailing candidate no longer has any path to victory. "Our certainty is our standard," says David Scott, who runs AP''s election services [4]. Some races take days; in 2000 AP never called Florida at all because it was too close [4]. A call is still not the official result, which comes later, with certification.'
