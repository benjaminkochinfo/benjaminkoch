title: 'Half a point in January, 203,000 claims and €214.51 for Friday: Thursday reads the small print'
standfirst: 'The Bundesbank says inflation waits for the fuel discount to expire, then rises about half a point. Also: the DAX down 0.55% by 16:34 as SAP and Evonik fell, Shenzhen''s pledge on refined fuel against Brent at $92.60, Karlsruhe turns down the BSW, Denmark ratifies its Greenland pact, NICE backs a £100 sponge test, and a Podium vs Print on oil.'
closing:
  title: Before you close the tab
  published: "2026-11-19T17:30:02+01:00"
  habit:
    text: 'Before the next downpour, spend five minutes outside your front door with a pair of gloves: lift the leaves off the drain grille, look into the downpipe, check the light well of the cellar. In Essen on Wednesday night, blocked drains were behind many of the flooded streets. The cheapest flood defence in Germany is a rake used on a dry afternoon.'
    note: A habit, not advice.
  went_right:
    text: 'New Zealand''s Department of Conservation says the first takahē chick has hatched at the Onetahua Restoration Project on Farewell Spit, at the top of the South Island [1]. Eight of the threatened flightless birds were moved in May into a 2,000-hectare habitat behind a 4 km predator-resistant fence; the parents were not an established pair, and the chick, hatched in October, is now about six weeks old [1]. "It''s about six weeks old now, which is great that it''s survived to this stage," said DOC''s Ross Trotter [1]. One nest washed away and one egg was infertile, and the trapping goes on [1]. Conservation rarely arrives as a breakthrough; it arrives as a fence, a trap line and one chick that made it past week six.'
  sentence: 'On a Thursday of court rulings, summit words and central-bank arithmetic, the useful news came from the machinery underneath: a £100 sponge that shortens a hospital queue, a catastrophe bond priced below guidance, and a fire brigade clearing leaves from the drains.'
  euros:
    text: 'The average additional contribution rate in Germany''s statutory health insurance stays at 2.9% in 2027, unchanged from this year, as published in the Federal Gazette on 30 October; each fund sets its own rate, which may be higher or lower [2]. Desk arithmetic: on a gross salary of €3,500 a month, the employee''s half of 2.9% under the usual equal split is €50.75 a month. A fund charging 0.3 points above the average would cost the employee a further €5.25 a month, or €63 a year. The letter from your own fund in December is the figure that counts.'
    note: Desk arithmetic on the cited figures.
  small_words:
    term: Expected loss
    text: 'In a catastrophe bond, the expected loss is the modelled share of the investors'' money that disasters would eat in an average year. The spread investors are paid is set against it: tonight''s Bavarian bond pays 2.75% on an expected loss of 1.68%, about 1.6 times. When that multiple shrinks, insurance capital is plentiful and cover is cheap.'
