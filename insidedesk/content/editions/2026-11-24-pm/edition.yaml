title: "An ifo up, a DAX down: Tuesday reads two kinds of number"
standfirst: "Also: €246.29 power, Anthropic below its issue price, a corvette sunk in Benghazi, a Thanksgiving storm and a Podium vs Print on the budget."
closing:    # end-of-edition section, plain and warm; no mailbag
  title: "Before you close the tab"
  published: "2026-11-24T18:30:00+01:00"
  habit: {text: "This week, have lunch or a coffee with one colleague you usually only email or message, and talk about the work, not the weather. Germany's new workplace study finds the strongest link with loneliness at work is simply how often people actually work with someone. It costs half an hour and nobody needs to call it a wellbeing measure.", note: "A habit, not advice."}
  went_right: {text: "German business has now felt better for seven months in a row. The ifo business climate rose to 90.6 points in November from 90.1, its highest since the spring of 2023, as services firms rated both their current business and their prospects more highly [1][2]. The institute says the recovery still lacks breadth, because manufacturing slipped [2]. Seven small steps in the same direction are worth more than one big jump."}
  sentence: "German firms felt better for the seventh month running while German shares fell: the economy and the market are different animals."
  euros: {text: "Notebooks cost 14.9% more than a year ago, desktop PCs 13.1% and games consoles 13%, while televisions are 9.2% cheaper [3]. Desk arithmetic: a notebook that cost €700 in October 2025 would cost about €804 now, a €450 console about €509, and a €600 television about €545. On the power bill, Wednesday's wholesale electricity averages €246.29 a megawatt hour, about 24.6 cents a kilowatt hour before grid fees, taxes and margins [4].", note: "Desk arithmetic on the cited figures."}
  small_words: {term: "Inversion", text: "A layer of warmer air sitting on top of colder air near the ground, the reverse of the usual order. It acts like a lid: moisture, smoke and particles cannot rise and mix away. On Tuesday the weather service explained that such a lid, plus warm moist air from cooling towers, produced a strip of industrial snow near Frankfurt [5]."}
