title: "Minus 0.05% on top, chips down underneath: Europe waits for Tuesday's invoice"
standfirst: "The DAX barely moved, the EU answered Moscow with listings rather than speeches, and two regulators cleared UniCredit for Commerzbank on the same day. The ECB's vice-president used the morning to describe how an AI repricing would travel."
closing:
  title: Before you close the tab
  published: "2026-11-16T17:31:37+01:00"
  habit:
    text: 'On the first Monday evening of each winter month, walk to the meters before dinner
      and write down what they say: electricity, gas or the dipstick in the oil tank, in a small
      notebook kept beside them. Add the date and one word about the weather that week. It takes
      two minutes. By March the notebook will tell you, in your own handwriting, what a cold
      week costs, which no annual statement ever quite manages.'
    note: A habit, not advice.
  went_right:
    text: In Leicestershire, swifts have started to move in. A county council project run with
      the Leicestershire and Rutland Ornithological Society installed more than 360 nest boxes
      and 150 "swift callers", devices that play colony sounds to draw the birds in, and six
      breeding attempts have now been confirmed, with monitoring continuing [1]. House sparrows,
      great tits and blue tits used some of the boxes too [1]. Swifts have declined largely
      because old nesting sites in buildings disappeared and insects grew scarcer, and they
      usually do not breed until they are three or four, so early attempts are an encouraging
      sign, the project team says [1]. "Conservation work often requires patience," said Adam
      Tilbury, the council's cabinet member for the environment [1]. The money came from Natural
      England's species recovery programme [1]. Six nests is not a recovery. It is the receipt
      that the boxes, the ladders and the budget line were worth it.
  sentence: The EU answered Moscow with 113 new listings, Brussels and Washington both cleared
    UniCredit for Commerzbank, and the DAX barely moved while chips slipped ahead of Nvidia's
    results; on Monday the paperwork did more than the podiums.
  euros:
    text: 'Heating oil started the week flat, and the queue is the real cost. At 12:51 CET on
      Monday, HeizOel24''s national average for a 3,000-litre order was €166.49 per 100 litres,
      against €164.75 at the previous close [2]. By midday prices had given back their morning
      rise and stood at just under €1.67 a litre, back at Friday''s level, while Brent fell
      to $95.07 from $96.29 [2]. Delivery currently takes four to five weeks on average, so
      anyone who wants oil before the end of the year should check delivery times when ordering,
      the site writes [2]. Desk arithmetic: 3,000 litres at €166.49 per 100 litres comes to
      about €4,995, roughly €52 more than at the previous close.'
    note: National average for a 3,000-litre order including VAT and delivery, as published
      by HeizOel24 on 16 Nov 2026, 12:51 CET; your price depends on region, quantity and supplier.
      Nothing here is advice.
  small_words:
    term: Complete Response Letter
    text: 'The US Food and Drug Administration''s formal way of saying "not in this form". It
      ends a review without approval and sets out what is missing. On Sunday Summit Therapeutics
      said it had received one for its lung cancer antibody ivonescimab, because the trial showed
      longer progression-free survival but no statistically significant improvement in overall
      survival [3]. A letter is not a ban: the company says development continues in other cancers
      [3].'
