alt: "Bar chart of German electricity generation from 1 to 28 October, in gigawatt hours, 2026 against 2025. Lignite generated 6,081.3 GWh in 2026 against 5,111.5 GWh in 2025, up about 19%. Solar generated 4,742.6 GWh against 3,244.9 GWh, up about 46%. Natural gas generated 4,223.2 GWh against 4,852.7 GWh, down about 13%. The latest day included is Wednesday 28 October 2026."
