alt: "Line chart of the Rhine water level at the Kaub gauge from 25 September to 24 October 2026, as daily means of 15-minute readings in centimetres above the gauge zero, against a flat line at 25 cm, the lowest daily reading of the 2010–2020 reference period, set on 22 October 2018. The daily mean stays below that line for four weeks, falling below zero on several days, with the lowest mean of −4.8 cm on 1 October. It recovers to 19.7 cm on 13 October, dips to 8.8 cm on 18 October and climbs to 19.1 cm on 22 October. On Friday 23 October the daily mean reaches 25.9 cm, just above the 2018 line, and on Saturday 24 October it slips back to 23.8 cm, just below it."
