alt: "Line chart since January 2024 of euro-area HICP inflation, core inflation and the ECB deposit rate. Headline inflation is between 1.7% and 2.8% through 2024 and 2025, is 1.9% in February 2026, then rises after the energy shock to 3.8% in September 2026; core inflation stays between 2.2% and 2.6% through 2026 and is 2.5% in September. The deposit rate steps down from 4% to 2% by mid-2025 and back up to 2.5% by September 2026."
