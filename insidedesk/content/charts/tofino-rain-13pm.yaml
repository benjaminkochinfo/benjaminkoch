alt: "Line chart of modelled rainfall at a grid point near Tofino on Vancouver Island, running total from 1 November. In 2026 the first three days are almost dry, then the total jumps to 148.4 mm by 6 November and climbs again from 10 November to 385.3 mm on Thursday 12 November 2026, the latest value. The 1991–2020 average for the same days rises steadily to 197.9 mm by 12 November."
