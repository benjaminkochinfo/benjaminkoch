alt: "Bar chart of the highest six-hour rainfall totals at seven Madeira weather stations during Storm Charles, IPMA data up to 03:00 local time (04:00 CET) on 11 November 2026, per DNOTICIAS.PT: Chão do Areeiro 232.1 mm, São Vicente 141.5 mm, Santo da Serra 130.4 mm, Pico do Areeiro 123.9 mm, Pico Alto 116.7 mm, Monte 83.6 mm and Prazeres in Calheta 70.8 mm. All seven are above IPMA's red-warning threshold of 60 mm in six hours. Chão do Areeiro also recorded 323.8 mm in 12 hours."
