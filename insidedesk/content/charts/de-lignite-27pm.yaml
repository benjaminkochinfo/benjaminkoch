alt: "Line chart of daily electricity generation from lignite in Germany from 1 September to 26 October 2026, in megawatt hours. It averages about 197,771 MWh a day in September and peaks at 291,434 MWh on 2 October. It stands at 255,448 MWh on Wednesday 21 October, drops to 54,346 MWh on storm Saturday 24 October, the lowest day since 14 June 2026, and 62,470 MWh on Sunday 25 October, then climbs back to 162,086 MWh on Monday 26 October, the latest value."
