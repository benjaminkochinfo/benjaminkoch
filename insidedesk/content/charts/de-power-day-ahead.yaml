alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price since July 2025, in euros per megawatt hour. Monthly averages stay mostly between about €77 and €110 through July 2026, including the months after the war begins at the end of February; the daily low is −€16.34 on 5 April. The price climbs from August, averaging €144.82 in September with a daily high of €256.55 on 14 September, and €169.93 over 1 to 21 October, against €94.14 over the same days of 2025. The latest value, for delivery on 21 October 2026, is €211.94."
