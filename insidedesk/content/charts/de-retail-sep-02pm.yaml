alt: "Bar chart of how far German retail sales fell in September 2026 against August, in real terms, calendar and seasonally adjusted, provisional. Petrol stations fell 3.4%, although their nominal sales rose 2.1%. Non-food retail fell 2.4%. Online and mail order fell 2.2%. All retail fell 2.0%. Food retail fell 1.4%, the smallest fall. The latest values are for September 2026, published on 2 November 2026."
