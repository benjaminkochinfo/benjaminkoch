alt: "Line chart of modelled rainfall at a Jodhpur grid point, running total from 1 June. In 2026 the total runs slightly below the 1991–2020 average through July, pulls ahead in early August to 231.6 mm by 15 August, then adds only 25.5 mm more, ending at 257.1 mm on Monday 26 October 2026, the latest value. The 1991–2020 average for the same days keeps climbing to 277.5 mm by 26 October."
