alt: "Bar chart of how far US Treasury par yields fell over the week from Friday 23 October to Friday 30 October 2026, in basis points. The 3-month yield fell 6, from 4.22% to 4.16%. The 2-year fell 13, from 4.69% to 4.56%, the largest move. The 5-year fell 11, from 4.82% to 4.71%. The 10-year fell 6, from 5.00% to 4.94%. The 30-year fell 2, from 5.33% to 5.31%. All yields were lower on the week; the latest values are the 30 October closes."
