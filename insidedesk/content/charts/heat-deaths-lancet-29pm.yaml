alt: "Bar chart of estimated heat-related deaths worldwide per year, in thousands. The 2006–15 average was 398.4 thousand in the observed climate and 179.3 thousand without climate change. The 2016–23 average was 540.8 thousand observed and 170.9 thousand without climate change. In 2023, the latest year, the estimate was 708.7 thousand observed and 202.0 thousand without climate change."
