alt: "Line chart of the daily US 2-year and 10-year Treasury par yields since 1 September 2026. On 1 September the 2-year is at 4.39% and the 10-year at 4.79%. The 10-year peaks at 5.31% on 5 October; on 30 September the two stand at 4.88% and 5.29%. On Thursday 29 October 2026, the latest value, the 2-year is at 4.61% and the 10-year at 4.98%, 27 and 31 basis points below their end-September levels."
