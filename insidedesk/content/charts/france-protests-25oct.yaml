alt: "Bar chart comparing France's second Saturday of cost-of-living protests, 24 October 2026, with the first, 17 October, set at 100, using Interior Ministry figures as reported by franceinfo, TF1 Info and BFMTV. Marchers fell from 550,000 to 410,000, or 74.5. Actions fell from 430 to 289, or 67.2. Arrests by early evening rose from 385 to almost 1,000, or about 260, a figure the minister said would rise. The CGT union counted 800,000 marchers on both days."
