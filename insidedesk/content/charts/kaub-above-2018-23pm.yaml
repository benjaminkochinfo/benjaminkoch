alt: "Line chart of the Rhine water level at the Kaub gauge from 23 September to 23 October 2026, as daily means of 15-minute readings in centimetres above the gauge zero, against a flat line at 25 cm, the lowest daily reading of the 2010–2020 reference period, set on 22 October 2018. Thirty daily means, 23 September to 22 October, sit below that line, five of them below zero, the lowest −4.8 cm on 1 October. The level recovers to 19.7 cm on 13 October, dips to 8.8 cm on 18 October and reaches 19.1 cm on 22 October. On 23 October, to 16:15, every 15-minute reading was at or above 25 cm, between 25 and 29 cm, for a daily mean so far of 27.3 cm; the last reading was 26 cm."
