alt: "Step chart since January 2025 of the Fed funds target upper limit and the ECB deposit rate. The Fed's upper limit falls from 4.50% to 3.75% between September and December 2025, then rises to 4.00% in September 2026. The ECB deposit rate falls from 3.00% to 2.00% by June 2025, rises to 2.25% in June 2026 and to 2.50% in September 2026. Both are unchanged since September; the latest values, for 21 October 2026, are 4.00% and 2.50%."
