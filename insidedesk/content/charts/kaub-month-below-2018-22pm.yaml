alt: "Line chart of the Rhine water level at the Kaub gauge from 22 September to 22 October 2026, as daily means of 15-minute readings in centimetres above the gauge zero, against a flat line at 25 cm, the lowest daily reading of the 2010–2020 reference period, set on 22 October 2018. All 31 daily means sit below that line. The level falls from 12.6 cm on 22 September to below zero on five days, with a daily mean of −4.8 cm on 1 October and a lowest reading of −6 cm that morning, recovers to 19.7 cm on 13 October, dips to 8.8 cm on 18 October and stands at 18.2 cm on 22 October, to 16:15, with a last reading of 17 cm."
