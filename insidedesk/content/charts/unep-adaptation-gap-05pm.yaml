alt: "Bar chart of adaptation finance for developing countries in US dollars a year, from UNEP's Adaptation Gap Report 2026. Flows between developing countries rose from 3.8 billion in 2019 to 9.6 billion in 2024. International public flows from developed countries were 28.2 to 31.7 billion in 2024 (bar at 31.7). The Glasgow goal for 2025 is 40 billion. Tripling by 2035 would give 85 to 120 billion (bar at 120). Estimated needs by 2035, the largest bar, are about 305 billion a year."
