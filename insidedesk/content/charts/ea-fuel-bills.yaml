alt: "Line chart of annual price changes since January 2025. Liquid and motor fuels fall by up to about 9% a year in spring 2025, then jump after the war begins, reaching +33.8% in the euro area and +37.3% in Germany in September 2026. Electricity, gas and heat rise far less, to +6.9%, and core inflation stays near 2.5%."
