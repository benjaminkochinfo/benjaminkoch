alt: "Line chart of modelled rainfall at a grid point near Cluanie Inn in the Scottish Highlands, running total from 1 October. In 2026 the total passes 100 mm by 10 October, jumps to 180.0 mm by 15 October after a wet 13th and 14th, stays flat through a dry spell to 19 October, then climbs again with Storms Austen and Boelo to 269.0 mm on Monday 26 October 2026, the latest value. The 1991–2020 average for the same days rises steadily to 133.5 mm by 26 October."
