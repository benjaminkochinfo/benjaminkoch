alt: "Line chart of daily electricity generation from natural gas in Germany from 1 September to 1 November 2026, in gigawatt hours. Before late October it moves mostly between about 50 and 240, falls to 42.5 on Saturday 24 October and 43.5 on Sunday 25 October during the storm, then climbs to 242.0 on 28 October and stays near 280 to 290 for four days: 286.5 on 29 October, 287.6 on 30 October, the highest of the period, 280.9 on 31 October and 282.6 on 1 November. The latest value is 282.6 gigawatt hours for Sunday 1 November."
