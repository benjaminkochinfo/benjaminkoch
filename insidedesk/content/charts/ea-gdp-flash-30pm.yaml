alt: "Line chart of quarterly real GDP growth on the previous quarter from Q1 2024 to Q3 2026 for the euro area, Spain, Germany and France. Spain grows every quarter, between 0.5% and 1.3%, and is 0.6% in Q3 2026, the latest value. The euro area moves between 0.0% and 0.6% and is 0.4% in Q3 2026, after 0.6% in Q2. Germany moves between -0.1% and 0.4% and is 0.2% in Q3 2026, after 0.3%. France falls below zero in Q4 2024 (-0.1%) and Q1 2026 (-0.2%), is 0.0% in Q2 2026 and -0.1% in Q3 2026, the latest value. Q3 2026 figures are a preliminary flash estimate and may be revised on 13 November 2026."
