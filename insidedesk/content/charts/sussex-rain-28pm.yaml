source_line: "Open-Meteo Historical Weather API (open-meteo.com), daily precipitation at 51.00°N 0.16°W; 2026 from its default reanalysis/analysis blend, 1991–2020 average from ERA5 (Copernicus/ECMWF); desk running totals; retrieved 28 Oct 2026 · Open-Meteo data CC BY 4.0. Modelled grid values, not station readings."
alt: "Line chart of modelled rainfall at a grid point near Haywards Heath in West Sussex, running total from 1 October. In 2026 almost nothing falls in the first six days, the total reaches only 21.7 mm by 19 October, then storms from 20 to 24 October lift it to 96.6 mm, and it reaches 107.0 mm on Tuesday 27 October 2026, the latest value. The 1991–2020 average for the same days rises steadily to 62.4 mm by 27 October; the 2026 line overtakes it on 23 October."
