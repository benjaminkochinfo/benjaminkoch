alt: "Line chart of the daily US 2-year and 10-year Treasury par yields from 1 October to 3 November 2026. On 1 October the 2-year is at 4.78% and the 10-year at 5.24%. The 10-year peaks at 5.31% on 5 October; both fall sharply on 22 October and drift lower to 4.56% and 4.94% on 30 October. On Tuesday 3 November 2026, US election day and the latest value, the 2-year closes at 4.61% and the 10-year at 4.95%, a gap of 0.34 percentage points."
