alt: "Bar chart of annual inflation in October and the November 2026 flash estimate. Spain's harmonised inflation falls from 4.9 percent in October to 4.1 percent in November; France's from 3.7 percent to 3.2 percent; Spain's core inflation, excluding unprocessed food and energy, from 3.1 percent to 2.6 percent. Analysts had expected 3.6 percent for France and 4.7 percent for Spain."
