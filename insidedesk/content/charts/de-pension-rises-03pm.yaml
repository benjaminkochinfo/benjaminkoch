alt: "Bar chart of the German statutory pension adjustment on 1 July of each year from 2020 to 2026, for West Germany until 2023 and nationwide from 2024. 2020: 3.45%. 2021: zero, because wages had fallen in 2020. 2022: 5.35%. 2023: 4.39%. 2024: 4.57%. 2025: 3.74%. The latest value is 4.24% on 1 July 2026. The government's draft estimate of 4.09% for July 2027 is not shown, because it is not yet decided."
