alt: "Line chart of daily electricity generation in Germany from onshore wind and from natural gas, 1 September to 22 October 2026, in gigawatt hours. Wind swings widely, from 27.4 GWh on 4 October to 842.9 GWh on 9 October. Gas runs lower and steadier, from 50.1 GWh on 20 September to 241.4 GWh on Wednesday 21 October, its highest of the period. On Thursday 22 October onshore wind generated 673.1 GWh, up from 242.3 GWh the day before and the third-highest day since 1 September, while gas fell to 123.3 GWh, about half of Wednesday's total."
