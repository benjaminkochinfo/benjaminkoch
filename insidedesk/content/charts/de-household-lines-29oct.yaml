alt: "Line chart of annual price changes in Germany since January 2025, from Eurostat's harmonised index. Fuels for personal transport fall by up to 8.4% a year in April 2025, are near zero in early 2026, then jump to 19.8% in March 2026 and reach 36.8% in September 2026, the latest value. In September 2026 all items stand at 3.3%, food and non-alcoholic beverages at 0.4%, and electricity, gas and other household fuels at -1.9%, below zero throughout the period."
