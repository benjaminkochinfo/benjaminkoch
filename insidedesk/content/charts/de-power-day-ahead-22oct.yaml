alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price since July 2025, in euros per megawatt hour. Monthly averages stay between about €77 and €110 through July 2026, including the months after the war begins at the end of February; the daily low is −€16.34 on 5 April. The price climbs from August, averaging €144.82 in September with a daily high of €256.55 on 14 September, and €168.96 over 1 to 22 October, against €95.54 over the same days of 2025. The latest value, for delivery on Thursday 22 October 2026, is €148.61, down from €211.94 for Wednesday 21 October."
