alt: "Line chart of the annual change in US consumer prices and producer prices for final demand, monthly since January 2025. In January 2025 consumer prices are up 3.0% on a year earlier and producer prices 3.8%. Both run between about 2.3% and 3.1% through 2025; no consumer price figure exists for October 2025. From March 2026 producer prices pull away: 4.3% in March, 5.9% in May and 6.3% in September 2026, the latest value. Consumer prices peak at 4.2% in May 2026 and stand at 3.7% in September 2026, the latest value, 2.6 percentage points below producer prices."
