alt: "Bar chart comparing how far US Treasury par yields fell on the first trading day after the 3 November 2026 election with how far they fell from 1 October to 4 November, in basis points. The 2-year fell 3 on the day, from 4.61% to 4.58%, and 20 since 1 October, from 4.78%. The 5-year fell 5 on the day, from 4.74% to 4.69%, and 32 since 1 October, from 5.01%. The 10-year fell 5 on the day, from 4.95% to 4.90%, and 34 since 1 October, from 5.24%. The 30-year fell 4 on the day, from 5.32% to 5.28%, and 33 since 1 October, from 5.61%. The latest values are the Wednesday 4 November closes."
