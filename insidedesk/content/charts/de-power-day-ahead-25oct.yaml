alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 August to 25 October 2026, in euros per megawatt hour. September averaged €144.82. In the week to Wednesday 21 October the price stayed around €175 to €212, reaching €211.94 on Wednesday. It then fell for four days in a row: €148.61 on Thursday, €137.59 on Friday, €30.12 on Saturday 24 October and €13.12 for delivery on Sunday 25 October, the last point. Over 1 to 25 October the average is €155.92, against €89.11 over the same days of 2025."
