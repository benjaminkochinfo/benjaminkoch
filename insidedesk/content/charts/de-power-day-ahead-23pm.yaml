alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price since July 2025, in euros per megawatt hour. Prices stay mostly between about €77 and €110 a month through July 2026, with a daily low of −€16.34 on 5 April 2026. They climb from August, average €144.82 in September with a daily high of €256.55 on 14 September, and average €167.60 over 1 to 23 October 2026, against €94.97 over the same days of 2025. The latest value, for delivery on Friday 23 October 2026, is €137.59, down from €148.61 on Thursday and €211.94 on Wednesday."
