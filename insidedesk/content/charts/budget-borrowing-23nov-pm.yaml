alt: "Bar chart of planned new federal borrowing in Germany for 2027 as passed by the Bundestag budget committee: 122.97 billion euros in the core budget, 57.84 billion in the special fund for infrastructure and climate neutrality and 29.65 billion in the Bundeswehr special fund, together 210.46 billion euros. A fourth, much smaller bar shows about 1.8 billion euros, the federal government's reported share of the cost of a full adjustment for cold progression in 2027, which is not in the budget."
