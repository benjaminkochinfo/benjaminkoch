alt: "Line chart of weekly laboratory-confirmed influenza cases notified to the Robert Koch Institute in Germany, reporting weeks 40 to 45 of 2026. Cases move between 438 and 554 in the first four weeks, rise to 726 in week 44 and reach 844 in week 45 (2 to 8 November 2026), the latest value. Hospital admissions among them rise from 116 in week 40 to 212 in week 45."
