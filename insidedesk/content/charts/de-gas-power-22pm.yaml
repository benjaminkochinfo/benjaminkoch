alt: "Line chart of daily electricity generation from natural gas in Germany since July 2025, in megawatt hours. It rises each autumn and peaks in winter, at 417,047 MWh on 27 January 2026, and falls to a low of 43,247 MWh on 13 June 2026. Over 1 to 21 October 2026 gas plants generated about 3,421 gigawatt hours, against about 4,054 for the same days of 2025, roughly 16% less. The latest value, for Wednesday 21 October 2026, is 241,431 MWh, the highest daily total since 25 February 2026."
