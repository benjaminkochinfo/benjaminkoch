alt: "Bar chart of October 2026 precipitation in selected German federal states, in litres per square metre, preliminary DWD values. Schleswig-Holstein had 129 against a 1961–1990 mean of 73, North Rhine-Westphalia 108 against 62, Hamburg 107 against 60, Saarland 100 against 77, Lower Saxony 94 against 56. Germany as a whole had about 76 against 56. Bavaria had 64 against 61, Saxony 43 against 47, Brandenburg 35 against 37, and Berlin, the last bar, 31 against a mean of 35."
