alt: "Line chart of rain since 1 September 2026, as running totals of Météo-France daily gauge readings at three stations. Nîmes-Courbessac collects 134.3 mm in the 48 gauge days to 18 October, then 151.6 mm in the single gauge day to 08:00 on 20 October, ending at 285.9 mm. Mont Aigoual goes from 324.6 mm to 516.1 mm with 191.5 mm in that day, and Montpellier airport from 222.8 mm to 334.5 mm with 111.7 mm."
