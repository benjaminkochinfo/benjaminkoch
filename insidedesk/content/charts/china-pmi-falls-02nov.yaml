alt: "Bar chart of how far China's official manufacturing PMI and selected sub-indices fell from September to October 2026, in index points. The headline PMI fell 0.8, from 50.1 to 49.3. Production fell 1.9 to 49.8. New orders fell 1.1 to 49.4. New export orders fell 1.3, from 50.0 to 48.7 (desk arithmetic). The large-firm PMI fell 0.4 to 50.2. Factory-gate prices fell 2.3 to 51.7. Purchase prices fell 4.0 to 56.8, the largest fall. All figures are for October 2026, the latest month."
