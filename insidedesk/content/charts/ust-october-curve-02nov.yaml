alt: "Bar chart of how far US Treasury par yields fell over October 2026, from Wednesday 30 September to Friday 30 October, in basis points. The 3-month yield fell 4, from 4.20% to 4.16%. The 2-year fell 32, from 4.88% to 4.56%. The 5-year fell 38, from 5.09% to 4.71%, the largest move. The 10-year fell 35, from 5.29% to 4.94%. The 30-year fell 33, from 5.64% to 5.31%. The latest values are the 30 October closes."
