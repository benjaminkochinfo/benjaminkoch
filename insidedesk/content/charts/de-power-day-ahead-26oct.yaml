alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 26 October 2026, in euros per megawatt hour. It averages €144.82 in September, peaks at €256.55 on 14 September, reaching €211.94 for delivery on 21 October. It then falls to €148.61 on 22 October and €137.59 on 23 October, drops to €30.12 on Saturday 24 October and €13.12 on Sunday 25 October as storm-driven wind output passed 1,000 GWh a day, and climbs back to €116.57 for delivery on Monday 26 October, the latest value."
