alt: "Line chart of modelled rainfall at an Athens grid point, running total from 1 October. In 2026 the total stays below 10 mm until 10 October, jumps to 62.5 mm by 14 October, reaches 77.5 mm by 24 October and ends at 128.2 mm on Monday 26 October 2026, the latest value. The 1991–2020 average for the same days climbs slowly to 20.1 mm by 26 October."
