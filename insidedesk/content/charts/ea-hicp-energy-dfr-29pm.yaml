alt: "Line chart since January 2025 of euro-area HICP inflation, all items and excluding energy, with the ECB deposit rate. Both inflation lines run between 1.9% and 2.8% through 2025. From March 2026 the all-items line climbs, to 3.2% in May and August and 3.8% in September 2026, the latest value. Inflation excluding energy stays between 2.1% and 2.4% throughout 2026 and is 2.3% in September 2026, the latest value. The deposit rate falls from 3.00% in January 2025 to 2.00% from June 2025, rises to 2.25% in June 2026 and to 2.50% in September 2026, where the ECB left it on 29 October 2026."
