alt: "Line chart of the daily US 10-year and 30-year Treasury par yields from 1 September to 2 November 2026. On 1 September the 10-year is at 4.79% and the 30-year at 5.27%. Both climb through September; the 10-year peaks at 5.31% on 5 October and the 30-year at 5.67% on 7 October. Both then fall through October. On Monday 2 November 2026, the latest value, the 10-year is at 4.91% and the 30-year at 5.28%, one hundredth of a point above where it began September."
