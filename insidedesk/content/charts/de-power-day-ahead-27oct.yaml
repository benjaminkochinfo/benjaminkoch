alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 27 October 2026, in euros per megawatt hour. It averages €144.82 in September and peaks at €256.55 on 14 September. It stands at €211.94 for delivery on 21 October, falls to €30.12 on Saturday 24 October and €13.12 on Sunday 25 October during the storm, recovers to €116.57 on Monday 26 October and rises to €155.11 for delivery on Tuesday 27 October, the latest value."
