alt: "Line chart of the monthly change in the US consumer price index, seasonally adjusted, from April to October 2026. All items rose 0.6% in April, 0.5% in May, fell 0.4% in June, then rose 0.1% in July, 0.4% in August and 0.6% in September. Core prices, excluding food and energy, rose 0.4%, 0.2%, 0.0%, 0.2%, 0.3% and 0.3% over the same months. In October 2026, the latest value, all items rose 0.4% and core rose 0.3%, a third straight 0.3% core reading."
