alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 30 October 2026, in euros per megawatt hour. It reaches a September high of €256.55 on 14 September, falls to €30.12 on Saturday 24 October and €13.12 on Sunday 25 October during the storm, then climbs to €249.21 on 28 October and €314.85 on Thursday 29 October, the highest daily average of 2026 so far. The latest value is €268.62 for delivery on Friday 30 October."
