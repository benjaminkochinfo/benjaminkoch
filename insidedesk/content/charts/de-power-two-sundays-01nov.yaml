alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price for the two weeks from 19 October to 1 November 2026, in euros per megawatt hour. In the first week it falls from €208.44 on Monday 19 October to €30.12 on Saturday 24 October and €13.12 on Sunday 25 October, during the storm. In the second week it climbs to €314.85 on Thursday 29 October, then holds at €268.62 on Friday and €251.42 on Saturday. The latest value is €255.91 for delivery on Sunday 1 November."
