alt: "Line chart since January 2025 of euro-area HICP inflation and the ECB deposit rate. Inflation is 2.5% in January 2025, between 1.9% and 2.2% for the rest of 2025, 1.7% in January 2026 and 1.9% in February, then rises after the energy shock to 3.2% in May, 2.8% in June and 3.8% in September 2026, the latest value. The deposit rate falls from 3.00% to 2.00% by mid-2025, rises to 2.25% in June 2026 and to 2.50% in September 2026, where it stands in October 2026. The ECB decides on 29 October."
