alt: "Bar chart of preliminary rain totals from the Central Florida storm of 1 to 3 November 2026, in millimetres. Grant-Valkaria in Brevard County had 601.7 mm (23.69 inches), Malabar 595.4 mm, Palm Bay 501.7 mm, Melbourne Beach 352.6 mm, Melbourne 333.0 mm, Titusville 294.9 mm and Kennedy Space Center 247.4 mm. Inland, Lake Harney in Seminole County had 214.4 mm and Eatonville in Orange County 188.7 mm, the last figure shown."
