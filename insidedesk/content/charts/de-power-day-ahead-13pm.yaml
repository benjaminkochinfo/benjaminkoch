alt: "Line chart of the daily average German-Luxembourg day-ahead electricity price from 1 September to 14 November 2026, in euros per megawatt hour. It falls to €13.12 on Sunday 25 October, climbs to €314.85 on Thursday 29 October and stays between €242.13 and €275.64 from 2 to 8 November. In the week of 9 November it reads €345.64 on Monday, a record €351.48 on Tuesday, €316.65 on Wednesday, €199.05 on Thursday and €161.74 on Friday. The latest value is €197.72 for delivery on Saturday 14 November, €35.98 above Friday and €62.11 below the previous Saturday, 7 November, at €259.83."
