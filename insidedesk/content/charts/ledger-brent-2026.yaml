alt: "Line chart of the daily Brent spot price from December 2025. It trades between about $60 and $73 until the end of February 2026, then jumps after the strikes on Iran to $126.69 at the end of March and a peak of $138.21 on 7 April, the day of the ceasefire. It falls to $68.53 in early July after the June memorandum, climbs again to above $120 in mid-September after the Saudi pipeline is hit, and is $126.55 on 14 October."
